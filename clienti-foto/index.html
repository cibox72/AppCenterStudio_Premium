<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clienti e Foto - AppCenterStudio Premium</title>
<script src="../tema.js"></script>
<style>
  :root { --bg-color: #f5f1e8; --text-color: #4a4036; --accent-color: #8b7d6b; --card-bg: #fff; --border-color: #d4c5b0; }
  body { font-family: Georgia, serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
  .topbar { background: var(--accent-color); color: #fff; padding: 10px 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .topbar button { background: none; border: 1px solid #fff; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
  .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .card h2 { margin-top: 0; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
  label { display: block; margin: 10px 0 5px; font-weight: bold; }
  input[type="text"], input[type="tel"] { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
  button.btn { background: var(--accent-color); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
  button.btn-danger { background: #b00020; }
  .cliente-box { border-bottom: 1px solid var(--border-color); padding: 15px 0; }
  .cliente-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cliente-id { color: var(--accent-color); font-size: 0.9em; font-weight: bold; }
  .cartella-row { background: #f9f7f4; padding: 12px; margin: 8px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
  .upload-box { background: #faf8f5; border: 2px dashed var(--accent-color); padding: 20px; margin-top: 10px; border-radius: 8px; text-align: center; }
  .hidden { display: none; }
  .file-preview { text-align: left; margin: 10px 0; max-height: 150px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); }
  .file-item { padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.9em; display: flex; justify-content: space-between; }
  .progress { width: 100%; height: 20px; background: #e0e0e0; border-radius: 4px; margin: 10px 0; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent-color); transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8em; }
</style>
</head>
<body>
  <div class="topbar">
    <button onclick="history.back()">← Indietro</button>
    <button onclick="location.href='../index.html'">Home</button>
    <button onclick="backup()">Backup</button>
    <button onclick="ripristina()">Ripristino</button>
  </div>
  <div class="container" id="app"></div>

<script>
const API = 'https://acs-api.mairaluigi.workers.dev';
const R2_PUBLIC = 'https://pub-c2b1d2cacc784ad3b4b10b82631b3b0a.r2.dev';
const KEY = 'clientifoto_db';
let studio = { nome: 'Studio Fotografico', tel: '', codice: '' };
let db = { clienti: [] };

function getParam(n) { return new URLSearchParams(location.search).get(n); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
function genClientId() { return 'CLI-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000); }

async function loadStudio(codice) {
  try {
    const r = await fetch('../licenses.json');
    const l = await r.json();
    const s = l.find(x => x.codice === codice && x.attivo);
    if (s) { studio.nome = s.nome; studio.tel = s.telefono || ''; studio.codice = s.codice; }
  } catch(e) { console.log('Licenze non trovate'); }
}

async function loadDb() {
  try {
    const r = await fetch(`${API}/db-load?key=${KEY}`);
    if (r.ok) db = await r.json() || { clienti: [] };
  } catch(e) { console.error('Errore loadDb', e); }
}

async function saveDb() {
  await fetch(`${API}/db-save?key=${KEY}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(db) });
}

async function backup() {
  const a = document.createElement('a');
  a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
  a.download = "backup_clienti.json";
  a.click();
}

async function ripristina() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = async e => {
    const reader = new FileReader();
    reader.onload = async ev => { db = JSON.parse(ev.target.result); await saveDb(); location.reload(); };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

function renderStudio() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Nuovo Cliente</h2>
      <label>Nome</label><input type="text" id="nome" placeholder="Nome">
      <label>Cognome</label><input type="text" id="cognome" placeholder="Cognome">
      <label>ID Cliente (Univoco per servizi futuri)</label><input type="text" id="idCli" value="${genClientId()}" placeholder="CLI-2026-XXXX">
      <label>Telefono</label><input type="tel" id="tel" placeholder="3331234567">
      <button class="btn" onclick="salvaCliente()">Salva Cliente</button>
    </div>
    <div class="card"><h2>Archivio Clienti</h2><div id="archivio"></div></div>
  `;
  renderArchivio();
}

function salvaCliente() {
  const nome = document.getElementById('nome').value.trim();
  const cognome = document.getElementById('cognome').value.trim();
  const idCli = document.getElementById('idCli').value.trim() || genClientId();
  const tel = document.getElementById('tel').value.trim();
  if (!nome || !cognome) { alert('Inserisci nome e cognome'); return; }
  db.clienti.push({ id: genId(), idCli, nome, cognome, tel, cartelle: [] });
  saveDb().then(() => { alert('Cliente salvato'); renderStudio(); });
}

function renderArchivio() {
  const div = document.getElementById('archivio');
  if (!db.clienti.length) { div.innerHTML = '<p>Nessun cliente</p>'; return; }
  
  let html = '';
  db.clienti.forEach(c => {
    html += `<div class="cliente-box">
      <div class="cliente-header">
        <strong>${c.cognome} ${c.nome}</strong>
        <span class="cliente-id">ID: ${c.idCli}</span>
      </div>`;
    
    if (!c.cartelle.length) {
      html += '<p style="color:#888;font-size:0.9em">Nessuna cartella caricata</p>';
    } else {
      // PUNTO 3 RISOLTO: Mostra SOLO le cartelle con pulsante "Elimina Cartella", niente singole foto con "x"
      c.cartelle.forEach((cart, idx) => {
        const n = cart.foto ? cart.foto.length : 0;
        html += `<div class="cartella-row">
          <span>📁 ${cart.nome} (${n} foto)</span>
          <button class="btn btn-danger" onclick="eliminaCartella('${c.id}',${idx})">X Elimina Cartella</button>
        </div>`;
      });
    }
    
    html += `<div style="margin-top:10px">
      <button class="btn" onclick="toggleUpload('${c.id}')">📁 Carica Cartella</button>
      <button class="btn" onclick="inviaLink('${c.id}')">Invia WhatsApp</button>
      <button class="btn btn-danger" onclick="eliminaCliente('${c.id}')">Elimina Cliente</button>
    </div>
    <div id="up_${c.id}" class="upload-box hidden">
      <h3>Carica cartella per ${c.nome} ${c.cognome}</h3>
      <p style="font-size:0.9em; color:#666;">Seleziona l'intera cartella dal tuo computer (es. "Matrimonio")</p>
      <input type="file" id="f_${c.id}" webkitdirectory directory multiple>
      <div id="fl_${c.id}" class="file-preview hidden"></div>
      <div id="pr_${c.id}" class="hidden"><div class="progress"><div id="pb_${c.id}" class="progress-bar" style="width:0%">0%</div></div></div>
      <div style="margin-top:10px">
        <button class="btn" onclick="uploadCartella('${c.id}')"> Carica Cartella</button>
        <button class="btn" onclick="toggleUpload('${c.id}')">Annulla</button>
      </div>
    </div></div>`;
  });
  div.innerHTML = html;
  
  db.clienti.forEach(c => {
    const inp = document.getElementById(`f_${c.id}`);
    if (inp) inp.onchange = function() {
      const files = this.files;
      const div = document.getElementById(`fl_${c.id}`);
      if (files.length) {
        const name = files[0].webkitRelativePath.split('/')[0] || 'Cartella';
        div.classList.remove('hidden');
        div.innerHTML = `<strong>📁 ${name}</strong><br>${files.length} file selezionati<br>` + 
          Array.from(files).slice(0,5).map(f=>`<div class="file-item"><span>${f.name}</span><span>${(f.size/1024/1024).toFixed(1)} MB</span></div>`).join('') +
          (files.length>5 ? `<div style="color:#888; padding:5px;">+${files.length-5} altri</div>` : '');
      }
    };
  });
}

function toggleUpload(id) { document.getElementById(`up_${id}`).classList.toggle('hidden'); }

async function uploadCartella(clienteId) {
  const inp = document.getElementById(`f_${clienteId}`);
  const files = inp.files;
  if (!files.length) { alert('Seleziona una cartella'); return; }
  
  const cliente = db.clienti.find(c => c.id === clienteId);
  const cartName = files[0].webkitRelativePath.split('/')[0] || 'Cartella_' + Date.now();
  const pb = document.getElementById(`pb_${clienteId}`);
  const pr = document.getElementById(`pr_${clienteId}`);
  pr.classList.remove('hidden');
  
  const cartella = { nome: cartName, foto: [], data: new Date().toISOString() };
  const studioCode = studio.codice || 'demo';
  let successCount = 0;
  
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const pct = Math.round(((i+1)/files.length)*100);
    pb.style.width = pct + '%';
    pb.textContent = pct + '%';
    
    const formData = new FormData();
    formData.append('file', file);
    formData.append('studio', studioCode);
    formData.append('cliente', cliente.idCli);
    formData.append('cartella', cartName);
    formData.append('nomeFile', file.name);
    
    try {
      const res = await fetch(`${API}/upload`, { method: 'POST', body: formData });
      if (res.ok) {
        const data = await res.json();
        cartella.foto.push({ 
          nome: file.name, 
          url: data.url || `${R2_PUBLIC}/${studioCode}/${cliente.idCli}/${cartName}/${file.name}`,
          size: file.size 
        });
        successCount++;
      } else {
        console.error('Upload fallito:', file.name, await res.text());
      }
    } catch(err) {
      console.error('Errore upload:', file.name, err);
    }
  }
  
  if (successCount > 0) {
    cliente.cartelle.push(cartella);
    await saveDb();
    alert(`✅ Cartella "${cartName}" caricata!\nFile: ${successCount}/${files.length}`);
  } else {
    alert('⚠️ Nessun file caricato. Verifica la connessione o contatta l\'assistenza per il worker.');
  }
  renderStudio();
}

function eliminaCartella(clienteId, idx) {
  if (!confirm('Eliminare INTERA questa cartella e tutte le foto al suo interno?')) return;
  const c = db.clienti.find(x => x.id === clienteId);
  if (c) { c.cartelle.splice(idx, 1); saveDb().then(renderArchivio); }
}

function eliminaCliente(id) {
  if (!confirm('Eliminare cliente e tutte le cartelle?')) return;
  db.clienti = db.clienti.filter(x => x.id !== id);
  saveDb().then(renderArchivio);
}

function inviaLink(clienteId) {
  const c = db.clienti.find(x => x.id === clienteId);
  if (!c || !c.tel) { alert('Inserisci il telefono del cliente'); return; }
  
  // PUNTO 4 RISOLTO: URL corretto senza "03 " e senza spazi, punta alla cartella esatta del repo
  const url = `https://cibox72.github.io/AppCenterStudio_Premium/clienti-foto/index.html?id=${c.id}&studio=${encodeURIComponent(studio.nome)}`;
  const msg = `Ciao ${c.nome}, ${studio.nome} ti ha condiviso l'accesso alle tue foto. Clicca qui per visualizzarle: ${url}`;
  const num = c.tel.replace(/\D/g,'');
  window.open(`https://wa.me/${num.startsWith('39')?num:'39'+num}?text=${encodeURIComponent(msg)}`, '_blank');
}

function renderCliente() {
  const id = getParam('id');
  const studioNome = getParam('studio') || 'Studio Fotografico';
  const c = db.clienti.find(x => x.id === id);
  const app = document.getElementById('app');
  
  if (!c) { app.innerHTML = '<div class="card"><h2>Link non valido o scaduto</h2><p>Contatta lo studio per assistenza.</p></div>'; return; }
  
  let html = `<div class="card" style="text-align:center"><h2>Benvenuto/a ${c.nome}</h2><p>Le tue foto sono state curate da <strong>${studioNome}</strong></p><p>ID Cliente: ${c.idCli}</p></div>`;
  
  if (!c.cartelle.length) {
    html += `<div class="card"><p>Le tue cartelle sono in fase di caricamento. Torneremo presto!</p></div>`;
  } else {
    c.cartelle.forEach(cart => {
      html += `<div class="card"><h3>📁 ${cart.nome}</h3><p>${cart.foto.length} foto</p>`;
      cart.foto.forEach(f => {
        html += `<div class="file-item">
          <span>📄 ${f.nome}</span>
          <a href="${f.url}" target="_blank" style="color: var(--accent-color); text-decoration: none;">Visualizza / Scarica</a>
        </div>`;
      });
      html += '</div>';
    });
  }
  app.innerHTML = html;
}

async function init() {
  await loadDb();
  const studioCode = getParam('studio');
  const clienteId = getParam('id');
  
  if (clienteId) {
    renderCliente();
  } else {
    if (studioCode) await loadStudio(studioCode);
    renderStudio();
  }
}

init();
</script>
</body>
</html>
