<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium - Selezione per Album</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--sfondo:#fbfbfb;--carta:#fff;--testo:#111;--soft:#888;--bordo:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sfondo);min-height:100vh;color:var(--testo)}
.container{max-width:1100px;margin:0 auto;padding:20px}
.app-header{text-align:center;margin-bottom:26px;padding:20px;background:var(--carta);border:1px solid var(--bordo);border-radius:14px}
.app-header img{filter:grayscale(100%);height:56px;border-radius:12px;margin-bottom:8px}
.app-header h1{font-family:Georgia,serif;font-size:28px}
.subtitle{color:var(--soft)}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:22px}
.card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
.topbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.btn-primary{padding:10px 20px;background:#111;color:#fff;border:1px solid #111;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#333}
.btn-secondary{padding:10px 18px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;cursor:pointer;font-size:13px}
.btn-secondary:hover{background:#111;color:#fff}
.btn-link{padding:7px 14px;background:#fff;color:#111;border:1px solid #999;border-radius:999px;cursor:pointer;font-size:12px}
.btn-link:hover{border-color:#111}
.btn-del{padding:7px 14px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;cursor:pointer;font-size:12px}
.btn-del:hover{background:#111;color:#fff}
textarea{width:100%;padding:10px;border:1px solid var(--bordo);border-radius:10px;font-size:13px;font-family:inherit}
details{background:#f5f5f5;border:1px solid var(--bordo);border-radius:10px;padding:12px;font-size:13px;margin-top:14px}
summary{cursor:pointer;font-weight:700}
.g-row{background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13px}
.g-row .code{font-family:monospace;font-weight:700}
.chip{display:inline-block;padding:2px 10px;border:1px solid #ccc;border-radius:999px;font-size:11px;color:#555;margin:2px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:#111;color:#fff}
.badge.off{background:#fff;color:#888;border:1px solid #ccc}
select.stato{padding:6px 10px;border:1px solid var(--bordo);border-radius:8px;font-size:12px;background:#fff}
.warn{color:var(--soft);font-size:13px}
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:36px;max-width:430px;width:100%;text-align:center}
.c-head{background:#fff;border-bottom:1px solid var(--bordo);padding:16px;text-align:center;position:relative;top:0;z-index:5}
.c-head img{height:44px;border-radius:50%;filter:grayscale(100%);margin-bottom:6px}
.c-head h1{font-family:Georgia,serif;font-size:18px}
.c-head p{font-size:13px;color:var(--soft);margin-top:4px}
.c-folder-badge{display:inline-block;padding:6px 14px;background:#111;color:#fff;border-radius:999px;font-size:13px;font-weight:600;margin-top:8px}
.count-bar{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--bordo);text-align:center;padding:9px;font-size:13px;font-weight:700;font-family:Georgia,serif}
.count-bar .n{font-family:monospace}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;max-width:1100px;margin:0 auto}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bordo);background:#fff;cursor:pointer}
.ph img{width:100%;height:150px;object-fit:cover;display:block}
.ph .heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #111;color:#111;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ph.sel{border:2px solid #111}
.ph.sel .heart{background:#111;color:#fff}
.ph .fname{font-size:10px;color:var(--soft);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap;z-index:7}
.bottom-bar .n{font-family:monospace;font-size:14px}
.bb-btn{padding:10px 20px;border-radius:999px;border:1px solid #fff;background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.bb-btn.main{background:#fff;color:#111;border-color:#fff}
/* ===== LIGHTBOX ===== */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;justify-content:space-between
