<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium - Selezione per Album</title>
<style>
:root{--sfondo:#fbfbfb;--carta:#fff;--testo:#111;--soft:#888;--bordo:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sfondo);min-height:100vh;color:var(--testo)}
.container{max-width:1100px;margin:0 auto;padding:20px}
.app-header{text-align:center;margin-bottom:26px;padding:20px;background:var(--carta);border:1px solid var(--bordo);border-radius:14px}
.app-header img{filter:grayscale(100%);height:56px;border-radius:12px;margin-bottom:8px}
.app-header h1{font-family:Georgia,serif;font-size:28px}
.subtitle{color:var(--soft)}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:22px}
.card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
.topbar{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.btn-primary{padding:10px 20px;background:#111;color:#fff;border:1px solid #111;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.btn-primary:hover{background:#333}
.btn-secondary{padding:10px 18px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;cursor:pointer;font-size:13px}
.btn-secondary:hover{background:#111;color:#fff}
.btn-link{padding:7px 14px;background:#fff;color:#111;border:1px solid #999;border-radius:999px;cursor:pointer;font-size:12px}
.btn-link:hover{border-color:#111}
.g-row{background:#fff;border:1px solid var(--bordo);border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:13px}
.g-row .code{font-family:monospace;font-weight:700}
.chip{display:inline-block;padding:2px 10px;border:1px solid #ccc;border-radius:999px;font-size:11px;color:#555;margin:2px}
.warn{color:var(--soft);font-size:13px}
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:36px;max-width:430px;width:100%;text-align:center}
/* cliente */
.c-head{background:#fff;border-bottom:1px solid var(--bordo);padding:16px;text-align:center;position:sticky;top:0;z-index:5}
.c-head img{height:44px;border-radius:50%;filter:grayscale(100%);margin-bottom:6px}
.c-head h1{font-family:Georgia,serif;font-size:18px}
.c-head p{font-size:13px;color:var(--soft);margin-top:4px}
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px;max-width:1100px;margin:0 auto}
.ph{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--bordo);background:#fff;cursor:pointer}
.ph img{width:100%;height:150px;object-fit:cover;display:block}
.ph .heart{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #111;color:#111;font-size:18px;display:flex;align-items:center;justify-content:center}
.ph.sel{border:2px solid #111}
.ph.sel .heart{background:#111;color:#fff}
.ph .fname{font-size:10px;color:var(--soft);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;padding:12px;flex-wrap:wrap;z-index:6}
.bottom-bar .n{font-family:monospace;font-size:14px}
.bb-btn{padding:10px 20px;border-radius:999px;border:1px solid #fff;background:transparent;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.bb-btn.main{background:#fff;color:#111;border-color:#fff}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=id=>document.getElementById(id);
const param=n=>new URLSearchParams(location.search).get(n);
window.addEventListener('DOMContentLoaded',()=>{
 const s=param('s');
 if(s)return clientMode(s);
 adminGate();
});
function blocca(msg){document.getElementById('root').innerHTML=`<div class="lock-wrap"><div class="lock-card"><div style="font-size:34px">🔒</div><h2 style="margin:10px 0 6px;font-family:Georgia,serif">Licenza non attiva</h2><p style="color:var(--soft)">${msg}</p></div></div>`}
async function adminGate(){
 const codice=param('studio')||sessionStorage.getItem('studio');
 if(!codice)return blocca('Accedi da AppCenterStudio‑Premium per aprire le applicazioni.');
 sessionStorage.setItem('studio',codice);
 try{
  const l=await(await fetch('../licenses.json?t='+Date.now(),{cache:'no-store'})).json();
  const s=(l.studi||[]).find(x=>x.codice===codice);
  const oggi=new Date().toISOString().slice(0,10);
  if(!s)return blocca('Codice studio non riconosciuto.');
  if(!s.attivo)return blocca('Accesso sospeso. Contatta il fornitore.');
  if(s.scadenza<oggi)return blocca('Prova scaduta. Contatta il fornitore.');
 }catch(e){return blocca('Verifica licenza non riuscita.');}
 renderAdmin(codice);
}
function renderAdmin(codice){
 document.getElementById('root').innerHTML=`
 <div class="container">
  <div class="topbar">
   <div style="display:flex;gap:8px">
    <button class="btn-secondary" onclick="history.back()">← Indietro</button>
    <button class="btn-secondary" onclick="location.href='../index.html'">Home</button>
   </div>
   <div style="display:flex;gap:8px">
    <button class="btn-primary" onclick="backupGlobale()">Backup Globale</button>
    <label class="btn-secondary" style="cursor:pointer">Ripristino Globale<input type="file" hidden accept=".json" onchange="restoreGlobale(event)"></label>
   </div>
  </div>
  <header class="app-header"><img src="../logo.png" alt="logo"><h1>Selezione per Album</h1><p class="subtitle">Il cliente sceglie le foto con il cuore, tu ricevi la lista su WhatsApp</p></header>
  <div class="card"><h2>Archivio Selezioni</h2><div id="archivio"><p class="warn">Caricamento…</p></div></div>
 </div>`;
 loadArchivio(codice);
}
function leggiClienti(){try{return JSON.parse(localStorage.getItem('clientiFotoData'))||{clients:[]}}catch(e){return{clients:[]}}}
async function loadArchivio(codice){
 const data=leggiClienti();
 const site=localStorage.getItem('netlify_sitename');
 const box=$('archivio');
 if(!data.clients.length){box.innerHTML=`<p class="warn">Nessun cliente.</p><button class="btn-primary" style="margin-top:10px" onclick="location.href='../clienti-foto/?studio=${codice}'">Vai a Clienti & Foto</button>`;return;}
 if(!site){box.innerHTML='<p class="warn">Collega prima il sito Netlify nell\'app Clienti & Foto.</p>';return;}
 box.innerHTML=data.clients.slice().reverse().map(c=>`
  <div class="g-row"><b>${esc(c.nome)} ${esc(c.cognome)}</b> · <span class="code">${c.codice}</span><br>
  <span id="cnt-${c.codice}"><span class="chip">…</span></span>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
   <button class="btn-link" onclick="copiaSel('${c.codice}',this)">Copia link selezione</button>
   <button class="btn-link" onclick="window.open(linkSel('${c.codice}'),'_blank')">Apri selezione</button>
   <button class="btn-link" onclick="location.href='../clienti-foto/?studio=${codice}'">Gestisci foto</button>
  </div></div>`).join('');
 for(const c of data.clients){
  try{
   const m=await(await fetch(`https://${site}.netlify.app/${c.codice}/manifest.json?t=${Date.now()}`,{cache:'no-store'})).json();
   $('cnt-'+c.codice).innerHTML=`<span class="chip">${(m.photos||[]).length} foto</span>`;
  }catch(e){$('cnt-'+c.codice).innerHTML='<span class="chip">nessuna foto</span>';}
 }
}
function linkSel(codice){
 const site=localStorage.getItem('netlify_sitename');
 return new URL('../selezione-album/?s='+encodeURIComponent(site+'/'+codice),location.href).href;
}
function copiaSel(codice,btn){
 navigator.clipboard.writeText(linkSel(codice)).then(()=>{const t=btn.textContent;btn.textContent='Copiato!';setTimeout(()=>btn.textContent=t,1500);});
}
function backupGlobale(){
 const d={};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
 const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='AppCenterStudio_BACKUP_GLOBALE_'+new Date().toISOString().slice(0,10)+'.json';a.click();
 alert('Backup globale scaricato.');
}
function restoreGlobale(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{try{
  const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
  if(typeof d!=='object')throw new Error('File non valido.');
  if(!confirm(`Ripristinare il backup globale (${Object.keys(d).length} voci)?\nI dati attuali di TUTTE le app verranno sostituiti.`))return;
  Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
  alert('Backup ripristinato. La pagina si ricarica.');location.reload();
 }catch(err){alert('Errore: '+err.message)}};
 r.readAsText(f);e.target.value='';
}
/* ===== CLIENTE ===== */
let PH=[],BASE='',STUDIO=null,MAN=null,SEL=new Set();
function errPage(msg){document.getElementById('root').innerHTML=`<div class="lock-wrap"><div class="lock-card"><div style="font-size:34px">❌</div><h2 style="margin:10px 0 6px;font-family:Georgia,serif">Selezione non disponibile</h2><p style="color:var(--soft)">${msg}</p></div></div>`}
async function clientMode(s){
 const parts=decodeURIComponent(s).split('/');
 if(parts.length<2)return errPage('Link non valido. Contatta lo studio.');
 const site=parts[0],code=parts.slice(1).join('/');
 BASE='https://'+site+'.netlify.app/'+code;
 try{MAN=await(await fetch(BASE+'/manifest.json?t='+Date.now(),{cache:'no-store'})).json();}catch(e){}
 if(!MAN||!MAN.photos||!MAN.photos.length)return errPage('Nessuna foto pubblicata. Contatta lo studio.');
 try{STUDIO=await(await fetch('https://'+site+'.netlify.app/studio.json?t='+Date.now(),{cache:'no-store'})).json();}catch(e){STUDIO={}}
 PH=MAN.photos;
 document.title='Selezione foto — '+(MAN.nome||'');
 const logo=STUDIO.logo?'https://'+site+'.netlify.app/'+STUDIO.logo:'';
 document.getElementById('root').innerHTML=`
 <div class="c-head">${logo?`<img src="${logo}" alt="logo"><br>`:''}
  <h1>${esc(STUDIO.nome||'Studio Fotografico')}</h1>
  <p>${esc(STUDIO.messaggio||'Tocca il cuore sulle foto che vuoi nell\'album.')}</p>
 </div>
 <div class="ph-grid" id="grid"></div>
 <div class="bottom-bar">
  <span class="n" id="selCount">0 selezionate</span>
  <button class="bb-btn" onclick="SEL.clear();draw();">Azzera</button>
  <button class="bb-btn main" onclick="inviaSel()">Invia selezione</button>
 </div>`;
 draw();
}
function photoUrl(i){return BASE+'/'+PH[i].split('/').map(encodeURIComponent).join('/')}
function draw(){
 $('grid').innerHTML=PH.map((p,i)=>`
  <div class="ph ${SEL.has(p)?'sel':''}" onclick="toggle(${i})">
   <img src="${photoUrl(i)}" loading="lazy" alt="">
   <div class="heart">${SEL.has(p)?'♥':'♡'}</div>
   <div class="fname">${esc(p.split('/').pop())}</div>
  </div>`).join('');
 $('selCount').textContent=SEL.size+' selezionate';
}
function toggle(i){SEL.has(PH[i])?SEL.delete(PH[i]):SEL.add(PH[i]);draw();}
function inviaSel(){
 if(!SEL.size)return alert('Nessuna foto selezionata: tocca il cuore sulle foto che vuoi.');
 const elenco=[...SEL].map(p=>'• '+p.split('/').pop()).join('\n');
 const testo=`SELEZIONE ALBUM — ${MAN.nome||''} ${MAN.cognome||''}\nCodice: ${MAN.codice||''}\nFoto scelte (${SEL.size}):\n${elenco}`;
 if(STUDIO.whatsapp){
  if(!confirm('Inviare la selezione di '+SEL.size+' foto allo studio su WhatsApp?'))return;
  window.open('https://wa.me/'+STUDIO.whatsapp+'?text='+encodeURIComponent(testo),'_blank');
 }else{
  navigator.clipboard.writeText(testo).then(()=>alert('Nessun WhatsApp configurato dallo studio: lista copiata, incollala in un messaggio.'));
 }
}
function esc(t){return t?t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
</script>
</body>
</html>
