<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>07 Agenda - AppCenterStudio Premium</title>
<style>
:root{--crema:#f4efe7;--carta:#fbf9f5;--taupe:#a3937d;--taupe-scuro:#6f6353;--beige:#e9dfcd;--testo:#4a4237;--soft:#9b8f7d;--bordo:#e5dccb;--salvia:#7d8a5f}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--crema);color:var(--testo);line-height:1.6;min-height:100vh}
.topbar{display:flex;gap:8px;padding:12px 18px;background:rgba(251,249,245,0.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);position:sticky;top:0;z-index:100;flex-wrap:wrap}
.topbar button,.topbar label{padding:8px 18px;background:#fff;border:1px solid var(--taupe);cursor:pointer;font-size:12px;border-radius:999px;font-family:inherit;color:var(--taupe-scuro);margin:0;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.topbar button:hover,.topbar label:hover{background:var(--taupe);color:#fff}
.hero-agenda{position:relative;overflow:hidden;text-align:center;padding:44px 20px 26px}
.hero-agenda .blob{position:absolute;opacity:.65;z-index:0}
.blob.b1{width:280px;height:230px;top:-70px;left:-80px;background:var(--beige);border-radius:60% 40% 55% 45%/50% 60% 40% 50%}
.blob.b2{width:320px;height:270px;bottom:-110px;right:-90px;background:#ddd0b8;opacity:.45;border-radius:45% 55% 40% 60%/55% 45% 60% 40%}
.blob.b3{width:140px;height:120px;top:10px;right:18%;background:var(--beige);opacity:.5;border-radius:50% 50% 40% 60%/60% 40% 55% 45%}
.hero-inner{position:relative;z-index:1}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--soft)}
h1.big{font-family:Georgia,serif;font-size:54px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--taupe-scuro);margin:8px 0 4px}
.sub{font-size:12px;letter-spacing:.45em;text-transform:uppercase;color:var(--taupe)}
.rings{position:absolute;left:6%;top:14px;width:110px;opacity:.5;z-index:0}
.leaf{position:absolute;right:7%;bottom:2px;width:86px;opacity:.55;z-index:0}
.container{max-width:1180px;margin:0 auto;padding:10px 20px 40px}
.card{background:var(--carta);border:1px solid var(--bordo);padding:26px;margin-bottom:24px;border-radius:18px;box-shadow:0 8px 24px rgba(120,100,70,.08)}
.card h2{font-family:Georgia,serif;font-size:20px;color:var(--taupe-scuro);padding-bottom:10px;border-bottom:1px solid var(--bordo)}
.btn{display:inline-block;padding:9px 22px;background:var(--taupe);color:#fff;border:none;cursor:pointer;font-size:13px;border-radius:999px;margin:4px 2px;font-weight:600;letter-spacing:.05em}
.btn:hover{background:var(--taupe-scuro)}
.btn-secondary{background:#fff;color:var(--taupe-scuro);border:1px solid var(--taupe)}
.btn-secondary:hover{background:var(--taupe);color:#fff}
.mini{border:1px solid var(--taupe);background:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:11px;color:var(--taupe-scuro);text-transform:uppercase;letter-spacing:.05em}
.mini:hover{background:var(--beige)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bordo);margin:5px 0;font-family:inherit;border-radius:10px;background:#fff;color:var(--testo)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--taupe)}
label{display:block;margin-top:10px;font-size:11px;font-weight:700;color:var(--soft);text-transform:uppercase;letter-spacing:.08em}
.hint{font-size:12px;color:var(--soft)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.cal-head h2{margin:0;border:none;padding:0}
.cal-nav{display:flex;gap:6px;align-items:center}
.cal-nav .mese{font-family:Georgia,serif;font-size:19px;font-weight:700;min-width:180px;text-align:center;text-transform:capitalize;color:var(--taupe-scuro);letter-spacing:.06em}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-dow{font-size:10px;font-weight:700;text-align:center;padding:6px 0;color:var(--taupe);letter-spacing:.18em;text-transform:uppercase}
.cal-day{min-height:90px;background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:6px;cursor:pointer;position:relative;display:flex;flex-direction:column;transition:all .15s;box-shadow:0 1px 4px rgba(120,100,70,.05)}
.cal-day:hover{background:var(--crema);border-color:var(--taupe)}
.cal-day.other{background:var(--crema);color:#c4b8a2;border-color:var(--bordo);opacity:.7}
.cal-day.today{background:var(--beige);border:2px solid var(--taupe)}
.cal-day.selected{background:var(--taupe);border-color:var(--taupe-scuro);box-shadow:0 6px 16px rgba(111,99,83,.35)}
.cal-day.selected .cal-n{color:#fff}
.cal-n{font-size:13px;font-weight:700;margin-bottom:4px;color:var(--taupe-scuro)}
.cal-ev{flex:1;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.ev-row{font-size:10px;line-height:1.25;padding:2px 5px;border-radius:999px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:4px;align-items:center;font-weight:600}
.ev-row .ev-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ev-row.contratto{background:var(--taupe-scuro);color:#fff}
.ev-row.contratto .ev-dot{background:var(--beige)}
.ev-row.appuntamento{background:#e6ead9;color:#55663a}
.ev-row.appuntamento .ev-dot{background:var(--salvia)}
.ev-row.altro{background:var(--beige);color:#7a5a20}
.ev-row.altro .ev-dot{background:#b48840}
.cal-more{font-size:10px;color:var(--soft);padding:1px 4px}
.day-panel{background:var(--carta);border:1px solid var(--bordo);border-radius:18px;padding:24px;margin-top:18px;box-shadow:0 8px 24px rgba(120,100,70,.08)}
.day-panel h3{margin-top:0;font-family:Georgia,serif;color:var(--taupe-scuro);display:flex;justify-content:space-between;align-items:center;gap:10px;text-transform:capitalize}
.day-panel h3 span{font-size:12px;color:var(--soft);font-weight:400;text-transform:uppercase;letter-spacing:.1em}
.day-list{margin:12px 0}
.day-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px;background:#fff;border:1px solid var(--bordo);border-radius:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(120,100,70,.05)}
.day-item .ora{font-family:monospace;font-weight:700;font-size:14px;min-width:50px;color:var(--taupe-scuro)}
.day-item .info{flex:1}
.day-item .info .titolo{font-weight:700;font-size:15px;font-family:Georgia,serif;color:var(--taupe-scuro)}
.day-item .info .tipo{display:inline-block;padding:2px 12px;border-radius:999px;font-size:10px;font-weight:700;margin-top:3px;text-transform:uppercase;letter-spacing:.08em}
.day-item .info .tipo.contratto{background:var(--taupe-scuro);color:#fff}
.day-item .info .tipo.preventivo{background:var(--soft);color:#fff}
.day-item .info .tipo.appuntamento{background:var(--salvia);color:#fff}
.day-item .info .tipo.altro{background:#b48840;color:#fff}
.day-item .info .note{font-size:12px;color:#7d7261;margin-top:4px;white-space:pre-wrap}
.day-item .acts{display:flex;gap:4px}
.warn-box{background:var(--beige);border:1px solid #d3c3a2;border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:12px;color:#6b4d1a}
.warn-box b{color:#4d3610}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.form-row.full{grid-template-columns:1fr}
@media(max-width:800px){.cal-grid{gap:2px}.cal-day{min-height:64px;padding:4px}.cal-n{font-size:11px}.ev-row{font-size:9px;padding:1px 4px}.cal-dow{font-size:9px}.form-row{grid-template-columns:1fr}h1.big{font-size:36px;letter-spacing:.14em}}
</style>
</head>
<body>

<div class="topbar">
<button onclick="history.back()">← Indietro</button>
<button onclick="goHome()">Home</button>
<button onclick="promemoriaWA()">Promemoria WhatsApp</button>
<button onclick="backupGlobale()">Backup globale</button>
<label style="cursor:pointer">Ripristino globale<input type="file" hidden accept=".json" onchange="ripristinoGlobale(event)"></label>
</div>

<div class="hero-agenda">
 <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
 <svg class="rings" viewBox="0 0 120 120" fill="none"><g stroke="#a3937d" stroke-width="2"><circle cx="60" cy="60" r="18"/><circle cx="60" cy="60" r="30"/><circle cx="60" cy="60" r="42"/><circle cx="60" cy="60" r="54"/></g></svg>
 <svg class="leaf" viewBox="0 0 120 160"><g fill="#b7a88f"><path d="M60 150 C60 90 60 40 60 10" stroke="#b7a88f" stroke-width="3" fill="none"/><path d="M60 40 C40 35 28 20 26 8 C45 12 58 24 60 40Z"/><path d="M60 40 C80 35 92 20 94 8 C75 12 62 24 60 40Z"/><path d="M60 72 C40 67 28 52 26 40 C45 44 58 56 60 72Z"/><path d="M60 72 C80 67 92 52 94 40 C75 44 62 56 60 72Z"/><path d="M60 104 C40 99 28 84 26 72 C45 76 58 88 60 104Z"/><path d="M60 104 C80 99 92 84 94 72 C75 76 62 88 60 104Z"/></g></svg>
 <div class="hero-inner">
  <div class="eyebrow">AppCenterStudio Premium</div>
  <h1 class="big">Agenda</h1>
  <div class="sub">Dello Studio</div>
 </div>
</div>

<div class="container">

<div class="card">
 <div class="cal-head">
  <h2>Calendario impegni</h2>
  <div class="cal-nav">
   <button class="btn btn-secondary" onclick="calOggi()">Oggi</button>
   <button class="btn btn-secondary" onclick="calPrecedente()">‹</button>
   <span class="mese" id="calMese"></span>
   <button class="btn btn-secondary" onclick="calSuccessivo()">›</button>
  </div>
 </div>
 <div class="cal-grid" id="calDow"></div>
 <div class="cal-grid" id="calGrid" style="margin-top:4px"></div>
 <p class="hint" style="margin-top:12px">I <b>contratti</b> firmati compaiono automaticamente. I <b>preventivi</b> futuri in verde salvia chiaro. Gli <b>appuntamenti</b> li aggiungi tu cliccando su un giorno. <b>Promemoria WhatsApp</b> manda al numero dello studio gli impegni di oggi.</p>
</div>

<div id="dayPanel"></div>
</div>

<script>
let studioCodice=new URLSearchParams(location.search).get('studio')||sessionStorage.getItem('studio')||'';
if(studioCodice)sessionStorage.setItem('studio',studioCodice);
let DB=JSON.parse(localStorage.getItem('appcenter_db_v1')||'null')||{preventivi:[],clienti:[]};
let agenda=JSON.parse(localStorage.getItem('appcenter_agenda')||'[]');
function saveAgenda(){localStorage.setItem('appcenter_agenda',JSON.stringify(agenda));}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const fmtData=d=>{if(!d)return'';const p=String(d).split('-');if(p.length!==3){const dt=new Date(d+'T00:00:00');return isNaN(dt)?d:dt.toLocaleDateString('it-IT');}return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function primoNumero(s){const m=String(s||'').match(/\d{6,15}/);return m?m[0]:'';}

function goHome(){location.href='../benvenuto.html'+(studioCodice?'?studio='+studioCodice:'');}

function promemoriaWA(){
 const oggi=today();
 const ev=eventiDi(oggi);
 if(!ev.length)return alert('Nessun impegno per oggi.');
 const ident=JSON.parse(localStorage.getItem('studioIdent')||'{}');
 const cont=JSON.parse(localStorage.getItem('studioContatti')||'{}');
 const num=primoNumero(ident.whatsapp)||primoNumero(ident.telefono)||primoNumero(cont.whatsapp);
 if(!num)return alert('Numero dello studio mancante: salvalo in Identità studio (app 03 Clienti & Foto).');
 let msg='AGENDA '+fmtData(oggi)+'\n';
 ev.forEach(e=>{msg+=(e.ora?e.ora+' ':'')+'- '+e.titolo+(e.tipo?' ('+e.tipo+')':'')+'\n';});
 if(navigator.clipboard)navigator.clipboard.writeText(msg).catch(()=>{});
 window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
 alert('Promemoria copiato e WhatsApp aperto.\nSe il messaggio non compare da solo nella chat, incollalo con Cmd+V e premi invia.');
}

function backupGlobale(){
 const d={};
 for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
 const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='AppCenterStudio_BACKUP_GLOBALE_'+today()+'.json';a.click();
 alert('Backup globale scaricato: contiene tutti i dati di tutte le app.');
}
function ripristinoGlobale(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{try{
  const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
  if(typeof d!=='object')throw new Error('File non valido.');
  if(!confirm('Ripristinare il backup globale ('+Object.keys(d).length+' voci)?'))return;
  Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
  alert('Backup ripristinato. La pagina si ricarica.');location.reload();
 }catch(err){alert('Errore: '+err.message)}};
 r.readAsText(f);e.target.value='';
}

/* ===== CALENDARIO ===== */
let calYear,calMonth,calSelected=null;

function eventiDi(d){
 const lista=[];
 (DB.preventivi||[]).forEach(p=>{
  if(!p.dataServizio||p.dataServizio!==d)return;
  lista.push({
   tipo:p.stato==='contratto'?'contratto':'preventivo',
   titolo:(p.tipoServizio||'Servizio')+' — '+[p.clienteA.nome,p.clienteA.cognome].filter(Boolean).join(' '),
   ora:'',
   note:(p.numero||'')+(p.chiesa?' · '+p.chiesa:'')+(p.location?' · '+p.location:''),
   readOnly:true,refId:p.id,stato:p.stato
  });
 });
 (agenda||[]).forEach(a=>{
  if(!a.data||a.data!==d)return;
  lista.push({tipo:a.tipo||'appuntamento',titolo:a.titolo||'(senza titolo)',ora:a.ora||'',note:a.note||'',readOnly:false,refId:a.id});
 });
 lista.sort((a,b)=>(a.ora||'').localeCompare(b.ora||''));
 return lista;
}

function initCal(){
 const now=new Date();
 calYear=now.getFullYear();calMonth=now.getMonth();calSelected=today();
 document.getElementById('calDow').innerHTML=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(d=>'<div class="cal-dow">'+d+'</div>').join('');
}
function renderCalendario(){
 if(calYear===undefined)initCal();
 const mesi=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
 document.getElementById('calMese').textContent=mesi[calMonth]+' '+calYear;
 const primo=new Date(calYear,calMonth,1);
 let dow0=primo.getDay();dow0=(dow0===0?6:dow0-1);
 const giorniMese=new Date(calYear,calMonth+1,0).getDate();
 const giorniMesePrec=new Date(calYear,calMonth,0).getDate();
 const celle=[];
 const oggiStr=today();
 for(let i=dow0-1;i>=0;i--){
  const d=giorniMesePrec-i;
  celle.push({n:d,date:new Date(calYear,calMonth-1,d).toISOString().slice(0,10),other:true});
 }
 for(let d=1;d<=giorniMese;d++){
  celle.push({n:d,date:new Date(calYear,calMonth,d).toISOString().slice(0,10),other:false});
 }
 const resto=celle.length%7;
 if(resto){for(let i=1;i<=7-resto;i++){celle.push({n:i,date:new Date(calYear,calMonth+1,i).toISOString().slice(0,10),other:true});}}
 document.getElementById('calGrid').innerHTML=celle.map(c=>{
  const ev=eventiDi(c.date);
  const contratti=ev.filter(e=>e.tipo==='contratto');
  const appunt=ev.filter(e=>e.tipo==='appuntamento'||e.tipo==='altro');
  const preventivi=ev.filter(e=>e.tipo==='preventivo');
  let cls='cal-day';if(c.other)cls+=' other';if(c.date===oggiStr)cls+=' today';if(c.date===calSelected)cls+=' selected';
  const MAX=3;let evHtml='';let shown=0;
  contratti.slice(0,MAX-shown).forEach(e=>{evHtml+='<div class="ev-row contratto"><span class="ev-dot"></span>'+esc(e.titolo)+'</div>';shown++;});
  appunt.slice(0,MAX-shown).forEach(e=>{evHtml+='<div class="ev-row '+(e.tipo==='altro'?'altro':'appuntamento')+'"><span class="ev-dot"></span>'+(e.ora?e.ora+' ':'')+esc(e.titolo)+'</div>';shown++;});
  preventivi.slice(0,MAX-shown).forEach(e=>{evHtml+='<div class="ev-row appuntamento" style="opacity:.6"><span class="ev-dot"></span>'+esc(e.titolo)+'</div>';shown++;});
  if(ev.length>MAX)evHtml+='<div class="cal-more">+'+(ev.length-MAX)+'</div>';
  return '<div class="'+cls+'" onclick="selectDay(\''+c.date+'\')"><div class="cal-n">'+c.n+'</div><div class="cal-ev">'+evHtml+'</div></div>';
 }).join('');
}
function selectDay(d){calSelected=d;renderCalendario();renderDayPanel();}
function calPrecedente(){calMonth--;if(calMonth<0){calMonth=11;calYear--;}renderCalendario();}
function calSuccessivo(){calMonth++;if(calMonth>11){calMonth=0;calYear++;}renderCalendario();}
function calOggi(){const now=new Date();calYear=now.getFullYear();calMonth=now.getMonth();calSelected=today();renderCalendario();renderDayPanel();}

function renderDayPanel(){
 const box=document.getElementById('dayPanel');if(!box)return;
 if(!calSelected){box.innerHTML='';return;}
 const ev=eventiDi(calSelected);
 const dt=new Date(calSelected+'T00:00:00');
 const giorni=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
 const mesi=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
 const label=giorni[dt.getDay()]+' '+dt.getDate()+' '+mesi[dt.getMonth()]+' '+dt.getFullYear();
 let warn='';
 const contratti=ev.filter(e=>e.tipo==='contratto');
 if(contratti.length)warn='<div class="warn-box"><b>Data impegnata:</b> ci '+(contratti.length===1?"è un contratto":"sono "+contratti.length+" contratti")+' in questo giorno. Puoi comunque aggiungere altri appuntamenti.</div>';
 const listHtml=ev.length?ev.map(e=>{
  const acts=e.readOnly
   ?'<button class="mini" data-openprev="'+e.refId+'">Apri contratto</button>'
   :'<button class="mini" data-editapp="'+e.refId+'">Modifica</button> <button class="mini" data-delapp="'+e.refId+'">Elimina</button>';
  return '<div class="day-item"><div class="ora">'+(e.ora||'—')+'</div><div class="info"><div class="titolo">'+esc(e.titolo)+'</div><span class="tipo '+e.tipo+'">'+(e.tipo==='contratto'?'Contratto':e.tipo==='preventivo'?'Preventivo':e.tipo==='appuntamento'?'Appuntamento':'Altro')+'</span>'+(e.note?'<div class="note">'+esc(e.note)+'</div>':'')+'</div><div class="acts">'+acts+'</div></div>';
 }).join(''):'<p class="hint">Nessun impegno in questa giornata.</p>';
 box.innerHTML='<div class="day-panel"><h3>'+label+'<span>'+ev.length+' impegni</span></h3>'+warn+'<div class="day-list">'+listHtml+'</div>'+
  '<div style="margin-top:18px;border-top:1px solid var(--bordo);padding-top:16px"><h3 style="margin:0 0 10px">+ Nuovo appuntamento</h3>'+
  '<div class="form-row"><div><label>Data</label><input type="date" id="appData" value="'+calSelected+'"></div><div><label>Ora (opzionale)</label><input type="time" id="appOra"></div></div>'+
  '<div class="form-row"><div><label>Titolo</label><input id="appTitolo" placeholder="Es. Sopralluogo, incontro cliente..."></div><div><label>Tipo</label><select id="appTipo"><option value="appuntamento">Appuntamento</option><option value="altro">Altro impegno</option></select></div></div>'+
  '<div class="form-row full"><div><label>Note</label><textarea id="appNote" rows="2" placeholder="Dettagli..."></textarea></div></div>'+
  '<button class="btn" onclick="salvaAppuntamento()">Aggiungi al giorno</button></div></div>';
 box.onclick=e=>{
  if(e.target.dataset.openprev){location.href='../preventivi-contratti/?studio='+studioCodice;}
  if(e.target.dataset.editapp){modificaAppuntamento(e.target.dataset.editapp);}
  if(e.target.dataset.delapp){if(confirm('Eliminare questo appuntamento?')){agenda=agenda.filter(a=>a.id!==e.target.dataset.delapp);saveAgenda();renderDayPanel();renderCalendario();}}
 };
}
function salvaAppuntamento(){
 const data=document.getElementById('appData').value;
 const titolo=document.getElementById('appTitolo').value.trim();
 if(!data||!titolo)return alert('Data e titolo sono obbligatori.');
 agenda.push({id:uid(),data,ora:document.getElementById('appOra').value,titolo,tipo:document.getElementById('appTipo').value,note:document.getElementById('appNote').value.trim()});
 saveAgenda();calSelected=data;renderDayPanel();renderCalendario();
}
function modificaAppuntamento(id){
 const a=agenda.find(x=>x.id===id);if(!a)return;
 const titolo=prompt('Titolo:',a.titolo);if(titolo===null)return;
 const data=prompt('Data (AAAA-MM-DD):',a.data);if(!data)return;
 a.titolo=titolo;a.data=data;
 a.ora=prompt('Ora (HH:MM, vuoto se senza):',a.ora||'');
 a.note=prompt('Note:',a.note||'');
 saveAgenda();calSelected=data;renderDayPanel();renderCalendario();
}

function checkPromemoria(){
 const oggi=today();
 const prom=agenda.filter(a=>a.data===oggi);
 const contratti=(DB.preventivi||[]).filter(p=>p.stato==='contratto'&&p.dataServizio===oggi);
 if(!prom.length&&!contratti.length)return;
 if('Notification' in window&&Notification.permission==='granted'){
  let msg='Oggi: ';
  prom.forEach(p=>{msg+=p.titolo+' '+(p.ora||'')+', ';});
  contratti.forEach(c=>{msg+=c.tipoServizio+' ('+c.clienteA.nome+') ';});
  new Notification('AppCenterStudio Premium - Agenda',{body:msg});
 }else if('Notification' in window&&Notification.permission!=='denied'){
  Notification.requestPermission();
 }
}

initCal();
renderCalendario();
renderDayPanel();
checkPromemoria();
</script>
</body>
