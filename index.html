<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium - Dashboard</title>
<style>
:root{--b:#e2e4e9;--s:#8a8f98;--nero:#111;--ombra:0 6px 18px rgba(15,20,40,.08);--acc:#a3937d;--scuro:#6f6353;--carta:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--nero);min-height:100vh;background-color:#e9ebef;background-image:radial-gradient(ellipse 62% 52% at 50% 45%, rgba(255,255,255,.92), rgba(255,255,255,0) 70%),repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 26px, rgba(255,255,255,.55) 26px 30px, rgba(255,255,255,0) 30px 74px, rgba(255,255,255,.35) 74px 77px, rgba(255,255,255,0) 77px 120px);background-attachment:fixed;padding:20px}
.wrap{max-width:1100px;margin:0 auto}
.mono{width:56px;height:56px;border-radius:50%;background:var(--nero);color:#fff;font-family:Georgia,serif;font-size:20px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:1px;margin-bottom:10px}
.hd{text-align:center;padding:30px;background:#fff;border:1px solid var(--b);border-radius:16px;margin-bottom:22px;box-shadow:var(--ombra)}
.hd h1{font-family:Georgia,serif;font-size:28px;color:var(--scuro)}
.hd p{color:var(--s)}
.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--ombra)}
.card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:12px;color:var(--scuro)}
.fg{margin-bottom:10px}.fg label{display:block;font-weight:600;font-size:12px;margin-bottom:4px;color:#555}
.fg input{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;font-size:13px;background:#fff}
.bp{padding:10px 20px;background:var(--acc);color:#fff;border:none;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;width:100%}
.bp:hover{background:var(--scuro)}
.row{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.lw{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lc{background:#fff;border:1px solid var(--b);border-radius:20px;padding:38px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(15,20,40,.15)}
.stato{display:inline-block;padding:3px 10px;border-radius:999px;color:#fff;font-size:11px;font-weight:700}
.debug-box { background: #ffebee; border: 2px solid #c62828; color: #c62828; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-family: monospace; display: none; text-align: left; }
</style>
</head>
<body>

<!-- Riquadro di diagnostica degli errori -->
<div id="debugConsole" class="debug-box">
  <h3>🚨 Rilevato Errore di Caricamento Sistema:</h3>
  <p id="debugErrorText"></p>
</div>

<div id="root">Caricamento dell'applicazione...</div>

<script>
// Blocco di intercettazione globale degli errori prima di avviare il pannello
window.onerror = function(msg, url, line) {
  document.getElementById('debugConsole').style.display = 'block';
  document.getElementById('debugErrorText').innerHTML = '<b>Messaggio:</b> ' + msg + '<br><b>File:</b> ' + url + '<br><b>Linea:</b> ' + line;
  if(document.getElementById('root')) document.getElementById('root').innerText = "Impossibile aprire l'app. Controlla la stringa di errore qui sopra.";
  return false;
};

const BASE = window.location.origin + '/';
const $=id=>document.getElementById(id);

// Configurazione statica di emergenza dello studio nel caso licenses.json fallisse
const backupStudioData = {
  "studi": [
    {
      "codice": "st-001",
      "nome": "G&LStudio Luigi",
      "attivo": true,
      "scadenza": "2026-09-17",
      "utente": "glstudioluigi",
      "password": "4uuJEHVZ"
    }
  ]
};

window.addEventListener('DOMContentLoaded', () => {
  if (sessionStorage.getItem('admin') === '1') {
    renderDash();
  } else {
    renderLogin();
  }
});

function renderLogin(){
  $('root').innerHTML = `
    <div class="lw">
      <div class="lc">
        <div class="mono">AC</div>
        <h1 style="font-family:Georgia,serif;font-size:22px;margin-bottom:6px;">AppCenterStudio</h1>
        <p style="color:var(--s);margin-bottom:16px">Accesso Amministratore</p>
        <div class="fg"><label>Utente</label><input id="lu" value="admin"></div>
        <div class="fg"><label>Password</label><input id="lp" type="password" value="58879@Stella"></div>
        <button class="bp" onclick="login()">Entra nel Pannello</button>
        <div id="lerr" style="color:#a33;font-size:13px;margin-top:10px"></div>
      </div>
    </div>
  `;
}

function login(){
  if($('lu').value.trim()==='admin' && $('lp').value==='58879@Stella'){
    sessionStorage.setItem('admin','1');
    renderDash();
  } else {
    $('lerr').textContent='Credenziali non valide.';
  }
}

async function leggiLicenze(){
  try {
    const r = await fetch(BASE + 'licenses.json?t=' + Date.now(), {cache: 'no-store'});
    if(!r.ok) throw new Error();
    return await r.json();
  } catch(e) {
    console.log("Uso database interno di emergenza");
    return backupStudioData;
  }
}

async function renderDash() {
  $('root').innerHTML = `
    <div class="wrap">
      <div class="hd">
        <div class="mono">ADM</div>
        <h1>Pannello di Controllo Fornitore</h1>
        <p>Configurazione e diagnostica delle licenze degli studi collegati</p>
      </div>
      <div class="card">
        <h2>Anagrafica Studi e Licenze Attive (licenses.json)</h2>
        <div id="studiContainer">Elaborazione database...</div>
      </div>
      <button class="bp" style="background:#444;" onclick="sessionStorage.clear(); location.reload();">Sconnetti Amministratore</button>
    </div>
  `;
  
  const lic = await leggiLicenze();
  const studiLista = lic.studi || [];
  
  if(!studiLista.length) {
    $('studiContainer').innerHTML = '<p class="soft">Nessuno studio configurato nel file licenses.json.</p>';
  } else {
    $('studiContainer').innerHTML = studiLista.map(s => `
      <div class="row">
        <div>
          <strong>${s.nome}</strong> (Codice: <code>${s.codice}</code>)<br>
          <span style="color:var(--s)">Utente: ${s.utente} | Scadenza: ${s.scadenza}</span>
        </div>
        <div>
          <span class="stato" style="background:${s.attivo ? '#2e7d32' : '#8c2f2f'}">${s.attivo ? 'LICENZA ATTIVA' : 'SOSPESO'}</span>
        </div>
      </div>
    `).join('');
  }
}
</script>
</body>
</html>
