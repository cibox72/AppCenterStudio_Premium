<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium — Portale</title>
<style>
:root{--sfondo:#f6f4f0;--carta:#fff;--testo:#2e2e38;--soft:#8a8a96;--accento:#6f7f8f;--bordo:#e6e2da;--ok:#7d9b8a;--ko:#b98a8a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sfondo);min-height:100vh;padding:20px;color:var(--testo)}
.container{max-width:1100px;margin:0 auto}
.app-header{text-align:center;margin-bottom:30px;padding:22px;background:var(--carta);border:1px solid var(--bordo);border-radius:14px}
.app-header h1{font-family:Georgia,serif;font-size:30px;margin-bottom:6px}
.subtitle{color:var(--soft)}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:22px}
.card h2{color:var(--accento);font-family:Georgia,serif;font-size:18px;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:13px}
.form-group input{width:100%;padding:11px;border:1px solid var(--bordo);border-radius:10px;font-size:14px;background:#fff}
.form-group input:focus{outline:2px solid var(--accento);border-color:transparent}
.form-row{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;align-items:end}
@media(max-width:640px){.form-row{grid-template-columns:1fr}}
.btn-primary{padding:11px 22px;background:var(--accento);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.btn-secondary{padding:10px 18px;background:#fff;color:var(--testo);border:1px solid var(--bordo);border-radius:999px;cursor:pointer;font-size:13px}
.btn-on{padding:7px 14px;background:var(--ok);color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:12px}
.btn-off{padding:7px 14px;background:var(--ko);color:#fff;border:none;border-radius:999px;cursor:pointer;font-size:12px}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.app-card{background:#faf9f7;border:1px solid var(--bordo);border-radius:12px;padding:18px;cursor:pointer;transition:transform .2s}
.app-card:hover{transform:translateY(-3px);border-color:var(--accento)}
.app-card .ico{font-size:26px;margin-bottom:8px}
.app-card h3{font-family:Georgia,serif;font-size:16px;margin-bottom:4px}
.app-card p{font-size:12px;color:var(--soft)}
.studio-row{background:#faf9f7;border:1px solid var(--bordo);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.studio-row .info{font-size:13px}
.studio-row .code{font-family:monospace;color:var(--accento);font-weight:700}
.badge{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge.on{background:#e5efe9;color:var(--ok)}
.badge.off{background:#f3e8e8;color:var(--ko)}
.sel-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.sel-row select{padding:10px;border:1px solid var(--bordo);border-radius:10px;font-size:14px}
.msg{font-size:12px;margin-top:6px}
.msg.ok{color:var(--ok)}.msg.ko{color:var(--ko)}
.lock-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center}
.lock-card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:34px;max-width:400px;width:100%}
</style>
</head>
<body>
<div class="container">
<header class="app-header"><h1>AppCenterStudio Premium</h1><p class="subtitle">Portale dello Studio</p></header>

<div id="loginCard" class="card" style="max-width:430px;margin:0 auto;">
<h2>🔐 Accesso Amministratore</h2>
<div class="form-group"><label>Utente</label><input type="text" id="user"></div>
<div class="form-group"><label>Password</label><input type="password" id="pass"></div>
<button class="btn-primary" style="width:100%" onclick="login()">Entra</button>
<p id="loginErr" class="msg ko"></p>
</div>

<div id="dash" style="display:none">
<div class="card">
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px">
<h2 style="margin:0">📱 Le tue applicazioni</h2>
<button class="btn-secondary" onclick="logout()">Esci</button></div>
<div class="sel-row"><label style="font-size:13px;font-weight:600">Studio attivo:</label><select id="studioSel" onchange="localStorage.setItem('studio_attivo',this.value)"></select></div>
<div class="app-grid" id="appGrid"></div>
</div>

<div class="card">
<h2>🏢 Studi & Licenze (telecomando)</h2>
<div id="studiList"></div>
<div class="form-row" style="margin-top:14px">
<div class="form-group" style="margin:0"><label>Nome nuovo studio</label><input type="text" id="newNome" placeholder="Es. Studio Verdi"></div>
<div class="form-group" style="margin:0"><label>Giorni di prova</label><input type="number" id="newDays" value="30" min="1"></div>
<button class="btn-primary" onclick="createStudio()">➕ Crea</button>
</div>
<p id="studiMsg" class="msg"></p>
</div>

<div class="card">
<h2>🔑 Token GitHub</h2>
<div class="form-group"><input type="password" id="tokInput" placeholder="Incolla qui il token"></div>
<button class="btn-primary" onclick="saveToken()">💾 Salva token</button>
<p id="tokMsg" class="msg"></p>
</div>
</div>
</div>

<script>
const OWNER=location.hostname.split(".")[0],REPO=location.pathname.split("/")[1];
const APPS=[
 {nome:"Preventivi & Contratti",path:"preventivi-contratti/",desc:"Preventivi, contratti e archivio clienti",ico:"📄"},
 {nome:"Workflow Foto & Video",path:"workflow/",desc:"Gestione workflow dei servizi",ico:"🎬"},
 {nome:"Selezione per Album",path:"selezione-album/",desc:"Invio foto per selezione cliente",ico:"🖼"},
 {nome:"Gallery",path:"gallery/",desc:"Consegna gallerie MEGA ai clienti",ico:"📁"}
];
let LIC={studi:[]};
const $=id=>document.getElementById(id);
function login(){
 if($('user').value.trim()==='admin'&&$('pass').value==='58879@Stella'){sessionStorage.setItem('portal_admin','1');showDash();}
 else $('loginErr').textContent='❌ Credenziali errate.';
}
function logout(){sessionStorage.removeItem('portal_admin');location.reload();}
function saveToken(){localStorage.setItem('gh_token',$('tokInput').value.trim());$('tokMsg').className='msg ok';$('tokMsg').textContent='✅ Token salvato in questo browser.';}
window.addEventListener('DOMContentLoaded',()=>{if(sessionStorage.getItem('portal_admin')==='1')showDash();const t=localStorage.getItem('gh_token');if(t)$('tokInput').value=t;});
async function showDash(){
 $('loginCard').style.display='none';$('dash').style.display='block';
 await loadLic();render();
}
async function loadLic(){
 try{LIC=await(await fetch('licenses.json?t='+Date.now(),{cache:'no-store'})).json();}catch(e){LIC={studi:[]};}
 if(!LIC.studi)LIC.studi=[];
}
function render(){
 const sel=$('studioSel');
 sel.innerHTML=LIC.studi.length?LIC.studi.map(s=>`<option value="${s.codice}">${s.nome} (${s.codice})</option>`).join(''):'<option value="">— nessuno —</option>';
 const saved=localStorage.getItem('studio_attivo');
 if(saved&&LIC.studi.find(s=>s.codice===saved))sel.value=saved;
 $('appGrid').innerHTML=APPS.map(a=>`<div class="app-card" onclick="openApp('${a.path}')"><div class="ico">${a.ico}</div><h3>${a.nome}</h3><p>${a.desc}</p></div>`).join('');
 const oggi=new Date().toISOString().slice(0,10);
 $('studiList').innerHTML=LIC.studi.length?LIC.studi.map(s=>{
   const on=s.attivo&&s.scadenza>=oggi;
   return `<div class="studio-row"><div class="info"><span class="code">${s.codice}</span> · ${s.nome}<br><small style="color:var(--soft)">scadenza: ${s.scadenza}</small></div>
   <div style="display:flex;gap:6px;align-items:center"><span class="badge ${on?'on':'off'}">${on?'ATTIVO':'SPENTO'}</span>
   <button class="${s.attivo?'btn-off':'btn-on'}" onclick="toggle('${s.codice}')">${s.attivo?' Spegni':' Accendi'}</button></div></div>`;
 }).join(''):'<p style="color:var(--soft);font-size:13px">Nessuno studio: creane uno qui sotto.</p>';
}
function openApp(path){
 const code=$('studioSel').value;
 if(!code)return alert('⚠️ Crea prima uno studio (riquadro "Studi & Licenze").');
 localStorage.setItem('studio_attivo',code);
 location.href=path+'?studio='+code;
}
async function toggle(codice){
 const s=LIC.studi.find(x=>x.codice===codice);if(!s)return;
 s.attivo=!s.attivo;
 await writeLic('aggiorna licenza '+codice);
 await loadLic();render();
}
async function createStudio(){
 const nome=$('newNome').value.trim();if(!nome)return alert('⚠️ Scrivi il nome dello studio.');
 const days=Math.max(1,parseInt($('newDays').value)||30);
 let max=0;LIC.studi.forEach(s=>{const n=parseInt((s.codice||'').replace(/\D/g,''))||0;if(n>max)max=n;});
 const codice='st-'+String(max+1).padStart(3,'0');
 const scad=new Date(Date.now()+days*86400000).toISOString().slice(0,10);
 LIC.studi.push({codice,nome,scadenza:scad,attivo:true});
 await writeLic('nuovo studio '+codice);
 $('newNome').value='';
 await loadLic();render();
 $('studiMsg').className='msg ok';$('studiMsg').textContent='✅ Studio '+codice+' creato (scade il '+scad+').';
}
async function writeLic(msg){
 const tok=localStorage.getItem('gh_token');
 if(!tok)return alert('❌ Salva prima il token GitHub nel riquadro in basso.');
 const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/licenses.json`;
 let sha;const g=await fetch(url,{headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json'}});
 if(g.ok)sha=(await g.json()).sha;
 const r=await fetch(url,{method:'PUT',headers:{Authorization:'token '+tok,Accept:'application/vnd.github+json'},body:JSON.stringify({message:msg,content:btoa(unescape(encodeURIComponent(JSON.stringify(LIC,null,2)))),...(sha?{sha}:{})})});
 if(!r.ok)alert('❌ Errore GitHub: '+(await r.text()));
}
</script>
</body>
</html>
