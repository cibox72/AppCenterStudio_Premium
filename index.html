<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppCenterStudio-Premium</title>
<style>
:root{--sfondo:#f6f4f0;--carta:#fff;--testo:#2e2e38;--soft:#8a8a96;--accento:#6f7f8f;
--accento-chiaro:#eef1f4;--bordo:#e6e2da;--ok:#7d9b8a;--ko:#b98a8a}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 -apple-system,"Segoe UI",sans-serif;background:var(--sfondo);color:var(--testo)}
h1,h2,h3{font-family:Georgia,serif;font-weight:600;margin:.2em 0}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--bordo);padding-bottom:14px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:44px;height:44px;border-radius:10px;object-fit:cover}
.logo{width:44px;height:44px;border-radius:10px;background:var(--accento);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:20px}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(40,40,60,.06)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:16px}
.btn{border:1px solid var(--bordo);background:var(--carta);color:var(--testo);padding:9px 16px;border-radius:999px;cursor:pointer;font-size:13px}
.btn:hover{border-color:var(--accento);color:var(--accento)}
.btn.primario{background:var(--accento);border-color:var(--accento);color:#fff}
input{padding:9px 12px;border:1px solid var(--bordo);border-radius:10px;background:#fff;font-size:14px;width:100%}
label{font-size:12px;color:var(--soft);display:block;margin:10px 0 4px}
.stato{padding:3px 10px;border-radius:999px;font-size:12px}.stato.ok{background:#eef4f0;color:var(--ok)}.stato.ko{background:#f6eeee;color:var(--ko)}
.riga{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bordo)}
.soft{color:var(--soft)}small{font-size:12px}
</style></head>
<body>
<div class="wrap"><header id="testata"></header><main id="main"></main></div>
<script>
/* ===== AppCenterStudio-Premium ===== */
const OWNER=location.hostname.split(".")[0];
const REPO=location.pathname.split("/")[1];
const HASH_ADMIN="METTI-QUI-L-HASH";   // vedi istruzioni dopo il codice
const APPS=[
 {nome:"App Uno",path:"app-1/",desc:"Descrizione app 1"},
 {nome:"App Due",path:"app-2/",desc:"Descrizione app 2"},
];
let licenze=null,studio=null,profilo=null,tokenGH=localStorage.getItem("gh_token")||"";
const $=id=>document.getElementById(id);
const oggi=()=>new Date().toISOString().slice(0,10);
const gg=s=>Math.ceil((new Date(s.scadenza)-new Date(oggi()))/864e5);
async function sha256(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function carica(){licenze=await(await fetch("licenses.json?t="+Date.now(),{cache:"no-store"})).json()}
function brandHTML(){const p=profilo||{};
 return `<div class="brand">${p.logo?`<img src="${p.logo}">`:`<div class="logo">A</div>`}
 <div><h1 style="margin:0;font-size:19px">AppCenterStudio‑Premium</h1><small class="soft">${p.nome||"Suite per studi fotografici"}</small></div></div>`}
function vistaLogin(){testata.innerHTML=brandHTML();
 main.innerHTML=`<div class="card" style="max-width:430px;margin:48px auto">
 <h2>Accedi al tuo studio</h2><p class="soft">Inserisci il codice di accesso fornito.</p>
 <label>Codice studio</label><input id="codice" placeholder="es. test26">
 <button class="btn primario" style="width:100%;margin-top:14px" onclick="entraStudio()">Entra</button>
 <details style="margin-top:22px" class="soft"><summary style="cursor:pointer;font-size:12px">Accesso amministratore</summary>
 <label>Password amministratore</label><input id="pass" type="password">
 <button class="btn" style="width:100%;margin-top:10px" onclick="entraAdmin()">Entra come admin</button></details></div>`}
async function entraStudio(){await carica();
 const s=licenze.studi.find(x=>x.codice===$("codice").value.trim().toLowerCase());
 if(!s)return alert("Codice non riconosciuto.");
 studio=s;try{profilo=JSON.parse(localStorage.getItem("acsp:"+s.codice))||{}}catch(e){profilo={}}
 (!s.attivo||s.scadenza<oggi())?vistaBloccato():vistaDash()}
function vistaBloccato(){testata.innerHTML=brandHTML();
 main.innerHTML=`<div class="card" style="max-width:460px;margin:48px auto;text-align:center">
 <div style="font-size:34px">🔒</div><h2>Licenza non attiva</h2>
 <p class="soft">${studio.attivo?"La prova di 30 giorni è scaduta.":"L'accesso è stato sospeso."}<br>Contattaci per il rinnovo.</p></div>`}
function vistaDash(){testata.innerHTML=brandHTML()+`<button class="btn" onclick="esci()">Esci</button>`;
 const p=profilo||{};
 main.innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr;align-items:start">
 <div class="card"><h2>Il tuo studio</h2><p class="soft">Personalizza il portale con i tuoi dati e la tua immagine.</p>
  <label>Nome studio</label><input id="pNome" value="${p.nome||""}" placeholder="es. Studio Rossi">
  <label>Indirizzo</label><input id="pInd" value="${p.indirizzo||""}">
  <label>Telefono</label><input id="pTel" value="${p.telefono||""}">
  <label>Email</label><input id="pEmail" value="${p.email||""}">
  <label>Logo / immagine dello studio</label><input type="file" id="pImg" accept="image/*" onchange="leggiImmagine(this)">
  <div id="anteprima" style="margin-top:10px">${p.logo?`<img src="${p.logo}" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`:""}</div>
  <button class="btn primario" style="margin-top:14px" onclick="salvaDati()">Salva personalizzazione</button></div>
 <div><div class="card"><h2>Le tue applicazioni</h2>
  <p class="soft">Prova attiva fino al <strong>${studio.scadenza}</strong> · ${gg(studio)} giorni rimanenti.</p></div>
  <div class="grid">${APPS.map(a=>`<div class="card"><h3>${a.nome}</h3><p class="soft">${a.desc}</p>
   <a class="btn primario" style="text-decoration:none" target="_blank" href="${a.path}?studio=${studio.codice}">Apri</a></div>`).join("")}</div></div></div>`}
function leggiImmagine(inp){const f=inp.files[0];if(!f)return;
 if(f.size>1500000)return alert("Immagine troppo pesante: usa un file sotto 1,5 MB.");
 const r=new FileReader();r.onload=()=>{profilo=profilo||{};profilo.logo=r.result;
 anteprima.innerHTML=`<img src="${r.result}" style="width:64px;height:64px;object-fit:cover;border-radius:12px">`};r.readAsDataURL(f)}
function salvaDati(){profilo=profilo||{};
 Object.assign(profilo,{nome:pNome.value.trim(),indirizzo:pInd.value.trim(),telefono:pTel.value.trim(),email:pEmail.value.trim()});
 localStorage.setItem("acsp:"+studio.codice,JSON.stringify(profilo));vistaDash();alert("Personalizzazione salvata.")}
function esci(){studio=null;profilo=null;vistaLogin()}
async function entraAdmin(){if(await sha256($("pass").value)===HASH_ADMIN)vistaAdmin();else alert("Password errata.")}
async function vistaAdmin(){await carica();
 testata.innerHTML=brandHTML()+`<span class="stato ok">admin</span> <button class="btn" onclick="vistaLogin()">Esci</button>`;
 main.innerHTML=`<div class="card"><h2>Studi clienti</h2>
 ${licenze.studi.map(rigaStudio).join("")||"<p class='soft'>Nessuno studio.</p>"}</div>
 <div class="grid" style="grid-template-columns:1fr 1fr">
 <div class="card"><h3>Nuovo studio (30 gg di prova)</h3>
  <label>Nome</label><input id="nNome"><label>Codice</label><input id="nCod" placeholder="es. rossi26">
  <button class="btn primario" style="margin-top:12px" onclick="nuovoStudio()">Crea studio</button></div>
 <div class="card"><h3>Token GitHub</h3>
  <p class="soft">Serve ai pulsanti Accendi/Spegni. Crealo su GitHub con scope <em>public_repo</em>. Resta salvato solo su questo PC.</p>
  <input id="tok" value="${tokenGH}" placeholder="ghp_...">
  <button class="btn" style="margin-top:12px" onclick="tokenGH=tok.value.trim();localStorage.setItem('gh_token',tokenGH);alert('Token salvato.')">Salva token</button></div></div>`}
function rigaStudio(s){const attivo=s.attivo&&s.scadenza>=oggi();
 return `<div class="riga"><div><strong>${s.nome}</strong> <small class="soft">(${s.codice})</small><br>
 <small>Scadenza: ${s.scadenza} · <span class="stato ${attivo?"ok":"ko"}">${attivo?"attivo":"spento/scaduto"}</span></small></div>
 <div style="display:flex;gap:8px"><button class="btn" onclick="piu30('${s.codice}')">+30 gg</button>
 <button class="btn ${s.attivo?"":"primario"}" onclick="toggle('${s.codice}')">${s.attivo?"Spegni":"Accendi"}</button></div></div>`}
async function toggle(c){const s=licenze.studi.find(x=>x.codice===c);s.attivo=!s.attivo;await salvaLicenze();vistaAdmin()}
async function piu30(c){const s=licenze.studi.find(x=>x.codice===c);
 const b=s.scadenza>=oggi()?new Date(s.scadenza):new Date();b.setDate(b.getDate()+30);
 s.scadenza=b.toISOString().slice(0,10);await salvaLicenze();vistaAdmin()}
async function nuovoStudio(){const cod=nCod.value.trim().toLowerCase(),nome=nNome.value.trim();
 if(!cod||!nome)return alert("Compila nome e codice.");
 if(licenze.studi.some(s=>s.codice===cod))return alert("Codice già usato.");
 const d=new Date();d.setDate(d.getDate()+30);
 licenze.studi.push({nome,codice:cod,attivo:true,scadenza:d.toISOString().slice(0,10)});
 await salvaLicenze();vistaAdmin()}
async function salvaLicenze(){if(!tokenGH)return alert("Salva prima il token GitHub.");
 const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/licenses.json`;let sha;
 const g=await fetch(url,{headers:hGH()});if(g.ok)sha=(await g.json()).sha;
 const r=await fetch(url,{method:"PUT",headers:hGH(),body:JSON.stringify({message:"aggiorna licenze",content:b64(JSON.stringify(licenze,null,2)),...(sha?{sha}:{})})});
 if(!r.ok)return alert("Errore GitHub: "+(await r.text()))}
function hGH(){return{Authorization:"token "+tokenGH,Accept:"application/vnd.github+json"}}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
vistaLogin();
</script>
</body>
</html>
