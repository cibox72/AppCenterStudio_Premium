<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium</title>
<style>
:root{--b:#e0e0e0;--s:#888}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#fbfbfb;color:#111}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.hd{text-align:center;padding:26px;background:#fff;border:1px solid var(--b);border-radius:14px;margin-bottom:22px}
.hd img{filter:grayscale(100%);height:60px;border-radius:12px;margin-bottom:8px}
.hd h1{font-family:Georgia,serif;font-size:28px}
.hd p{color:var(--s)}
.tb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:16px}
.bp{padding:10px 20px;background:#111;color:#fff;border:1px solid #111;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.bs{padding:9px 16px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;cursor:pointer;font-size:13px}
.card{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;margin-bottom:20px}
.card h2{font-family:Georgia,serif;font-size:17px;margin-bottom:12px}
.fg{margin-bottom:10px}.fg label{display:block;font-weight:600;font-size:12px;margin-bottom:4px}
.fg input,.fg select{width:100%;padding:9px;border:1px solid var(--b);border-radius:9px;font-size:13px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{background:#f5f5f5;border-left:4px solid #111;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px}
.row{background:#fff;border:1px solid var(--b);border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.code{font-family:monospace;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.app{background:#fff;border:1px solid var(--b);border-radius:14px;padding:20px;text-decoration:none;color:#111;display:block;transition:border-color .2s}
.app:hover{border-color:#111}
.app .num{font-family:Georgia,serif;font-size:13px;color:var(--s)}
.app h3{font-family:Georgia,serif;font-size:18px;margin:4px 0}
.app p{font-size:13px;color:var(--s)}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{background:#fff;border:1px solid var(--b);border-radius:14px;padding:34px;max-width:400px;width:100%;text-align:center}
.bl{padding:7px 13px;background:#fff;border:1px solid #999;border-radius:999px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const OWNER='cibox72',REPO='AppCenterStudio_Premium';
const BASE='https://'+OWNER+'.github.io/'+REPO+'/';
const $=id=>document.getElementById(id);
window.addEventListener('DOMContentLoaded',()=>{sessionStorage.getItem('admin')?renderDash():renderLogin();});
function renderLogin(){
$('root').innerHTML=`<div class="lw"><div class="lc">
<img src="logo.png" style="height:50px;filter:grayscale(100%);border-radius:12px;margin-bottom:10px" alt="">
<h1 style="font-family:Georgia,serif;font-size:22px">AppCenterStudio Premium</h1>
<p style="color:var(--s);margin-bottom:16px">Accesso fornitore</p>
<div class="fg"><label>Utente</label><input id="lu" autocomplete="username"></div>
<div class="fg"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
<button class="bp" style="width:100%" onclick="login()">Entra</button>
<div id="lerr" style="color:#a33;font-size:13px;margin-top:10px"></div>
</div></div>`;
}
function login(){
if($('lu').value.trim()==='admin'&&$('lp').value==='58879@Stella'){sessionStorage.setItem('admin','1');renderDash();}
else $('lerr').textContent='Credenziali non valide.';
}
async function leggiLicenze(){try{const r=await fetch(BASE+'licenses.json?t='+Date.now(),{cache:'no-store'});return await r.json();}catch(e){return{studi:[]}}}
async function ghPut(path,content){
const tok=localStorage.getItem('gh_token');
if(!tok)throw new Error('Token GitHub mancante: inseriscilo nella card "Token GitHub".');
const g=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});
let sha=null;if(g.ok){const j=await g.json();sha=j.sha;}
const p=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'aggiorna '+path,content:btoa(unescape(encodeURIComponent(content))),sha:sha||undefined})});
const j2=await p.json();if(!p.ok)throw new Error(j2.message||'Errore GitHub');
}
function renderDash(){
$('root').innerHTML=`<div class="wrap">
<div class="tb">
<button class="bp" onclick="backupGlobale()">Backup Globale</button>
<label class="bs" style="cursor:pointer">Ripristino Globale<input type="file" hidden accept=".json" onchange="restoreGlobale(event)"></label>
<button class="bs" onclick="sessionStorage.clear();renderLogin();">Esci</button>
</div>
<div class="hd"><img src="logo.png" alt="logo"><h1>AppCenterStudio Premium</h1><p>Suite gestionale per studi fotografici</p></div>
<div class="card">
<h2>Token GitHub</h2>
<div class="ib">Serve per creare studi e scrivere licenses.json. Lo trovi su GitHub → Settings → Developer settings → Personal access tokens.</div>
<div class="fg"><input id="ghTok" type="password" placeholder="ghp_…"></div>
<button class="bs" onclick="localStorage.setItem('gh_token',$('ghTok').value.trim());alert('Token salvato.');">Salva token</button>
</div>
<div class="card">
<h2>Studi & Licenze</h2>
<div class="fr">
<div class="fg"><label>Nome studio</label><input id="stNome" placeholder="Es. G&L Studio"></div>
<div class="fg"><label>Giorni di prova</label><input id="stGiorni" type="number" value="30"></div>
</div>
<button class="bp" onclick="creaStudio()">Crea studio</button>
<div id="studiList" style="margin-top:14px"></div>
</div>
<div class="card">
<h2>Applicazioni</h2>
<div class="ib" id="studioSel">Seleziona prima uno studio qui sopra: i link delle app si attivano con il suo codice.</div>
<div class="grid" id="appGrid"></div>
</div>
</div>`;
$('ghTok').value=localStorage.getItem('gh_token')||'';
renderStudi();renderApps();
}
async function creaStudio(){
const nome=$('stNome').value.trim();if(!nome)return alert('Nome studio obbligatorio.');
const giorni=parseInt($('stGiorni').value)||30;
const l=await leggiLicenze();const studi=l.studi||[];
let n=studi.length+1,codice='st-'+String(n).padStart(3,'0');
while(studi.find(s=>s.codice===codice)){n++;codice='st-'+String(n).padStart(3,'0');}
const sc=new Date();sc.setDate(sc.getDate()+giorni);
studi.push({codice,nome,attivo:true,scadenza:sc.toISOString().slice(0,10)});
try{await ghPut('licenses.json',JSON.stringify({studi},null,2));$('stNome').value='';alert('Studio creato: '+codice);renderStudi();}catch(e){alert('Errore: '+e.message);}
}
async function renderStudi(){
const l=await leggiLicenze();const studi=l.studi||[];
const box=$('studiList');
if(!studi.length){box.innerHTML='<p style="color:var(--s);font-size:13px">Nessuno studio: crea il primo qui sopra.</p>';return;}
box.innerHTML=studi.map(s=>`<div class="row">
<div><span class="code">${s.codice}</span> — <b>${s.nome}</b><br><small style="color:var(--s)">scadenza ${s.scadenza} · ${s.attivo?'attivo':'sospeso'}</small></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="bl" onclick="scegliStudio('${s.codice}')">Entra</button>
<button class="bl" onclick="copiaTxt('${BASE}benvenuto.html?studio=${s.codice}')">Link benvenuto</button>
</div></div>`).join('');
}
function scegliStudio(c){sessionStorage.setItem('studio',c);$('studioSel').innerHTML='Studio attivo: <b class="code">'+c+'</b>';renderApps();}
function renderApps(){
const c=sessionStorage.getItem('studio');
const apps=[
{n:'01',t:'Preventivi & Contratti',d:'Preventivi PDF e contratti con firma',u:'preventivi/'},
{n:'02',t:'Workflow Foto & Video',d:'Stati di avanzamento e consegne',u:'workflow/'},
{n:'03',t:'Clienti & Foto',d:'Codici cliente, Netlify e caricamento',u:'clienti-foto/'},
{n:'04',t:'Selezione per Album',d:'Archivio selezioni e text Gru',u:'selezione-album/'},
{n:'05',t:'Gallery',d:'Gallery privata per gli sposi',u:'gallery/'},
{n:'06',t:'Negozio Online',d:'Ordini stampa, Gru e PDF',u:'negozio/'}
];
$('appGrid').innerHTML=apps.map(a=>`<a class="app" href="${c?a.u+'?studio='+c:'#'}" onclick="if(!${!!c}){event.preventDefault();alert('Seleziona prima uno studio (pulsante Entra).');}">
<div class="num">${a.n}</div><h3>${a.t}</h3><p>${a.d}</p></a>`).join('');
if(c)$('studioSel').innerHTML='Studio attivo: <b class="code">'+c+'</b>';
}
function copiaTxt(t){navigator.clipboard.writeText(t).then(()=>alert('Copiato: '+t));}
function backupGlobale(){
const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AppCenterStudio_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function restoreGlobale(e){
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>{try{
const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
if(typeof d!=='object')throw new Error('File non valido.');
if(!confirm('Ripristinare il backup? I dati attuali verranno sostituiti.'))return;
Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
alert('Ripristinato. Ricarico.');location.reload();
}catch(err){alert('Errore: '+err.message);}};
r.readAsText(f);e.target.value='';
}
</script>
</body>
</html>
