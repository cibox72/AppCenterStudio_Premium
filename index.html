<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium</title>
<script src="tema.js"></script>
<style>
:root{--b:#e2e4e9;--s:#8a8f98;--nero:#111;--ombra:0 6px 18px rgba(15,20,40,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--nero);min-height:100vh;
background-color:#e9ebef;
background-image:
 radial-gradient(ellipse 62% 52% at 50% 45%, rgba(255,255,255,.92), rgba(255,255,255,0) 70%),
 repeating-linear-gradient(115deg, rgba(255,255,255,0) 0 26px, rgba(255,255,255,.55) 26px 30px, rgba(255,255,255,0) 30px 74px, rgba(255,255,255,.35) 74px 77px, rgba(255,255,255,0) 77px 120px),
 repeating-linear-gradient(115deg, rgba(140,146,158,0) 0 40px, rgba(140,146,158,.16) 40px 44px, rgba(140,146,158,0) 44px 150px),
 linear-gradient(115deg,#b9bec7 0%,#dfe2e8 40%,#f2f3f6 55%,#c2c7cf 100%);
background-attachment:fixed;}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.mono{width:56px;height:56px;border-radius:50%;background:var(--nero);color:#fff;font-family:Georgia,serif;font-size:20px;display:inline-flex;align-items:center;justify-content:center;letter-spacing:1px;margin-bottom:10px}
.hd{text-align:center;padding:30px;background:#fff;border:1px solid var(--b);border-radius:16px;margin-bottom:22px;box-shadow:var(--ombra)}
.hd h1{font-family:Georgia,serif;font-size:28px}
.hd p{color:var(--s)}
.tb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-bottom:16px}
.bp{padding:10px 20px;background:#111;color:#fff;border:1px solid #111;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.bp:hover{background:#333}
.bs{padding:9px 16px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;cursor:pointer;font-size:13px}
.bs:hover{background:#111;color:#fff}
.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--ombra)}
.card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:12px}
.fg{margin-bottom:10px}.fg label{display:block;font-weight:600;font-size:12px;margin-bottom:4px;color:#555}
.fg input,.fg select{width:100%;padding:10px;border:1px solid var(--b);border-radius:10px;font-size:13px;background:#fff}
.fg input:focus,.fg select:focus{outline:2px solid #111}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ib{background:#f5f6f8;border-left:4px solid #111;padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:13px;color:#444}
.row{background:#fff;border:1px solid var(--b);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:var(--ombra)}
.code{font-family:monospace;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.app{background:#fff;border:1px solid var(--b);border-radius:16px;padding:22px;text-decoration:none;color:#111;display:block;transition:border-color .2s, transform .2s;box-shadow:var(--ombra)}
.app:hover{border-color:#111;transform:translateY(-2px)}
.app .num{font-family:Georgia,serif;font-size:13px;color:var(--s)}
.app h3{font-family:Georgia,serif;font-size:18px;margin:4px 0}
.app p{font-size:13px;color:var(--s)}
.lw{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lc{background:#fff;border:1px solid var(--b);border-radius:20px;padding:38px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(15,20,40,.15)}
.bl{padding:7px 13px;background:#fff;border:1px solid #999;border-radius:999px;cursor:pointer;font-size:12px}
.bl:hover{background:#111;color:#fff;border-color:#111}
.bl-danger{padding:7px 13px;background:#fff;border:1px solid #a33;color:#a33;border-radius:999px;cursor:pointer;font-size:12px}
.bl-danger:hover{background:#a33;color:#fff}
.bl-toggle{padding:7px 13px;background:#fff;border:1px solid #999;border-radius:999px;cursor:pointer;font-size:12px}
.bl-toggle:hover{background:#111;color:#fff}
.tema-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:14px}
.tema-btn{padding:14px 10px;background:#fff;border:2px solid #ccc;border-radius:12px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;text-align:center;transition:all .15s}
.tema-btn:hover{border-color:#111;transform:translateY(-1px)}
.tema-btn.attivo{background:#111;color:#fff;border-color:#111;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.tema-btn .emoji{display:block;font-size:22px;margin-bottom:4px}
.tema-btn .nome{display:block}
#temaStatus{font-size:12px;color:#2e7d32;margin-top:8px;font-weight:600}
#temaStatus.ko{color:#a33}
</style>
</head>
<body>
<div id="root"></div>
<script>
const OWNER='cibox72',REPO='AppCenterStudio_Premium';
const BASE='https://'+OWNER+'.github.io/'+REPO+'/';
const $=id=>document.getElementById(id);

const TEMI=[
 {id:'classico',nome:'Classico',emoji:'🌿'},
 {id:'wedding',nome:'Wedding',emoji:'🕊️'},
 {id:'natale',nome:'Natale',emoji:'🎄'},
 {id:'carnevale',nome:'Carnevale',emoji:'🎭'},
 {id:'pasqua',nome:'Pasqua',emoji:'🌸'},
 {id:'estate',nome:'Estate',emoji:'🌊'},
 {id:'inverno',nome:'Inverno',emoji:'❄️'}
];
let temaAttuale='classico';

window.addEventListener('DOMContentLoaded',()=>{sessionStorage.getItem('admin')?renderDash():renderLogin();});
function renderLogin(){
$('root').innerHTML=`<div class="lw"><div class="lc">
<div class="mono">AC</div>
<h1 style="font-family:Georgia,serif;font-size:22px">AppCenterStudio Premium</h1>
<p style="color:var(--s);margin-bottom:16px">Accesso fornitore</p>
<div class="fg"><label>Utente</label><input id="lu" autocomplete="username"></div>
<div class="fg"><label>Password</label><input id="lp" type="password" autocomplete="current-password"></div>
<button class="bp" style="width:100%" onclick="login()">Entra</button>
<div id="lerr" style="color:#a33;font-size:13px;margin-top:10px"></div>
</div></div>`;
}
function login(){
if($('lu').value.trim()==='admin'&&$('lp').value==='58879@Stella'){sessionStorage.setItem('admin','1');renderDash();}
else $('lerr').textContent='Credenziali non valide.';
}
async function leggiLicenze(){try{const r=await fetch(BASE+'licenses.json?t='+Date.now(),{cache:'no-store'});return await r.json();}catch(e){return{studi:[]}}}
async function leggiOfferte(){try{const r=await fetch(BASE+'offers.json?t='+Date.now(),{cache:'no-store'});return await r.json();}catch(e){return{offerte:[]}}}
async function leggiTema(){try{const r=await fetch(BASE+'tema.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();return j.tema||'classico';}catch(e){return 'classico';}}
async function ghPut(path,content){
const tok=localStorage.getItem('gh_token');
if(!tok)throw new Error('Token GitHub mancante: inseriscilo nella card "Token GitHub".');
const g=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});
let sha=null;if(g.ok){const j=await g.json();sha=j.sha;}
const p=await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'aggiorna '+path,content:btoa(unescape(encodeURIComponent(content))),sha:sha||undefined})});
const j2=await p.json();if(!p.ok)throw new Error(j2.message||'Errore GitHub');
}
function renderDash(){
$('root').innerHTML=`<div class="wrap">
<div class="tb">
<button class="bp" onclick="backupGlobale()">Backup Globale</button>
<label class="bs" style="cursor:pointer">Ripristino Globale<input type="file" hidden accept=".json" onchange="restoreGlobale(event)"></label>
<button class="bs" onclick="location.href='assistenza.html?admin=true'">Assistenza Online</button>
<button class="bs" onclick="sessionStorage.clear();renderLogin();">Esci</button>
</div>
<div class="hd"><div class="mono">AC</div><h1>AppCenterStudio Premium</h1><p>Suite gestionale per studi fotografici</p></div>
<div class="card"><h2>Token GitHub</h2>
<div class="ib">Serve per creare studi e scrivere licenses.json. Lo trovi su GitHub → Settings → Developer settings → Personal access tokens.</div>
<div class="fg"><input id="ghTok" type="password" placeholder="ghp_…"></div>
<button class="bs" onclick="localStorage.setItem('gh_token',$('ghTok').value.trim());alert('Token salvato.');">Salva token</button></div>
<div class="card"><h2>Cambia stile app (tutti gli studi)</h2>
<div class="ib">Scegli un tema stagionale: il tema si applica a <b>TUTTE</b> le app del portale (Preventivi, Workflow, Agenda, Ricevute, Email, ecc.). Tra circa 1 minuto dalla pubblicazione GitHub, tutti gli studi vedranno la nuova grafica. Il pulsante del tema attivo resta scuro.</div>
<div class="tema-grid" id="temaGrid"></div>
<div id="temaStatus">Caricamento tema attuale...</div></div>
<div class="card"><h2>Studi & Licenze</h2>
<div class="fr"><div class="fg"><label>Nome studio</label><input id="stNome" placeholder="Es. G&L Studio"></div>
<div class="fg"><label>Giorni di prova</label><input id="stGiorni" type="number" value="30"></div></div>
<button class="bp" onclick="creaStudio()">Crea studio</button>
<div id="studiList" style="margin-top:14px"></div></div>
<div class="card"><h2>Offerte agli studi</h2>
<div class="ib">Crea offerte personalizzate con prezzo e durata. Lo studio paga con PayPal; dopo estendi la licenza.</div>
<div class="fr"><div class="fg"><label>Studio</label><select id="ofStudio"></select></div>
<div class="fg"><label>Prezzo (€)</label><input id="ofPrezzo" type="number" step="0.01" placeholder="150"></div></div>
<div class="fr"><div class="fg"><label>Durata (mesi)</label><input id="ofDurata" type="number" value="12" min="1"></div>
<div class="fg"><label>Descrizione</label><input id="ofDesc" placeholder="Es. Pacchetto matrimoni 2026"></div></div>
<button class="bp" onclick="creaOfferta()">Crea offerta</button>
<div id="offerteList" style="margin-top:14px"></div></div>
<div class="card"><h2>Applicazioni</h2>
<div class="ib" id="studioSel">Seleziona prima uno studio qui sopra: i link delle app si attivano con il suo codice.</div>
<div class="grid" id="appGrid"></div></div>
</div>`;
$('ghTok').value=localStorage.getItem('gh_token')||'';
renderTemi();renderStudi();renderOfferte();renderApps();caricaTemaAttuale();
}
function renderTemi(){
const grid=$('temaGrid');if(!grid)return;
grid.innerHTML=TEMI.map(t=>`<button class="tema-btn ${t.id===temaAttuale?'attivo':''}" onclick="cambiaTema('${t.id}')"><span class="emoji">${t.emoji}</span><span class="nome">${t.nome}</span></button>`).join('');
}
async function caricaTemaAttuale(){
const s=$('temaStatus');if(!s)return;
temaAttuale=await leggiTema();
renderTemi();
s.textContent='Tema attuale: '+TEMI.find(t=>t.id===temaAttuale)?.nome||temaAttuale;
s.classList.remove('ko');
}
async function cambiaTema(id){
const tok=localStorage.getItem('gh_token');
if(!tok){alert('Prima salva il token GitHub nella card "Token GitHub" qui sopra.');return;}
if(!confirm('Applicare il tema "'+TEMI.find(t=>t.id===id).nome+'" a TUTTE le app di TUTTI gli studi? La pubblicazione richiede circa 1 minuto.'))return;
const s=$('temaStatus');
s.textContent='Pubblicazione in corso...';s.classList.remove('ko');
try{
 await ghPut('tema.json',JSON.stringify({tema:id},null,2));
 temaAttuale=id;
 renderTemi();
 s.textContent='✓ Tema "'+TEMI.find(t=>t.id===id).nome+'" pubblicato. Tra circa 1 minuto tutte le app (incluse quelle degli studi) cambieranno grafica. Ricarica una qualsiasi app per vedere il nuovo tema.';
}catch(e){
 s.textContent='✗ Errore: '+e.message;s.classList.add('ko');
 alert('Errore pubblicazione: '+e.message);
}
}
async function creaStudio(){
const nome=$('stNome').value.trim();if(!nome)return alert('Nome studio obbligatorio.');
const giorni=parseInt($('stGiorni').value)||30;
const l=await leggiLicenze();const studi=l.studi||[];
let n=studi.length+1,codice='st-'+String(n).padStart(3,'0');
while(studi.find(s=>s.codice===codice)){n++;codice='st-'+String(n).padStart(3,'0');}
const sc=new Date();sc.setDate(sc.getDate()+giorni);
studi.push({codice,nome,attivo:true,scadenza:sc.toISOString().slice(0,10)});
try{await ghPut('licenses.json',JSON.stringify({studi},null,2));$('stNome').value='';alert('Studio creato: '+codice);renderStudi();renderOfferte();}catch(e){alert('Errore: '+e.message);}
}
async function toggleStudio(codice){
try{const l=await leggiLicenze();
const studi=(l.studi||[]).map(s=>s.codice===codice?{...s,attivo:!s.attivo}:s);
await ghPut('licenses.json',JSON.stringify({studi},null,2));renderStudi();}catch(e){alert('Errore: '+e.message);}
}
async function eliminaStudio(codice){
if(!confirm('Eliminare lo studio '+codice+'?'))return;
if(!confirm('CONFERMA DEFINITIVA: rimozione permanente di '+codice+'. Procedere?'))return;
try{const l=await leggiLicenze();
const studi=(l.studi||[]).filter(s=>s.codice!==codice);
await ghPut('licenses.json',JSON.stringify({studi},null,2));
renderStudi();
if(sessionStorage.getItem('studio')===codice){sessionStorage.removeItem('studio');renderApps();}
const o=await leggiOfferte();
await ghPut('offers.json',JSON.stringify({offerte:(o.offerte||[]).filter(x=>x.codice!==codice)},null,2));
renderOfferte();}catch(e){alert('Errore: '+e.message);}
}
async function renderStudi(){
const l=await leggiLicenze();const studi=l.studi||[];
const box=$('studiList');
if(!studi.length){box.innerHTML='<p style="color:var(--s);font-size:13px">Nessuno studio: crea il primo qui sopra.</p>';return;}
box.innerHTML=studi.map(s=>`<div class="row">
<div><span class="code">${s.codice}</span> — <b>${s.nome}</b><br><small style="color:var(--s)">scadenza ${s.scadenza} · ${s.attivo?'attivo':'sospeso'}</small></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="bl" onclick="scegliStudio('${s.codice}')">Entra</button>
<button class="bl-toggle" onclick="toggleStudio('${s.codice}')">${s.attivo?'Sospendi':'Attiva'}</button>
<button class="bl" onclick="copiaTxt('${BASE}benvenuto.html?studio=${s.codice}')">Link benvenuto</button>
<button class="bl-danger" onclick="eliminaStudio('${s.codice}')">Elimina</button>
</div></div>`).join('');
const sel=$('ofStudio');if(sel)sel.innerHTML='<option value="">-- Scegli studio --</option>'+studi.map(s=>'<option value="'+s.codice+'">'+s.nome+' ('+s.codice+')</option>').join('');
}
async function creaOfferta(){
const codice=$('ofStudio').value;if(!codice)return alert('Seleziona uno studio.');
const prezzo=parseFloat($('ofPrezzo').value);if(!prezzo||prezzo<=0)return alert('Prezzo non valido.');
const durata=parseInt($('ofDurata').value);if(!durata||durata<1)return alert('Durata non valida.');
const o=await leggiOfferte();const offerte=o.offerte||[];
offerte.push({codice,prezzo,durata,descrizione:$('ofDesc').value.trim(),attiva:true,creata:new Date().toISOString().slice(0,10)});
try{await ghPut('offers.json',JSON.stringify({offerte},null,2));alert('Offerta creata.');renderOfferte();}catch(e){alert('Errore: '+e.message);}
}
async function rimuoviOfferta(idx){
if(!confirm('Rimuovere questa offerta?'))return;
const o=await leggiOfferte();o.offerte.splice(idx,1);
try{await ghPut('offers.json',JSON.stringify(o,null,2));renderOfferte();}catch(e){alert('Errore: '+e.message);}
}
async function estendiScadenza(idx){
const o=await leggiOfferte();const of=o.offerte[idx];if(!of)return;
const mesi=parseInt(prompt('Quanti mesi aggiungere? (es. '+of.durata+')',String(of.durata)));
if(!mesi||mesi<1)return;
const l=await leggiLicenze();const s=l.studi.find(x=>x.codice===of.codice);if(!s)return alert('Studio non trovato.');
const oggi=new Date();
const sc=new Date(s.scadenza>oggi.toISOString().slice(0,10)?s.scadenza:oggi.toISOString().slice(0,10));
sc.setMonth(sc.getMonth()+mesi);s.scadenza=sc.toISOString().slice(0,10);s.attivo=true;
try{await ghPut('licenses.json',JSON.stringify(l,null,2));alert('Scadenza estesa a '+s.scadenza);renderStudi();}catch(e){alert('Errore: '+e.message);}
}
async function renderOfferte(){
const o=await leggiOfferte();const offerte=o.offerte||[];
const box=$('offerteList');
if(!offerte.length){box.innerHTML='<p style="color:var(--s);font-size:13px">Nessuna offerta creata.</p>';return;}
const l=await leggiLicenze();const studi=l.studi||[];
box.innerHTML=offerte.map((of,i)=>{
const s=studi.find(x=>x.codice===of.codice);
const link=BASE+'benvenuto.html?studio='+of.codice+'&offerta=1';
return`<div class="row">
<div><b>${s?s.nome:'Studio eliminato'}</b> (${of.codice})<br><small style="color:var(--s)">${of.descrizione||''} · <b>€${of.prezzo}</b> · ${of.durata} mesi</small></div>
<div style="display:flex;gap:6px;flex-wrap:wrap">
<button class="bl" onclick="copiaTxt('${link}')">Copia link</button>
<button class="bl-toggle" onclick="estendiScadenza(${i})">Estendi licenza</button>
<button class="bl-danger" onclick="rimuoviOfferta(${i})">Rimuovi</button>
</div></div>`;}).join('');
}
function scegliStudio(c){sessionStorage.setItem('studio',c);$('studioSel').innerHTML='Studio attivo: <b class="code">'+c+'</b>';renderApps();}
function renderApps(){
const c=sessionStorage.getItem('studio');
const apps=[
{n:'01',t:'Preventivi & Contratti',d:'Preventivi PDF e contratti con firma',u:'preventivi/'},
{n:'02',t:'Workflow Foto & Video',d:'Stati di avanzamento e consegne',u:'workflow/'},
{n:'03',t:'Clienti & Foto',d:'Codici cliente, Netlify e caricamento',u:'clienti-foto/'},
{n:'04',t:'Selezione per Album',d:'Archivio selezioni e text Gru',u:'selezione-album/'},
{n:'05',t:'Gallery',d:'Gallery privata per gli sposi',u:'gallery/'},
{n:'06',t:'Negozio Online',d:'Ordini stampa, Gru e PDF',u:'negozio/'},
{n:'07',t:'Agenda',d:'Calendario impegni, contratti e promemoria',u:'agenda/'},
{n:'08',t:'Ricevute',d:'Ricevute di acconto e saldo con PDF e firme',u:'ricevute/'},
{n:'09',t:'Email',d:'Email e PEC dall\'indirizzo dello studio',u:'email/'}
];
$('appGrid').innerHTML=apps.map(a=>`<a class="app" href="${c?a.u+'?studio='+c:'#'}" onclick="if(!${!!c}){event.preventDefault();alert('Seleziona prima uno studio (pulsante Entra).');}">
<div class="num">${a.n}</div><h3>${a.t}</h3><p>${a.d}</p></a>`).join('');
if(c)$('studioSel').innerHTML='Studio attivo: <b class="code">'+c+'</b>';
}
function copiaTxt(t){navigator.clipboard.writeText(t).then(()=>alert('Copiato: '+t));}
function backupGlobale(){
const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AppCenterStudio_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function restoreGlobale(e){
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=ev=>{try{
const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
if(typeof d!=='object')throw new Error('File non valido.');
if(!confirm('Ripristinare il backup? I dati attuali verranno sostituiti.'))return;
Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
alert('Ripristinato. Ricarico.');location.reload();
}catch(err){alert('Errore: '+err.message);}};
r.readAsText(f);e.target.value='';
}
</script>
</body>
</html>
