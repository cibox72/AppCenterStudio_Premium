<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestione Studi & Offerte - AppCenterStudio Premium</title>
<style>
body{font-family:Georgia,'Segoe UI',sans-serif;background:#f4efe7;color:#4a4237;margin:0;padding:30px}
.wrap{max-width:860px;margin:0 auto}
h1{letter-spacing:.15em;text-transform:uppercase;font-weight:400}
.card{background:#fbf9f5;border:1px solid #e2d7c3;border-radius:16px;padding:22px;margin-bottom:18px;box-shadow:0 6px 18px rgba(120,100,70,.08)}
input,select,textarea{padding:9px;border:1px solid #e2d7c3;border-radius:10px;margin:4px 0;font-family:inherit;width:100%}
.btn{background:#a3937d;color:#fff;border:none;padding:9px 18px;border-radius:999px;cursor:pointer;font-weight:600;margin:4px 2px}
.btn:hover{background:#6f6353}
.btn.red{background:#8c2f2f}
.btn.red:hover{background:#5e1f1f}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row{border:1px solid #e2d7c3;border-radius:12px;background:#fff;padding:12px;margin:8px 0;font-size:13px}
.row b{font-size:14px}
.hint{font-size:12px;color:#9b8f7d}
#esito{font-weight:700;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #e2d7c3;padding:7px 9px;text-align:left}
th{background:#e9dfcd}
</style>
</head>
<body>
<div class="wrap">
<h1>Gestione Studi & Offerte</h1>

<div class="card">
 <p class="hint">Usa il tuo token GitHub (lo stesso di admin-tema). Questa pagina sostituisce la vecchia con l'errore hash: qui l'errore non compare più.</p>
 <input id="token" type="password" placeholder="GitHub token">
 <button class="btn" onclick="salvaToken()">Salva token</button>
 <button class="btn" onclick="loadAll()">Aggiorna elenco</button>
 <div id="esito"></div>
</div>

<div class="card">
 <h2 style="margin-top:0">Crea nuovo studio</h2>
 <div class="grid">
  <div><input id="nsCodice" placeholder="Codice (es. ST-002)"></div>
  <div><input id="nsNome" placeholder="Nome studio"></div>
  <div><input id="nsMesi" type="number" value="1" placeholder="Mesi di prova"></div>
 </div>
 <button class="btn" onclick="creaStudio()">Crea studio</button>
</div>

<div class="card">
 <h2 style="margin-top:0">Studi (licenze)</h2>
 <div id="listaStudi"></div>
</div>

<div class="card">
 <h2 style="margin-top:0">Crea offerta</h2>
 <div class="grid">
  <div><select id="ofStudio"></select></div>
  <div><input id="ofPrezzo" type="number" value="150" placeholder="Prezzo €"></div>
  <div><input id="ofMesi" type="number" value="12" placeholder="Mesi"></div>
 </div>
 <input id="ofDescr" placeholder="Descrizione (es. 1 mese di prova omaggio)">
 <button class="btn" onclick="creaOfferta()">Crea offerta</button>
</div>

<div class="card">
 <h2 style="margin-top:0">Offerte agli studi</h2>
 <div id="listaOfferte"></div>
</div>
</div>

<script>
const REPO='cibox72/AppCenterStudio_Premium';
let shaLic='',shaOff='',LIC={studi:[]},OFF={offerte:[]};
document.getElementById('token').value=localStorage.getItem('gh_token')||'';
function salvaToken(){localStorage.setItem('gh_token',document.getElementById('token').value.trim());alert('Token salvato.');}
const today=()=>new Date().toISOString().slice(0,10);
const fmtData=d=>{if(!d)return'';const p=String(d).split('-');if(p.length!==3)return d;return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
function addMonths(d,n){const t=new Date(d+'T12:00:00Z');t.setMonth(t.getMonth()+n);return t.toISOString().slice(0,10);}
function auth(){return{'Authorization':'Bearer '+localStorage.getItem('gh_token')};}
function dec(b64){try{return JSON.parse(decodeURIComponent(escape(atob(b64.replace(/\n/g,'')))));}catch(e){return null;}}
function enc(o){return btoa(unescape(encodeURIComponent(JSON.stringify(o,null,2))));}
function esito(msg){document.getElementById('esito').textContent=msg;}

async function leggi(path){
 const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{headers:auth()});
 if(!r.ok)return null;
 const j=await r.json();
 return {obj:dec(j.content),sha:j.sha};
}
async function scrivi(path,obj,sha){
 const body={message:'Aggiornamento '+path,content:enc(obj)};
 if(sha)body.sha=sha;
 const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{method:'PUT',headers:{...auth(),'Content-Type':'application/json'},body:JSON.stringify(body)});
 if(!r.ok){const j=await r.json();throw new Error(j.message||r.status);}
 return r.json();
}

async function loadAll(){
 if(!localStorage.getItem('gh_token'))return alert('Salva prima il token.');
 esito('Caricamento...');
 try{
  const l=await leggi('licenses.json');if(l){LIC=l.obj||{studi:[]};shaLic=l.sha;}
  const o=await leggi('offers.json');if(o){OFF=o.obj||{offerte:[]};shaOff=o.sha;}
  render();
  esito('Elenco aggiornato.');
 }catch(e){esito('Errore: '+e.message);}
}

function render(){
 const oggi=today();
 document.getElementById('listaStudi').innerHTML=LIC.studi.length?'<table><tr><th>Codice</th><th>Nome</th><th>Scadenza</th><th>Attivo</th><th>Azioni</th></tr>'+LIC.studi.map(s=>
  '<tr><td><b>'+s.codice+'</b></td><td>'+(s.nome||'')+'</td><td>'+fmtData(s.scadenza)+(s.scadenza<oggi?' (SCADUTA)':'')+'</td><td>'+(s.attivo?'SI':'NO')+'</td><td>'+
  '<button class="btn" onclick="estendi(\''+s.codice+'\')">Estendi</button>'+
  '<button class="btn" onclick="toggleAttivo(\''+s.codice+'\')">'+(s.attivo?'Sospendi':'Attiva')+'</button>'+
  '<button class="btn red" onclick="rimuoviStudio(\''+s.codice+'\')">Rimuovi</button></td></tr>').join('')+'</table>':'<p class="hint">Nessuno studio.</p>';
 document.getElementById('ofStudio').innerHTML=LIC.studi.map(s=>'<option value="'+s.codice+'">'+(s.nome||s.codice)+' ('+s.codice+')</option>').join('');
 document.getElementById('listaOfferte').innerHTML=OFF.offerte.length?OFF.offerte.map(o=>
  '<div class="row"><b>'+(o.studio||'')+'</b> — '+(o.descrizione||'')+' · €'+o.prezzo+' · '+o.mesi+' mesi'+
  ' <button class="btn" onclick="copiaLink(\''+o.studio+'\')">Copia link</button>'+
  ' <button class="btn red" onclick="rimuoviOfferta(\''+o.studio+'\')">Rimuovi</button></div>').join(''):'<p class="hint">Nessuna offerta.</p>';
}

async function creaStudio(){
 const codice=document.getElementById('nsCodice').value.trim();
 const nome=document.getElementById('nsNome').value.trim();
 const mesi=+document.getElementById('nsMesi').value||1;
 if(!codice||!nome)return alert('Codice e nome obbligatori.');
 if(LIC.studi.find(s=>s.codice===codice))return alert('Codice già esistente.');
 LIC.studi.push({codice,nome,attivo:true,scadenza:addMonths(today(),mesi)});
 try{const j=await scrivi('licenses.json',LIC,shaLic);shaLic=j.content.sha;esito('Studio '+codice+' creato: lo vedi subito qui sotto, senza uscire e rientrare.');render();}
 catch(e){alert('Errore: '+e.message);}
}

async function estendi(codice){
 const mesi=prompt('Quanti mesi aggiungere?','12');if(!mesi)return;
 const s=LIC.studi.find(x=>x.codice===codice);if(!s)return;
 const from=(s.scadenza&&s.scadenza>today())?s.scadenza:today();
 s.scadenza=addMonths(from,+mesi);s.attivo=true;
 try{const j=await scrivi('licenses.json',LIC,shaLic);shaLic=j.content.sha;esito('Licenza '+codice+' estesa al '+fmtData(s.scadenza)+'.');render();}
 catch(e){alert('Errore: '+e.message);}
}

async function toggleAttivo(codice){
 const s=LIC.studi.find(x=>x.codice===codice);if(!s)return;
 s.attivo=!s.attivo;
 try{const j=await scrivi('licenses.json',LIC,shaLic);shaLic=j.content.sha;render();}
 catch(e){alert('Errore: '+e.message);}
}

async function rimuoviStudio(codice){
 if(!confirm('Rimuovere lo studio '+codice+'?'))return;
 LIC.studi=LIC.studi.filter(x=>x.codice!==codice);
 try{const j=await scrivi('licenses.json',LIC,shaLic);shaLic=j.content.sha;render();}
 catch(e){alert('Errore: '+e.message);}
}

async function creaOfferta(){
 const studio=document.getElementById('ofStudio').value;
 const prezzo=+document.getElementById('ofPrezzo').value||0;
 const mesi=+document.getElementById('ofMesi').value||12;
 const descrizione=document.getElementById('ofDescr').value.trim();
 if(!studio)return alert('Seleziona uno studio.');
 OFF.offerte=OFF.offerte.filter(o=>o.studio!==studio);
 OFF.offerte.push({studio,attiva:true,prezzo,mesi,descrizione});
 try{const j=await scrivi('offers.json',OFF,shaOff);shaOff=j.content.sha;esito('Offerta creata per '+studio+'.');render();}
 catch(e){alert('Errore: '+e.message);}
}

async function rimuoviOfferta(studio){
 if(!confirm('Rimuovere l\'offerta per '+studio+'?'))return;
 OFF.offerte=OFF.offerte.filter(o=>o.studio!==studio);
 try{const j=await scrivi('offers.json',OFF,shaOff);shaOff=j.content.sha;render();}
 catch(e){alert('Errore: '+e.message);}
}

function copiaLink(studio){
 const url='https://cibox72.github.io/AppCenterStudio_Premium/benvenuto.html?studio='+encodeURIComponent(studio);
 if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>alert('Link copiato: '+url));
 else alert(url);
}

loadAll();
</script>
</body>
</html>
