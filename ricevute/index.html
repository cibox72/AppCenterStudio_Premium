<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 Ricevute - AppCenterStudio Premium</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--nero:#111;--grigio:#444;--bordo:#d9d9d9;--chiaro:#f7f7f7;--bg:#fbfbfb}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(240,242,247,0.6) 35%, rgba(220,225,235,0.3) 100%),repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 2px, transparent 22px),repeating-linear-gradient(-45deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 1px, transparent 1px, transparent 32px),linear-gradient(180deg,#fafafb 0%,#e4e7ee 100%);background-attachment:fixed;color:var(--nero);min-height:100vh}
.topbar{display:flex;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);flex-wrap:wrap;align-items:center}
.topbar .pill{background:rgba(255,255,255,0.8);color:#111;border:1px solid #bbb;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.topbar .pill:hover{background:#111;color:#fff}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;background:linear-gradient(90deg,#000,#333);color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
.brandName{font-weight:800;font-size:19px;letter-spacing:.5px;font-family:Georgia,serif}
#studioNameHead{font-size:13px;opacity:.85}
button{font-family:inherit}
.btn{background:#111;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{opacity:.88}
.btn.secondary{background:rgba(255,255,255,0.9);color:#111;border:1px solid #bbb}
.btn.secondary:hover{background:#111;color:#fff}
.mini{border:1px solid #ccc;background:rgba(255,255,255,0.9);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
.mini:hover{background:#eee}
main{max-width:1080px;margin:18px auto;padding:0 16px 60px}
.card{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(15,20,40,.07)}
h2{margin:0 0 12px;font-size:17px;border-left:4px solid #000;padding-left:10px;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:11px;color:#666;display:block;margin-bottom:3px}
input,textarea{width:100%;padding:8px;border:1px solid var(--bordo);border-radius:8px;background:#fff;font-size:13px;font-family:inherit}
input:focus,textarea:focus{outline:2px solid #000}
textarea{min-height:60px}
.importo{font-size:18px;font-weight:800}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid #e3e3e3;font-size:12px;text-align:left;vertical-align:top}
th{background:#111;color:#fff}
.hint{font-size:12px;color:#777}
.badge{background:#111;color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;border:1px solid var(--bordo);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.riga{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #e0e0e0}
/* ===== layout blocchetto ===== */
.blocchetto{background:#fffef5;border:2px dashed #111;border-radius:8px;padding:20px;font-family:'Courier New',monospace;color:#111;margin:10px 0}
.blocchetto .b-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:12px}
.blocchetto .b-num{font-size:24px;font-weight:900;letter-spacing:.05em}
.blocchetto .b-num small{font-size:12px;font-weight:400;display:block;letter-spacing:.1em}
.blocchetto .b-data{text-align:right;font-size:14px;font-weight:700}
.blocchetto .b-data small{display:block;font-size:10px;font-weight:400;color:#666}
.blocchetto .b-row{display:grid;grid-template-columns:160px 1fr;gap:10px;padding:8px 0;border-bottom:1px dotted #999}
.blocchetto .b-row:last-child{border-bottom:none}
.blocchetto .b-label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#666;font-weight:700}
.blocchetto .b-value{font-size:14px;font-weight:600}
.blocchetto .b-value.big{font-size:20px;font-weight:900;color:#111}
.blocchetto .b-footer{margin-top:14px;border-top:2px solid #111;padding-top:10px;font-size:10px;color:#666;text-align:center;text-transform:uppercase;letter-spacing:.1em}
.blocchetto .b-firme{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:20px}
.blocchetto .b-firma{border-top:1px solid #111;padding-top:6px;font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.1em}
.sync-status{font-size:11px;color:#2e7d32;margin-left:10px}
.sync-status.ko{color:#b00020}
@media(max-width:800px){.grid{grid-template-columns:1fr}.blocchetto .b-row{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <button class="pill" onclick="history.back()">← Indietro</button>
  <button class="pill" onclick="goHome()">Home</button>
  <button class="pill" onclick="backupGlobale()">Backup globale</button>
  <label class="pill" style="cursor:pointer">Ripristino globale<input type="file" hidden accept=".json" onchange="ripristinoGlobale(event)"></label>
  <span class="sync-status" id="syncStatus">Sync cloud: --</span>
</div>

<header>
  <div class="brand">
    <img id="studioLogoHead" src="logo.jpg" alt="" onerror="this.remove()">
    <span class="brandName">AppCenterStudio Premium</span>
  </div>
  <div id="studioNameHead"></div>
</header>

<main>
  <div class="card">
    <h2 id="formTitle">Nuova ricevuta</h2>
    <p class="hint">Ricevuta valida per qualsiasi servizio: fotografico, stampa, video. Salva e stampa il PDF con data e firme.</p>
    <div class="grid">
      <div><label>Nome cliente *</label><input id="r_cliente" placeholder="Es. Mario Rossi"></div>
      <div><label>Tipo di servizio *</label><input id="r_servizio" placeholder="Es. Matrimonio, Stampa album..."></div>
    </div>
    <div class="grid">
      <div><label>Ricevo € *</label><input id="r_importo" type="number" step="0.01" class="importo" placeholder="0,00"></div>
      <div><label>Data</label><input id="r_data" type="date"></div>
    </div>
    <label>A titolo di acconto / saldo per...</label>
    <input id="r_titolo" placeholder="Es. caparra conferma servizio del 10/08/2027">
    <label>Note (facoltative)</label>
    <textarea id="r_note" rows="2" placeholder="Es. metodo di pagamento, resto dovuto..."></textarea>
    <p style="margin-top:12px">
      <button class="btn" onclick="salvaRicevuta()">Salva ricevuta</button>
      <button class="btn secondary" onclick="pulisciForm()">Annulla / nuova</button>
    </p>
  </div>

  <div class="card">
    <h2>Archivio ricevute</h2>
    <div id="listaBox"></div>
  </div>
</main>

<div id="viewModal" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0;border:none;padding:0">Dettaglio ricevuta</h2>
      <button class="mini" onclick="chiudiModal()">Chiudi</button>
    </div>
    <div id="viewBody"></div>
  </div>
</div>

<script>
const KEY='appcenter_ricevute';
const WORKER='https://acs-api.mairaluigi.workers.dev';
const $=s=>document.querySelector(s);
const fmt=n=>(isNaN(+n)?0:+n).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtData=d=>{if(!d)return '';const p=String(d).split('-');if(p.length!==3){const dt=new Date(d+'T00:00:00');return isNaN(dt)?d:dt.toLocaleDateString('it-IT');}return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let studioCode=new URLSearchParams(location.search).get('studio')||sessionStorage.getItem('studio')||'';
if(studioCode)sessionStorage.setItem('studio',studioCode);

let store=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.list)return d;}catch(e){}return{seq:1,list:[]};})();
let ident=JSON.parse(localStorage.getItem('studioIdent')||'{}');
let editingId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(store));syncCloud();}
function goHome(){location.href='../benvenuto.html'+(studioCode?'?studio='+studioCode:'');}

async function syncCloud(){
 if(!studioCode)return;
 const box=$('#syncStatus');
 try{
  const fd=new FormData();
  fd.append('studio',studioCode);fd.append('cliente','__db__');
  fd.append('chiave','ricevute');fd.append('data',JSON.stringify(store));
  const r=await fetch(WORKER+'/db-save',{method:'POST',body:fd});
  const j=await r.json();
  if(j.ok){box.textContent='Sync cloud: ✓';box.classList.remove('ko');}
  else{box.textContent='Sync cloud: errore';box.classList.add('ko');}
 }catch(e){box.textContent='Sync cloud: offline';box.classList.add('ko');}
}

async function loadCloud(){
 if(!studioCode)return;
 const box=$('#syncStatus');
 box.textContent='Sync cloud: carico...';
 try{
  const r=await fetch(WORKER+'/db-load?studio='+encodeURIComponent(studioCode)+'&chiave=ricevute&t='+Date.now(),{cache:'no-store'});
  const cloud=await r.json();
  if(cloud&&cloud.list&&cloud.list.length){
   const map={};store.list.forEach(x=>{map[x.id]=x;});
   let add=0;
   cloud.list.forEach(x=>{if(!x.id)x.id=uid();if(!map[x.id]){map[x.id]=x;add++;}});
   store.list=Object.values(map);
   if(cloud.seq>store.seq)store.seq=cloud.seq;
   save();
   box.textContent='Sync: '+add+' aggiunte';
  }
 }catch(e){box.textContent='Sync cloud: offline';box.classList.add('ko');}
}

function refreshHead(){
 $('#studioNameHead').textContent=ident.nome||'Ricevute';
 if(ident.logoData)$('#studioLogoHead').src=ident.logoData;
}

function pulisciForm(){
 editingId=null;
 ['r_cliente','r_servizio','r_importo','r_titolo','r_note'].forEach(id=>$('#'+id).value='');
 $('#r_data').value=today();
 $('#formTitle').textContent='Nuova ricevuta';
}

function salvaRicevuta(){
 const cliente=$('#r_cliente').value.trim();
 const servizio=$('#r_servizio').value.trim();
 const importo=parseFloat($('#r_importo').value);
 if(!cliente||!servizio||isNaN(importo))return alert('Cliente, servizio e importo obbligatori.');
 const dati={
  cliente,servizio,importo,
  titolo:$('#r_titolo').value.trim(),
  data:$('#r_data').value||today(),
  note:$('#r_note').value.trim()
 };
 if(editingId){
  const r=store.list.find(x=>x.id===editingId);
  if(r)Object.assign(r,dati);
 }else{
  dati.id=uid();
  dati.numero='R-'+new Date().getFullYear()+'-'+String(store.seq).padStart(3,'0');
  store.seq++;
  store.list.unshift(dati);
 }
 save();pulisciForm();renderLista();
 alert('Ricevuta salvata.');
}

function renderLista(){
 const box=$('#listaBox');
 if(!store.list.length){box.innerHTML='<p class="hint">Nessuna ricevuta.</p>';return;}
 box.innerHTML='<table><tr><th>N.</th><th>Cliente</th><th>Servizio</th><th>Importo</th><th>Data</th><th>Azioni</th></tr>'+
 store.list.map(r=>'<tr><td><b>'+esc(r.numero)+'</b></td><td>'+esc(r.cliente)+'</td><td>'+esc(r.servizio)+'</td><td><b>'+fmt(r.importo)+' €</b></td><td>'+fmtData(r.data)+'</td><td>'+
 '<button class="mini" onclick="makePDF(\''+r.id+'\')">PDF</button> '+
 '<button class="mini" onclick="visualizza(\''+r.id+'\')">Visualizza</button> '+
 '<button class="mini" onclick="modifica(\''+r.id+'\')">Modifica</button> '+
 '<button class="mini" onclick="elimina(\''+r.id+'\')">🗑</button></td></tr>').join('')+'</table>';
}

function trova(id){return store.list.find(x=>x.id===id);}

function htmlBlocchetto(r){
 return '<div class="blocchetto">'+
  '<div class="b-top"><div class="b-num">'+esc(r.numero)+'<small>RICEVUTA N.</small></div><div class="b-data">'+fmtData(r.data)+'<small>DATA</small></div></div>'+
  '<div class="b-row"><div class="b-label">Ricevuto da</div><div class="b-value">'+esc(r.cliente)+'</div></div>'+
  '<div class="b-row"><div class="b-label">Servizio</div><div class="b-value">'+esc(r.servizio)+'</div></div>'+
  '<div class="b-row"><div class="b-label">A titolo di</div><div class="b-value">'+esc(r.titolo||'acconto')+'</div></div>'+
  '<div class="b-row"><div class="b-label">Importo</div><div class="b-value big">€ '+fmt(r.importo)+'</div></div>'+
  (r.note?'<div class="b-row"><div class="b-label">Note</div><div class="b-value">'+esc(r.note)+'</div></div>':'')+
  '<div class="b-firme"><div class="b-firma">Firma Studio</div><div class="b-firma">Firma Cliente</div></div>'+
  '<div class="b-footer">Soggetta a bollo vigente se dovuta</div>'+
  '</div>';
}

function visualizza(id){
 const r=trova(id);if(!r)return;
 $('#viewBody').innerHTML=htmlBlocchetto(r)+
  '<p style="margin-top:16px"><button class="btn" onclick="makePDF(\''+r.id+'\')">Stampa PDF</button></p>';
 $('#viewModal').classList.add('active');
}
function chiudiModal(){$('#viewModal').classList.remove('active');}

function modifica(id){
 const r=trova(id);if(!r)return;
 editingId=id;
 $('#r_cliente').value=r.cliente;
 $('#r_servizio').value=r.servizio;
 $('#r_importo').value=r.importo;
 $('#r_titolo').value=r.titolo||'';
 $('#r_data').value=r.data;
 $('#r_note').value=r.note||'';
 $('#formTitle').textContent='Modifica '+r.numero;
 window.scrollTo(0,0);
}

function elimina(id){
 const r=trova(id);if(!r)return;
 if(!confirm('Eliminare '+r.numero+'?'))return;
 store.list=store.list.filter(x=>x.id!==id);
 save();renderLista();
}

function makePDF(id){
 const r=trova(id);if(!r)return;
 if(!window.jspdf)return alert('Libreria PDF non caricata.');
 try{
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:[80,200],orientation:'portrait'});
  const W=80,H=200;
  // bordo tratteggiato
  doc.setLineDashPattern([1,1],0);
  doc.setDrawColor(80);
  doc.rect(2,2,W-4,H-4);
  doc.setLineDashPattern([],0);
  doc.setTextColor(0,0,0);
  let y=10;
  // Intestazione
  doc.setFont('courier','bold');doc.setFontSize(10);
  doc.text(ident.nome||'STUDIO FOTOGRAFICO',W/2,y,{align:'center'});y+=4;
  doc.setFont('courier','normal');doc.setFontSize(7);
  doc.text([ident.indirizzo,ident.telefono,ident.email,ident.piva?'P.IVA '+ident.piva:''].filter(Boolean).join(' · '),W/2,y,{align:'center'});y+=6;
  doc.setLineWidth(0.3);doc.line(5,y,W-5,y);y+=5;
  // Numero e data
  doc.setFont('courier','bold');doc.setFontSize(16);
  doc.text(r.numero,7,y);
  doc.setFontSize(8);doc.setFont('courier','normal');
  doc.text('RICEVUTA N.',7,y+3);
  doc.setFont('courier','bold');doc.setFontSize(11);
  doc.text(fmtData(r.data),W-7,y,{align:'right'});
  doc.setFontSize(8);doc.setFont('courier','normal');
  doc.text('DATA',W-7,y+3,{align:'right'});
  y+=10;
  doc.setLineWidth(0.1);doc.setLineDashPattern([0.5,0.5],0);
  doc.line(5,y,W-5,y);doc.setLineDashPattern([],0);y+=5;
  // Righe
  const addRow=(lbl,val,big)=>{
   doc.setFont('courier','normal');doc.setFontSize(7);
   doc.setTextColor(100);doc.text(lbl.toUpperCase(),7,y);
   doc.setTextColor(0);
   doc.setFont('courier',big?'bold':'normal');
   doc.setFontSize(big?14:10);
   doc.text(String(val||'—'),7,y+5);
   y+=big?10:8;
   doc.setLineDashPattern([0.5,0.5],0);doc.line(5,y-2,W-5,y-2);doc.setLineDashPattern([],0);
  };
  addRow('Ricevuto da',r.cliente);
  addRow('Servizio',r.servizio);
  addRow('A titolo di',r.titolo||'acconto');
  addRow('Importo','€ '+fmt(r.importo),true);
  if(r.note)addRow('Note',r.note);
  y+=5;
  // Bollo
  doc.setFont('courier','italic');doc.setFontSize(7);doc.setTextColor(80);
  doc.text('Soggetta a bollo vigente se dovuta',W/2,y,{align:'center'});
  y+=8;
  // Firme
  doc.setTextColor(0);doc.setFont('courier','normal');doc.setFontSize(8);
  doc.line(7,y,35,y);doc.line(W-35,y,W-7,y);y+=3;
  doc.text('Firma Studio',7,y);doc.text('Firma Cliente',W-35,y);
  doc.save('Ricevuta_'+r.numero+'.pdf');
 }catch(e){alert('Errore PDF: '+e.message);}
}

function backupGlobale(){
 const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
 const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AppCenterStudio_BACKUP_'+today()+'.json';a.click();
 alert('Backup globale scaricato.');
}
function ripristinoGlobale(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{try{
  const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
  if(typeof d!=='object')throw new Error('File non valido.');
  if(!confirm('Ripristinare? I dati attuali verranno sostituiti.'))return;
  Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
  alert('Ripristinato. Ricarico.');location.reload();
 }catch(err){alert('Errore: '+err.message);}};
 r.readAsText(f);e.target.value='';
}

refreshHead();
$('#r_data').value=today();
renderLista();
loadCloud().then(renderLista);
</script>
</body>
</html>
