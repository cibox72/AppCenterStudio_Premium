<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenter Studio Premium - Benvenuto</title>
<script src="/tema.js"></script>
<style>
:root{--nero:#0e0e0e;--grigio:#6b6b6b;--bordo:#e6e6e6;--carta:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(240,242,247,0.6) 35%, rgba(220,225,235,0.3) 100%),linear-gradient(180deg,#fafafb 0%,#e4e7ee 100%);background-attachment:fixed;color:var(--nero);line-height:1.6}
.topbar{display:flex;gap:8px;padding:12px 20px;background:rgba(255,255,255,0.85);border-bottom:1px solid var(--bordo);position:sticky;top:0;z-index:100;flex-wrap:wrap;align-items:center}
.topbar button{padding:7px 16px;background:var(--carta);border:1px solid #bbb;cursor:pointer;font-size:12px;border-radius:999px;font-family:inherit}
.topbar button:hover{background:var(--nero);color:#fff}
.topbar .brand{margin-left:auto;font-family:Georgia,serif;font-size:12px;letter-spacing:.18em;color:var(--grigio);text-transform:uppercase}
.hero { background: var(--nero); color: #fff; text-align: center; padding: 70px 20px 60px; }
.hero h1 { font-family: Georgia, serif; font-weight: 400; font-size: 42px; }
.hero p { color: #bdbdbd; font-size: 15px; }
.hero .badges { margin-top: 26px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.hbadge { display: inline-block; padding: 7px 18px; border: 1px solid #3d3d3d; border-radius: 999px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #d6d6d6; }
.hbadge.ok { background: #fff; color: var(--nero); border-color: #fff; font-weight: 700; }
.hbadge.ko { background: #7a1010; border-color: #7a1010; color: #fff; font-weight: 700; }
.container { max-width: 1040px; margin: 0 auto; padding: 40px 20px 70px; }
.step-head { display: flex; align-items: baseline; gap: 14px; margin: 46px 0 18px; }
.step-head .n { font-family: Georgia, serif; font-size: 15px; color: #fff; background: var(--nero); width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
.step-head h2 { font-family: Georgia, serif; font-size: 24px; font-weight: 400; }
.card { background: rgba(255,255,255,0.92); border: 1px solid var(--bordo); border-radius: 16px; padding: 28px; margin-bottom: 14px; }
.card .hint { font-size: 13px; color: var(--grigio); margin-bottom: 14px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
label { display: block; margin-top: 12px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #8a8a8a; }
input, textarea { width: 100%; padding: 11px 12px; border: 1px solid var(--bordo); margin-top: 4px; border-radius: 10px; font-family: inherit; font-size: 14px; background: #fff; }
.btn { display: inline-block; padding: 12px 26px; background: var(--nero); color: #fff; border: none; cursor: pointer; font-size: 13px; border-radius: 999px; margin-top: 16px; font-family: inherit; text-transform: uppercase; font-weight: 600; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.app { background: rgba(255,255,255,0.92); border: 1px solid var(--bordo); border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 10px; }
.app h3 { font-family: Georgia, serif; font-size: 19px; font-weight: 400; }
.app p { font-size: 13px; color: var(--grigio); flex: 1; }
.app a { align-self: flex-start; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--nero); text-decoration: none; border-bottom: 1px solid var(--nero); }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="topbar">
  <button onclick="history.back()">Indietro</button>
  <span class="brand">AppCenter Studio Premium</span>
</div>
<section class="hero">
  <h1>Benvenuto, <em id="heroNome">Studio</em></h1>
  <p id="heroSub">Il tuo spazio di lavoro professionale.</p>
  <div class="badges" id="heroBadges"></div>
</section>
<div class="container">
  <div class="card hidden" id="loginCard">
    <h2 style="font-family:Georgia,serif;font-size:22px">Accesso Studio</h2>
    <p class="hint">Inserisci le credenziali associate al tuo studio fotografico.</p>
    <label>Utente</label><input id="lgUser" placeholder="Es. glstudioluigi">
    <label>Password</label><input id="lgPass" type="password">
    <button class="btn" onclick="loginStudio()">Entra</button>
    <div class="lg-err" id="lgErr" style="color:red; margin-top:10px;"></div>
  </div>

  <div id="areaRiservata" class="hidden">
    <div class="step-head"><span class="n">1</span><h2>Dati di contatto</h2></div>
    <div class="card">
      <div class="grid">
        <div><label>Referente</label><input id="cReferente"></div>
        <div><label>WhatsApp</label><input id="cWhatsapp" placeholder="39..."></div>
        <div><label>Email</label><input id="cEmail"></div>
        <div><label>Città</label><input id="cCitta"></div>
      </div>
      <button class="btn" onclick="alert('Dati salvati.')">Salva Contatti</button>
    </div>
    
    <div class="step-head"><span class="n">2</span><h2>Le tue applicazioni</h2></div>
    <div class="apps" id="appsGrid"></div>
  </div>
</div>

<script>
const param = n => new URLSearchParams(window.location.search).get(n);
let studioCode = param('studio') || localStorage.getItem('studioCodeSalvato') || '';

const APPS_LIST = [
  {n:'01 Preventivi & Contratti', d:'Gestione contratti e listini.', p:'/preventivi-contratti/index.html'},
  {n:'02 Workflow Foto & Video', d:'Avanzamento e tracciamento servizi.', p:'/workflow/index.html'},
  {n:'03 Clienti & Foto', d:'Caricamento ed upload immagini su R2.', p:'/clienti-foto/index.html'},
  {n:'04 Selezione per Album', d:'Pannello di selezione provini per i clienti.', p:'/selezione-album/index.html'},
  {n:'06 Negozio Online', d:'Vendita stampe e prodotti.', p:'/negozio/index.html'},
  {n:'07 Agenda Appuntamenti', d:'Calendario scadenze studio.', p:'/agenda/index.html'},
  {n:'08 Ricevute e Acconti', d:'Emissione ricevute in PDF.', p:'/ricevute/index.html'}
];

function fmtData(d){if(!d)return '';const p=String(d).split('-');if(p.length!==3)return d;return p[2]+'/'+p[1]+'/'+p[0].slice(2);}

async function controllaLicenza() {
  if (!studioCode) {
    document.getElementById('loginCard').classList.remove('hidden');
    return;
  }
  try {
    const r = await fetch('/licenses.json?t='+Date.now());
    const data = await r.json();
    const listaStudi = data.studi || [];
    const studio = listaStudi.find(x => x.codice === studioCode);
    
    if (studio && studio.attivo) {
      localStorage.setItem('studioCodeSalvato', studioCode);
      document.getElementById('heroNome').innerText = studio.nome;
      document.getElementById('heroBadges').innerHTML = `<span class="hbadge ok">Licenza Attiva (${studio.codice})</span>`;
      document.getElementById('areaRiservata').classList.remove('hidden');
      document.getElementById('appsGrid').innerHTML = APPS_LIST.map(app => `
        <div class="app">
          <h3>${app.n}</h3>
          <p>${app.d}</p>
          <a href="${app.p}?studio=${encodeURIComponent(studioCode)}">Apri modulo →</a>
        </div>`).join('');
    } else {
      document.getElementById('heroBadges').innerHTML = `<span class="hbadge ko">Licenza Inattiva</span>`;
      document.getElementById('loginCard').classList.remove('hidden');
    }
  } catch(e) {
    document.getElementById('areaRiservata').classList.remove('hidden');
  }
}

async function loginStudio() {
  const u = document.getElementById('lgUser').value.trim();
  const p = document.getElementById('lgPass').value.trim();
  const err = document.getElementById('lgErr');
  try {
    const r = await fetch('/licenses.json?t='+Date.now());
    const data = await r.json();
    const listaStudi = data.studi || [];
    const trovato = listaStudi.find(x => x.utente === u && x.password === p);
    if (trovato) {
      window.location.search = `?studio=${trovato.codice}`;
    } else {
      err.innerText = "Utente o Password errati. Riprova.";
    }
  } catch(e) { err.innerText = "Errore nel caricamento del database licenze."; }
}
window.addEventListener('DOMContentLoaded', controllaLicenza);
</script>
</body>
</html>
