<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium — Benvenuto</title>
<style>
:root{--sfondo:#fbfbfb;--carta:#fff;--testo:#111;--soft:#888;--bordo:#e0e0e0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sfondo);min-height:100vh;padding:20px;color:var(--testo)}
.container{max-width:860px;margin:0 auto}
.app-header{text-align:center;margin-bottom:26px;padding:22px;background:var(--carta);border:1px solid var(--bordo);border-radius:14px}
.app-header img{filter:grayscale(100%)}
.app-header h1{font-family:Georgia,serif;font-size:28px;margin-bottom:6px}
.subtitle{color:var(--soft)}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:20px}
.card h2{font-family:Georgia,serif;font-size:18px;margin-bottom:14px}
.form-group{margin-bottom:14px}
.form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:13px}
.form-group input,.form-group textarea{width:100%;padding:11px;border:1px solid var(--bordo);border-radius:10px;font-size:14px;background:#fff;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{outline:2px solid #111;border-color:transparent}
.btn-wa{padding:12px 24px;background:#111;color:#fff;border:1px solid #111;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;width:100%}
.btn-wa:hover{background:#333}
.btn-paypal{padding:14px 28px;background:#fff;color:#111;border:2px solid #111;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
.btn-paypal:hover{background:#111;color:#fff}
.btn-sec{padding:10px 20px;background:#fff;color:#111;border:1px solid #111;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer}
.btn-sec:hover{background:#111;color:#fff}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.app-card{background:#fff;border:1px solid var(--bordo);border-radius:12px;padding:16px;cursor:pointer;text-align:center;transition:transform .2s}
.app-card:hover{transform:translateY(-3px);border-color:#111}
.app-card .num{font-family:monospace;font-size:11px;color:#bbb;letter-spacing:2px;margin-bottom:6px}
.app-card h3{font-family:Georgia,serif;font-size:15px}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:700;margin-bottom:10px}
.badge.on{background:#111;color:#fff}
.badge.off{background:#fff;color:#888;border:1px solid #ccc}
details{background:#f5f5f5;border:1px solid var(--bordo);border-radius:10px;padding:14px;font-size:13px;line-height:1.8}
summary{cursor:pointer;font-weight:700}
.lock-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center}
.lock-card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:34px;max-width:430px;width:100%;text-align:center}
.paypal-box{background:#f5f5f5;border:2px solid #111;border-radius:12px;padding:20px;margin:16px 0;text-align:center}
.paypal-box h3{margin-bottom:10px}
.paypal-box p{font-size:13px;color:var(--soft);margin-bottom:12px}
.logoPrev{max-height:64px;border:1px solid var(--bordo);border-radius:10px;padding:4px;background:#fff;margin-top:10px;filter:grayscale(100%)}
.nota-info{background:#f5f5f5;border:1px solid var(--bordo);border-radius:10px;padding:14px;font-size:13px;line-height:1.7;color:var(--testo)}
</style>
</head>
<body>
<div class="container">
<header class="app-header"><img id="headLogo" src="logo.png" onerror="this.onerror=null;this.src='logo.jpg';" alt="logo" style="height:64px;border-radius:14px;margin-bottom:10px"><h1>AppCenterStudio Premium</h1><p class="subtitle">Il sistema digitale per il tuo studio fotografico</p></header>
<div id="content"></div>
</div>
<script>
const FORNITORE_WA='393447507656';
const PAYPAL_EMAIL='appcenterstudiopremium@gmail.com';
const APPS=[
 {nome:"Preventivi & Contratti",path:"preventivi-contratti/",num:"01"},
 {nome:"Workflow Foto & Video",path:"workflow/",num:"02"},
 {nome:"Selezione per Album",path:"selezione-album/",num:"03"},
 {nome:"Gallery",path:"gallery/",num:"04"},
 {nome:"Clienti & Foto",path:"clienti-foto/",num:"05"},
 {nome:"Negozio Online",path:"negozio/",num:"06"},
 {nome:"Assistenza Online",path:"assistenza.html",num:"07"}
];
const param=n=>new URLSearchParams(location.search).get(n);
window.addEventListener('DOMContentLoaded',async()=>{
 const code=param('studio');
 if(!code)return err('Link non valido','Chiedi al tuo fornitore il link di attivazione.');
 let s=null;
 try{const l=await(await fetch('licenses.json?t='+Date.now(),{cache:'no-store'})).json();s=(l.studi||[]).find(x=>x.codice===code);}catch(e){}
 if(!s)return err('Link non valido','Questo codice studio non esiste. Contatta il fornitore.');
 const oggi=new Date().toISOString().slice(0,10);
 const attivo=s.attivo&&s.scadenza>=oggi;
 sessionStorage.setItem('studio',code);
 document.getElementById('content').innerHTML=`
 <div class="card">
  <span class="badge ${attivo?'on':'off'}">${attivo?'LICENZA ATTIVA':'LICENZA SCADUTA O SOSPESA'}</span>
  <h2>Benvenuto, ${esc(s.nome)}!</h2>
  <p style="color:var(--soft);font-size:14px">Codice studio: <b style="font-family:monospace">${s.codice}</b> · Scadenza licenza: <b>${s.scadenza}</b></p>
 </div>
 <div class="card">
  <h2>1) Inserisci i dati del tuo studio</h2>
  <p style="color:var(--soft);font-size:13px;margin-bottom:14px">Servono al fornitore per configurare la tua installazione.</p>
  <form onsubmit="inviaDati(event)">
   <div class="form-group"><label>Nome dello studio *</label><input id="dNome" value="${esc(s.nome)}" required></div>
   <div class="form-group"><label>Referente *</label><input id="dRef" required placeholder="Nome e cognome"></div>
   <div class="form-group"><label>WhatsApp *</label><input id="dWa" required placeholder="Es. 39123456789"></div>
   <div class="form-group"><label>Email</label><input id="dMail" type="email" placeholder="studio@email.it"></div>
   <div class="form-group"><label>Città</label><input id="dCity"></div>
   <div class="form-group"><label>Note</label><textarea id="dNote" rows="2" placeholder="Es. uso soprattutto per matrimoni"></textarea></div>
   <button class="btn-wa" type="submit">Invia i dati al fornitore su WhatsApp</button>
  </form>
 </div>
 <div class="card">
  <h2>2) Dati dello Studio e Logo (per PDF e intestazione)</h2>
  <p style="color:var(--soft);font-size:13px;margin-bottom:14px">Compilali subito: compaiono sui PDF (preventivi e contratti) e nell'intestazione delle app. Vengono salvati in questo browser.</p>
  <div class="form-group"><label>Nome Studio</label><input id="s2_nome"></div>
  <div class="form-group"><label>P.IVA</label><input id="s2_piva"></div>
  <div class="form-group"><label>Indirizzo</label><input id="s2_indirizzo"></div>
  <div class="form-group"><label>Telefono</label><input id="s2_telefono"></div>
  <div class="form-group"><label>Email</label><input id="s2_email"></div>
  <div class="form-group"><label>Note fisse su PDF (es. orari, sito web)</label><textarea id="s2_note" rows="2"></textarea></div>
  <h2 style="margin-top:20px">Logo dello Studio</h2>
  <p style="color:var(--soft);font-size:13px;margin-bottom:12px">Carica il logo dello studio. Verrà salvato in locale e, se Netlify è configurato, pubblicato sul sito cliente come /logo.png.</p>
  <label class="btn-sec" style="cursor:pointer">Carica immagine logo<input type="file" id="s2_logo" accept="image/*" hidden></label>
  <button class="btn-sec" id="s2_nologo" type="button" style="margin-left:8px">Rimuovi logo</button>
  <div id="s2_logoPrev"></div>
 </div>
 ${!attivo?`<div class="card">
  <div class="paypal-box">
   <h3>Rinnova la tua licenza</h3>
   <p>La tua licenza è scaduta. Paga l'abbonamento annuale per riattivarla subito.</p>
   <button class="btn-paypal" onclick="pagaAbbonamento()">Paga €199 con PayPal</button>
   <p style="font-size:12px;color:var(--soft);margin-top:8px">Pagamento sicuro con PayPal · Ricevuta immediata</p>
  </div>
 </div>`:''}
 <div class="card">
  <h2>3) Le tue applicazioni</h2>
  <div class="app-grid">${APPS.map(a=>`<div class="app-card" onclick="location.href='${a.path}?studio=${s.codice}'"><div class="num">${a.num}</div><h3>${a.nome}</h3></div>`).join('')}</div>
 </div>
 <div class="card">
  <h2>Installazione Netlify</h2>
  <div class="nota-info"><b>Non devi fare nulla:</b> l'installazione la esegue il fornitore. Quando è pronta ricevi un codice <b>ACS-</b>: apri l'app "Clienti &amp; Foto", incolla il codice nel campo "Codice ricevuto (per lo studio)" e premi "Collega". Da quel momento carichi le foto dei clienti direttamente dalle app.</div>
 </div>`;
 initStudioSection();
});
function initStudioSection(){
 const d=dbGet();const st=d.studio;
 ['nome','piva','indirizzo','telefono','email','note'].forEach(k=>{
  const el=document.getElementById('s2_'+k);if(!el)return;
  el.value=st[k]||'';
  el.addEventListener('input',()=>{st[k]=el.value;dbSave(d);});
 });
 if(st.logoData){const h=document.getElementById('headLogo');if(h)h.src=st.logoData;}
 const prev=()=>{const box=document.getElementById('s2_logoPrev');if(!box)return;box.innerHTML=st.logoData?'<img class="logoPrev" src="'+st.logoData+'" alt="Logo">':'<p style="color:var(--soft);font-size:13px;margin-top:10px">Nessun logo caricato.</p>';};
 prev();
 document.getElementById('s2_logo').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{st.logoData=r.result;dbSave(d);prev();const h=document.getElementById('headLogo');if(h)h.src=st.logoData;publishLogoNetlify(r.result);};
  r.readAsDataURL(f);
 });
 document.getElementById('s2_nologo').addEventListener('click',()=>{st.logoData='';dbSave(d);prev();});
}
/* Archivio condiviso con l'app Preventivi & Contratti (chiave appcenter_db_v1) */
const DB_KEY='appcenter_db_v1';
const DEFAULT_CATEGORIE=[
 {id:'cat1',nome:'Matrimonio',servizi:[
  {id:'m1',nome:'Matrimonio solo file non ritoccati in formato JPEG',prezzo:1200},
  {id:'m2',nome:'Matrimonio con album digitale 30x40 cm, 40 interni, 100 foto, Copertina inclusa e valigia',prezzo:1400},
  {id:'m3',nome:'Matrimonio con album digitale 30x40 cm, 40 interni, 100 foto, con effetti, Copertina inclusa e valigia',prezzo:1600},
  {id:'m4',nome:'Matrimonio con album digitale 35x45 cm, 40 interni, 100 foto, Copertina inclusa e valigia',prezzo:1700},
  {id:'m5',nome:'Matrimonio con album digitale 35x45 cm, 40 interni, 100 foto, con effetti, Copertina inclusa e valigia',prezzo:1900},
  {id:'m6',nome:'Matrimonio con album analogico 33x33 cm, 50 interni, 100 foto, Copertina inclusa e valigia',prezzo:1400},
  {id:'m7',nome:'Matrimonio con album analogico 40x40 cm, 50 interni, 100 foto, Copertina inclusa e valigia',prezzo:1700}]},
 {id:'cat2',nome:'Battesimo / Anniversario / Compleanno',servizi:[
  {id:'b1',nome:'Misura 25x35 cm orizzontale, 20 interni, 60 foto, copertina semplice',prezzo:350},
  {id:'b2',nome:'Misura 25x35 cm orizzontale, 20 interni, 60 foto, copertina extra',prezzo:400},
  {id:'b3',nome:'Ogni foto in più',prezzo:5}]},
 {id:'cat3',nome:'Video',servizi:[
  {id:'v1',nome:'Matrimonio + Drone',prezzo:1200},
  {id:'v2',nome:'Matrimonio + Drone + Live',prezzo:1400},
  {id:'v3',nome:'Matrimonio + Drone + Anteprima',prezzo:1500},
  {id:'v4',nome:'Matrimonio + Drone + Anteprima + Live',prezzo:1600},
  {id:'v5',nome:'Video Post-matrimonio con Drone',prezzo:300},
  {id:'v6',nome:'Battesimo / Anniversario / Compleanno + taglio torta',prezzo:300},
  {id:'v7',nome:'Battesimo / Anniversario / Compleanno + tutta serata',prezzo:400}]}
];
function dbDefault(){return{studio:{nome:'',indirizzo:'',telefono:'',email:'',piva:'',note:'',logoData:''},categorie:JSON.parse(JSON.stringify(DEFAULT_CATEGORIE)),clienti:[],preventivi:[],seq:1};}
function dbGet(){
 try{const d=JSON.parse(localStorage.getItem(DB_KEY));if(d&&typeof d==='object'){
  if(!d.studio)d.studio={nome:'',indirizzo:'',telefono:'',email:'',piva:'',note:'',logoData:''};
  if(!d.categorie)d.categorie=JSON.parse(JSON.stringify(DEFAULT_CATEGORIE));
  if(!d.clienti)d.clienti=[];if(!d.preventivi)d.preventivi=[];if(!d.seq)d.seq=1;
  return d;}}catch(e){}
 const n=dbDefault();localStorage.setItem(DB_KEY,JSON.stringify(n));return n;
}
function dbSave(d){localStorage.setItem(DB_KEY,JSON.stringify(d));}
async function publishLogoNetlify(dataURL){
const tok=localStorage.getItem('netlify_token'),siteId=localStorage.getItem('netlify_site');
if(!tok||!siteId)return;
try{
const resp=await fetch('https://api.netlify.com/api/v1/sites/'+siteId+'/files',{headers:{'Authorization':'Bearer '+tok}});
const existing=resp.ok?await resp.json():[];
const files={};existing.forEach(f=>{files[f.path]=f;});
const bin=atob(dataURL.split(',')[1]);const ab=new ArrayBuffer(bin.length);const u8=new Uint8Array(ab);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
const hash=await crypto.subtle.digest('SHA-1',ab).then(h=>Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''));
const newPath='/logo.png';
if(files[newPath]&&files[newPath].id===hash)return;
files[newPath]={path:newPath,hash:hash};
const dep=await(await fetch('https://api.netlify.com/api/v1/sites/'+siteId+'/deploys',{method:'POST',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({files:files})})).json();
const required=dep.required||[];
if(required.includes(newPath)){
await fetch('https://api.netlify.com/api/v1/sites/'+siteId+'/deploys/'+dep.id+'/files'+newPath,{method:'PUT',headers:{'Authorization':'Bearer '+tok,'Content-Type':'application/octet-stream'},body:ab});
}
console.log('Logo pubblicato su Netlify.');
}catch(err){console.warn('Errore pubblicazione logo Netlify:',err);}
}
function inviaDati(e){
 e.preventDefault();
 const t=`ATTIVAZIONE STUDIO AppCenterStudio\n• Studio: ${document.getElementById('dNome').value}\n• Referente: ${document.getElementById('dRef').value}\n• WhatsApp: ${document.getElementById('dWa').value}\n• Email: ${document.getElementById('dMail').value||'—'}\n• Città: ${document.getElementById('dCity').value||'—'}\n• Note: ${document.getElementById('dNote').value||'—'}`;
 window.open('https://wa.me/'+FORNITORE_WA+'?text='+encodeURIComponent(t),'_blank');
}
function pagaAbbonamento(){
 const url='https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business='+encodeURIComponent(PAYPAL_EMAIL)+'&currency_code=EUR&amount=199.00&item_name=Abbonamento+Annuale+AppCenterStudio+Premium&return='+encodeURIComponent(location.href);
 window.open(url,'_blank');
}
function err(t,s){document.getElementById('content').innerHTML=`<div class="lock-wrap"><div class="lock-card"><div style="font-size:34px">❌</div><h2 style="font-family:Georgia,serif;margin:10px 0 6px">${t}</h2><p style="color:var(--soft)">${s}</p></div></div>`}
function esc(t){return t?t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
</script>
</body>
</html>
