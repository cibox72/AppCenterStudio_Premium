<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clienti e Foto - AppCenterStudio Premium</title>
<script src="/licenza.js"></script>
<script src="/tema.js"></script>
<style>
  :root { --bg-color: #f5f1e8; --text-color: #4a4036; --accent-color: #8b7d6b; --card-bg: #fff; --border-color: #d4c5b0; }
  body { font-family: Georgia, serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; }
  .topbar { background: var(--accent-color); color: #fff; padding: 10px 15px; display: flex; gap: 10px; position: sticky; top: 0; z-index: 100; }
  .topbar button { background: none; border: 1px solid #fff; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  .container { max-width: 800px; margin: 20px auto; padding: 0 15px; }
  .card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .card h2 { margin-top: 0; color: var(--accent-color); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
  label { display: block; margin: 10px 0 5px; font-weight: bold; }
  input[type="text"], input[type="tel"] { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; }
  button.btn { background: var(--accent-color); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; margin: 5px 5px 5px 0; }
  button.btn-danger { background: #b00020; }
  .cliente-box { border-bottom: 1px solid var(--border-color); padding: 15px 0; }
  .cliente-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .cliente-id { color: var(--accent-color); font-size: 0.9em; font-weight: bold; }
  .cartella-row { background: #f9f7f4; padding: 12px; margin: 8px 0; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-color); }
  .upload-box { background: #faf8f5; border: 2px dashed var(--accent-color); padding: 20px; margin-top: 10px; border-radius: 8px; text-align: center; }
  .hidden { display: none; }
  .file-preview { text-align: left; margin: 10px 0; max-height: 150px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 4px; border: 1px solid var(--border-color); }
  .file-item { padding: 5px 0; border-bottom: 1px solid #eee; font-size: 0.9em; display: flex; justify-content: space-between; }
  .progress { width: 100%; height: 20px; background: #e0e0e0; border-radius: 4px; margin: 10px 0; overflow: hidden; }
  .progress-bar { height: 100%; background: var(--accent-color); transition: width 0.3s; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.8em; }
</style>
</head>
<body>
  <div class="topbar">
    <button onclick="history.back()">← Indietro</button>
    <button onclick="location.href='/benvenuto.html'">Home</button>
    <button onclick="backup()">Backup</button>
    <button onclick="ripristina()">Ripristino</button>
  </div>
  <div class="container" id="app">Caricamento in corso...</div>

<script>
const API = 'https://workers.dev';
const R2_PUBLIC = 'https://r2.dev';
const KEY = 'clientifoto_db';
let db = { clienti: [] };

function getParam(n) { return new URLSearchParams(location.search).get(n); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2); }
function genClientId() { return 'CLI-' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000); }

async function loadDb() {
  try {
    const r = await fetch(`${API}/db-load?key=${KEY}`);
    if (r.ok) db = await r.json() || { clienti: [] };
  } catch(e) { console.error('Errore loadDb', e); }
}

async function saveDb() {
  try {
    await fetch(`${API}/db-save?key=${KEY}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(db) });
  } catch(e) { console.error('Errore saveDb', e); }
}

function renderStudio() {
  document.getElementById('app').innerHTML = `
    <div class="card">
      <h2>Nuovo Cliente</h2>
      <label>Nome</label><input type="text" id="nome" placeholder="Nome">
      <label>Cognome</label><input type="text" id="cognome" placeholder="Cognome">
      <label>ID Cliente (Univoco)</label><input type="text" id="idCli" value="${genClientId()}">
      <label>Telefono</label><input type="tel" id="tel" placeholder="3331234567">
      <button class="btn" onclick="salvaCliente()">Salva Cliente</button>
    </div>
    <div class="card"><h2>Archivio Clienti</h2><div id="archivio"></div></div>
  `;
  renderArchivio();
}

function salvaCliente() {
  const nome = document.getElementById('nome').value.trim();
  const cognome = document.getElementById('cognome').value.trim();
  const idCli = document.getElementById('idCli').value.trim() || genClientId();
  const tel = document.getElementById('tel').value.trim();
  if (!nome || !cognome) { alert('Inserisci nome e cognome'); return; }
  db.clienti.push({ id: genId(), idCli, nome, cognome, tel, cartelle: [] });
  saveDb().then(() => { alert('Cliente salvato'); renderStudio(); });
}

function renderArchivio() {
  const div = document.getElementById('archivio');
  if (!db.clienti.length) { div.innerHTML = '<p>Nessun cliente</p>'; return; }
  
  let html = '';
  db.clienti.forEach(c => {
    html += `<div class="cliente-box">
      <div class="cliente-header">
        <strong>${c.cognome} ${c.nome}</strong>
        <span class="cliente-id">ID: ${c.idCli}</span>
      </div>`;
    
    if (!c.cartelle || !c.cartelle.length) {
      html += '<p style="color:#888;font-size:0.9em">Nessuna cartella caricata</p>';
    } else {
      c.cartelle.forEach((cart, idx) => {
        const n = cart.foto ? cart.foto.length : 0;
        html += `<div class="cartella-row">
          <span>📁 ${cart.nome} (${n} foto)</span>
          <button class="btn btn-danger" onclick="eliminaCartella('${c.id}',${idx})">X Elimina</button>
        </div>`;
      });
    }
    
    html += `<div style="margin-top:10px">
      <button class="btn" onclick="toggleUpload('${c.id}')">📁 Carica Cartella</button>
      <button class="btn" onclick="inviaLink('${c.id}')">Invia WhatsApp</button>
      <button class="btn btn-danger" onclick="eliminaCliente('${c.id}')">Elimina Cliente</button>
    </div>
    <div id="up_${c.id}" class="upload-box hidden">
      <h3>Carica cartella per ${c.nome} ${c.cognome}</h3>
      <input type="text" id="folder_name_${c.id}" placeholder="Nome cartella (es. Provini Album)" style="margin-bottom:10px; width:100%; padding:6px; border:1px solid var(--border-color); border-radius:4px;">
      <input type="file" id="f_${c.id}" webkitdirectory directory multiple onchange="mostraAnteprima('${c.id}')">
      <div id="fl_${c.id}" class="file-preview hidden"></div>
      <div id="pr_${c.id}" class="hidden"><div class="progress"><div id="pb_${c.id}" class="progress-bar" style="width:0%">0%</div></div></div>
      <div style="margin-top:10px">
        <button class="btn" onclick="uploadCartella('${c.id}')">💾 Salva Cartella</button>
        <button class="btn" onclick="toggleUpload('${c.id}')">Annulla</button>
      </div>
    </div></div>`;
  });
  div.innerHTML = html;
}

function toggleUpload(id) {
  document.getElementById(`up_${id}`).classList.toggle('hidden');
}

function mostraAnteprima(id) {
  const input = document.getElementById(`f_${id}`);
  const preview = document.getElementById(`fl_${id}`);
  preview.innerHTML = '';
  if (input.files.length > 0) {
    preview.classList.remove('hidden');
    Array.from(input.files).forEach(f => {
      if(f.type.startsWith('image/')) {
        preview.innerHTML += `<div class="file-item"><span>📷 ${f.name}</span></div>`;
      }
    });
  }
}

async function uploadCartella(clienteId) {
  const fileInput = document.getElementById(`f_${clienteId}`);
  const folderInput = document.getElementById(`folder_name_${clienteId}`);
  const folderName = folderInput.value.trim() || "Album Foto";
  if (!fileInput.files.length) { alert('Seleziona una cartella'); return; }
  const files = Array.from(fileInput.files).filter(f => f.type.startsWith('image/'));
  
  const pr = document.getElementById(`pr_${clienteId}`);
  const pb = document.getElementById(`pb_${clienteId}`);
  pr.classList.remove('hidden');
  
  let fotoCaricate = [];
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    const uniqueName = `${clienteId}_${Date.now()}_${file.name}`;
    let percent = Math.round((i / files.length) * 100);
    pb.style.width = percent + '%';
    pb.innerText = `Caricamento ${i+1}/${files.length} (${percent}%)`;
    
    try {
      const resSign = await fetch(`${API}/get-presigned-url?key=${uniqueName}&type=${file.type}`, { method: 'POST' });
      const { uploadUrl } = await resSign.json();
      await fetch(uploadUrl, { method: 'PUT', headers: { 'Content-Type': file.type }, body: file });
      fotoCaricate.push(`${R2_PUBLIC}/${uniqueName}`);
    } catch (e) { console.error(e); }
  }
  
  const cliente = db.clienti.find(c => c.id === clienteId);
  if (cliente) {
    if(!cliente.cartelle) cliente.cartelle = [];
    cliente.cartelle.push({ nome: folderName, foto: fotoCaricate });
    await saveDb();
    alert('Caricamento completato!');
    renderStudio();
  }
}

function inviaLink(clienteId) {
  const cliente = db.clienti.find(c => c.id === clienteId);
  if (!cliente) return;
  const link = `${window.location.origin}/selezione-album/index.html?id=${cliente.id}`;
  const txt = `Ciao ${cliente.nome}, ecco il tuo link sicuro per visionare l'album: ${link}`;
  window.open(`https://whatsapp.com{cliente.tel}&text=${encodeURIComponent(txt)}`, '_blank');
}

function eliminaCartella(clienteId, idx) {
  if (confirm('Eliminare la cartella?')) {
    const c = db.clienti.find(x => x.id === clienteId);
