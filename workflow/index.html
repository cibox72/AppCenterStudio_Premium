<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppCenterStudio Premium — Workflow Foto & Video</title>
<script src="../licenza.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--sfondo:#fbfbfb;--carta:#fff;--testo:#111;--soft:#666;--accento:#111;--bordo:#e0e0e0;--ok:#111;--ko:#666}
*{box-sizing:border-box;margin:0;padding:0;font-family:Georgia,'Segoe UI',Roboto,sans-serif}
body{
  background:
    radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(240,242,247,0.6) 35%, rgba(220,225,235,0.3) 100%),
    repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 2px, transparent 22px),
    repeating-linear-gradient(-45deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 1px, transparent 1px, transparent 32px),
    linear-gradient(180deg,#fafafb 0%,#e4e7ee 100%);
  background-attachment:fixed;
  min-height:100vh;padding:0;color:var(--testo)
}
.container{max-width:1600px;margin:0 auto;padding:20px}

/* TOPBAR */
.topbar{display:flex;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);flex-wrap:wrap;align-items:center}
.topbar .pill{background:rgba(255,255,255,0.8);color:#111;border:1px solid #bbb;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.topbar .pill:hover{background:#111;color:#fff}

header{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px;padding:18px 22px;box-shadow:0 1px 3px rgba(0,0,0,.06);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.logo{font-family:Georgia,serif;font-size:1.6em;font-weight:600;color:var(--testo)}
.logo span{font-size:.55em;display:block;color:var(--soft);font-weight:400}
.actions button{margin-left:8px;padding:9px 16px;border:none;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;color:#fff}
.actions button:hover{opacity:.9}
.btn-new,.btn-archive,.btn-table,.btn-backup,.btn-restore{background:#111;color:#fff}
.btn-new:hover,.btn-archive:hover,.btn-table:hover,.btn-backup:hover,.btn-restore:hover{background:#fff;color:#111;border:1px solid #111}

.new-service{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:none}
.new-service.open{display:block}
.new-service h2{color:var(--testo);font-family:Georgia,serif;margin-bottom:14px}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-row input,.form-row select{flex:1;min-width:200px;padding:10px;border:1px solid var(--bordo);border-radius:10px;font-size:14px;background:#fff;font-family:inherit}
.form-row input:focus,.form-row select:focus{outline:2px solid #111}
.form-actions{display:flex;gap:10px;justify-content:flex-end}
.form-actions button{padding:9px 18px;border:none;border-radius:999px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.btn-save{background:#111;color:#fff}
.btn-cancel{background:#fff;color:#111;border:1px solid #bbb}
.card{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:10px}
.client-info{flex:1;min-width:200px}
.client-name{font-size:1.15em;font-weight:700;color:var(--testo);font-family:Georgia,serif}
.client-date{font-size:.85em;color:var(--soft);margin-top:3px}
.videographer-info{font-size:.85em;color:var(--soft);margin-top:3px;font-weight:500;font-style:italic}
.service-badge{padding:5px 14px;border-radius:999px;font-size:.78em;color:#fff;font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:#111}
.progress-bar{background:#e0e0e0;height:10px;border-radius:5px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:#111;transition:width .4s}
.progress-text{font-size:.85em;color:var(--soft);margin-top:5px}
.progress-row{display:flex;gap:15px;flex-wrap:wrap;margin-top:8px}
.progress-row>div{flex:1;min-width:180px}
.progress-label{font-size:.75em;color:var(--soft);margin-bottom:3px;font-weight:600;text-transform:uppercase}
.steps{margin-top:16px;display:none;padding-top:14px}
.steps.open{display:block}
.section-title{font-size:1em;font-weight:700;padding:9px 14px;margin:10px 0;border-radius:10px;color:#fff;background:#111;font-family:Georgia,serif}
.section-title.preview{background:#444}
.section-title.maternity{background:#333}
.section-title.newborn{background:#666}
.section-title.family{background:#999;color:#111}
.step{display:flex;align-items:center;padding:10px;margin:6px 0;background:#faf9f7;border:1px solid var(--bordo);border-radius:10px;gap:12px;flex-wrap:wrap}
.step.done{background:#fff;border:2px solid #111}
.step input[type=checkbox]{width:20px;height:20px;cursor:pointer;accent-color:#111;flex-shrink:0}
.step-label{flex:1;font-weight:500;min-width:200px}
.step input[type=date]{padding:5px 8px;border:1px solid var(--bordo);border-radius:6px;font-size:.9em;font-family:inherit}
.step input[type=text]{padding:5px 8px;border:1px solid var(--bordo);border-radius:6px;font-size:.9em;width:180px;font-family:inherit}
.step select{padding:5px 8px;border:1px solid var(--bordo);border-radius:6px;font-size:.9em;background:#fff;cursor:pointer;font-family:inherit}
.step.done .step-label{text-decoration:line-through;color:var(--soft)}
.step-extra{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;width:100%;padding-left:32px}
.step-extra input,.step-extra select{flex:1;min-width:150px;font-family:inherit}
.card-footer{margin-top:14px;display:flex;justify-content:flex-end;gap:8px;padding-top:14px;border-top:1px solid var(--bordo);flex-wrap:wrap}
.btn-view,.btn-edit,.btn-pdf,.btn-del{padding:8px 14px;border:none;border-radius:999px;cursor:pointer;font-weight:600;font-size:12px;color:#fff;font-family:inherit}
.btn-view{background:#111}
.btn-edit{background:#555}
.btn-pdf{background:#777}
.btn-del{background:#fff;color:#111;border:1px solid #111}
.empty{text-align:center;padding:50px 20px;color:var(--soft);font-size:1.1em;background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.45);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);border-radius:14px;max-width:800px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid #e0e0e0}
.modal-header{background:#111;color:#fff;padding:20px 24px;border-radius:14px 14px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:1.25em;font-family:Georgia,serif}
.modal-close{background:rgba(255,255,255,.2);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.2em}
.modal-body{padding:22px}
.detail-row{margin-bottom:12px;padding:12px;background:rgba(251,251,251,0.8);backdrop-filter:blur(4px);border:1px solid #e0e0e0;border-radius:10px}
.detail-label{font-weight:600;color:#111;margin-bottom:5px;font-size:.9em}
.detail-value{color:#444;font-size:1em}
.step-detail{padding:10px;margin:6px 0;background:#fff;border-radius:8px;border-left:4px solid #e0e0e0}
.step-detail.completed{border-left-color:#111;background:#f0f0f0}
.step-detail .step-name{font-weight:600;margin-bottom:5px}
.step-detail .step-date{color:#666;font-size:.9em}
.step-detail .step-extra-info{color:#888;font-size:.85em;margin-top:3px}
.archive-header{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.archive-header h2{font-family:Georgia,serif}
.search-box{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--bordo);border-radius:999px;font-size:14px;font-family:inherit;background:#fff}
.filter-select{padding:10px 14px;border:1px solid var(--bordo);border-radius:999px;font-size:14px;font-family:inherit;background:#fff}
.table-container{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);overflow-x:auto}
.table-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px;margin-bottom:12px}
.table-header h2{color:#111;font-size:1.2em;font-family:Georgia,serif}
.table-toolbar{display:flex;gap:10px;flex-wrap:wrap}
.workflow-table{width:100%;border-collapse:collapse;font-size:.95em}
.workflow-table thead{background:#111;color:#fff;position:sticky;top:0;z-index:10}
.workflow-table th{padding:11px 14px;text-align:left;font-weight:600;border:1px solid rgba(255,255,255,.15);font-size:.88em;white-space:nowrap}
.workflow-table th.center{text-align:center}
.workflow-table td{padding:11px 14px;border-bottom:1px solid #e0e0e0;vertical-align:middle}
.workflow-table tbody tr:nth-child(even){background:rgba(251,251,251,0.8)}
.workflow-table tbody tr:nth-child(odd){background:rgba(255,255,255,0.9)}
.workflow-table tbody tr:hover{background:#f0f0f0!important}
.td-client{font-weight:700;color:#111;font-size:1.02em}
.td-type{text-align:center}
.td-center{text-align:center}
.td-laststep{font-weight:600;color:#111}
.td-laststep.empty{color:#999;font-weight:400;font-style:italic}
.badge-cell{display:inline-block;padding:4px 12px;border-radius:999px;color:#fff;font-size:.8em;font-weight:600;background:#111}
.pct-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:.85em;font-weight:700;color:#fff;min-width:50px;text-align:center}
.pct-100{background:#111}
.pct-high{background:#444}
.pct-mid{background:#777}
.pct-low{background:#aaa;color:#111}
.pct-zero{background:#e0e0e0;color:#666}
.cell-actions{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
.cell-actions button{padding:5px 10px;border:none;border-radius:999px;cursor:pointer;font-size:.85em;font-weight:600;color:#fff;font-family:inherit}
.cell-actions button:hover{opacity:.8}
.mini-view{background:#111}
.mini-edit{background:#555}
.mini-pdf{background:#777}
.mini-del{background:#fff;color:#111;border:1px solid #111}
.section-tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.7em;font-weight:600;color:#fff;margin-left:6px;vertical-align:middle;background:#444}
@media(max-width:600px){.logo{font-size:1.3em}.actions button{margin:4px;padding:8px 12px;font-size:.85em}.modal-content{margin:10px}}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <button class="pill" id="tbBack">← Indietro</button>
  <button class="pill" id="tbHome">Home</button>
  <button class="pill" id="tbBackup">Backup Globale</button>
  <button class="pill" id="tbRestore">Ripristino Globale</button>
</div>

<div id="app" class="app">
  <div class="container">
    <header>
      <div class="logo">AppCenterStudio Premium<span>Workflow Foto & Video</span></div>
      <div class="actions">
        <button class="btn-new" onclick="toggleNewService()">Nuovo Servizio</button>
        <button class="btn-archive" onclick="showArchive()">Archivio</button>
        <button class="btn-table" onclick="showTable()">Tabella Clienti</button>
        <button class="btn-backup" onclick="doBackup()">Backup Locale</button>
        <button class="btn-restore" onclick="document.getElementById('restoreFile').click()">Ripristina Locale</button>
      </div>
    </header>

    <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="doRestore(event)">

    <div id="newService" class="new-service">
      <h2>Nuovo Servizio</h2>
      <div class="form-row">
        <input type="text" id="inputClient" placeholder="Nome cliente (es. Rossi - Bianchi)">
        <select id="inputType">
          <option value="">-- Tipo di servizio --</option>
          <optgroup label="Anteprima">
            <option value="Anteprima + Matrimonio">Anteprima + Matrimonio</option>
            <option value="Anteprima + Battesimo">Anteprima + Battesimo</option>
            <option value="Anteprima + 18° Compleanno">Anteprima + 18° Compleanno</option>
          </optgroup>
          <optgroup label="Famiglia & Neonati">
            <option value="Maternity + New Born + Family">Maternity + New Born + Family</option>
            <option value="Maternity + New Born">Maternity + New Born</option>
            <option value="Maternity + Family">Maternity + Family</option>
            <option value="New Born + Family">New Born + Family</option>
            <option value="Maternity">Maternity</option>
            <option value="New Born">New Born</option>
            <option value="Family">Family</option>
          </optgroup>
          <optgroup label="Cerimonie">
            <option value="Matrimonio">Matrimonio</option>
            <option value="Battesimo">Battesimo</option>
            <option value="Comunione">Comunione</option>
            <option value="Cresima">Cresima</option>
          </optgroup>
          <optgroup label="Feste & Celebrazioni">
            <option value="1° Compleanno">1° Compleanno</option>
            <option value="18° Compleanno">18° Compleanno</option>
            <option value="Compleanno">Compleanno</option>
            <option value="Anniversario">Anniversario</option>
          </optgroup>
          <optgroup label="Altro">
            <option value="Evento">Evento</option>
          </optgroup>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="inputDate">
        <input type="text" id="inputVideographer" placeholder="Videografo/Collega (nome)">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="toggleNewService()">Annulla</button>
        <button class="btn-save" onclick="saveService()">Salva</button>
      </div>
    </div>

    <div id="archiveView" style="display:none;">
      <div class="archive-header">
        <h2>Archivio Servizi</h2>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <input type="text" class="search-box" id="searchBox" placeholder="Cerca cliente..." oninput="filterServices()">
          <select class="filter-select" id="filterType" onchange="filterServices()">
            <option value="">Tutti i tipi</option>
            <optgroup label="Anteprima"><option value="Anteprima + Matrimonio">Anteprima + Matrimonio</option><option value="Anteprima + Battesimo">Anteprima + Battesimo</option><option value="Anteprima + 18° Compleanno">Anteprima + 18° Compleanno</option></optgroup>
            <optgroup label="Famiglia & Neonati"><option value="Maternity + New Born + Family">Maternity + New Born + Family</option><option value="Maternity + New Born">Maternity + New Born</option><option value="Maternity + Family">Maternity + Family</option><option value="New Born + Family">New Born + Family</option><option value="Maternity">Maternity</option><option value="New Born">New Born</option><option value="Family">Family</option></optgroup>
            <optgroup label="Cerimonie"><option value="Matrimonio">Matrimonio</option><option value="Battesimo">Battesimo</option><option value="Comunione">Comunione</option><option value="Cresima">Cresima</option></optgroup>
            <optgroup label="Feste & Celebrazioni"><option value="1° Compleanno">1° Compleanno</option><option value="18° Compleanno">18° Compleanno</option><option value="Compleanno">Compleanno</option><option value="Anniversario">Anniversario</option></optgroup>
            <optgroup label="Altro"><option value="Evento">Evento</option></optgroup>
          </select>
          <button class="btn-pdf" onclick="generateArchivePDF()" style="padding:10px 18px;border-radius:999px;background:#111;color:#fff;border:none;cursor:pointer;">PDF Archivio</button>
          <button class="btn-cancel" onclick="showMain()">Torna alla Home</button>
        </div>
      </div>
      <div id="archiveList"></div>
    </div>

    <div id="tableView" style="display:none;">
      <div class="table-container">
        <div class="table-header">
          <h2>Tabella Clienti — Stato Lavori</h2>
          <div class="table-toolbar">
            <input type="text" class="search-box" id="tableSearch" placeholder="Cerca cliente..." oninput="renderTable()" style="min-width:200px;">
            <button class="btn-pdf" onclick="generateTablePDF()" style="padding:10px 18px;border-radius:999px;background:#111;color:#fff;border:none;cursor:pointer;">PDF Tabella</button>
            <button class="btn-cancel" onclick="showMain()">Torna alla Home</button>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="workflow-table" id="workflowTable"></table>
        </div>
      </div>
    </div>

    <div id="servicesList"></div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="detailTitle">Dettagli Servizio</h2>
      <button class="modal-close" onclick="closeModal('detailModal')">×</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<div id="editModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Modifica Servizio</h2>
      <button class="modal-close" onclick="closeModal('editModal')">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <input type="text" id="editClient" placeholder="Nome cliente">
        <select id="editType">
          <optgroup label="Anteprima">
            <option value="Anteprima + Matrimonio">Anteprima + Matrimonio</option>
            <option value="Anteprima + Battesimo">Anteprima + Battesimo</option>
            <option value="Anteprima + 18° Compleanno">Anteprima + 18° Compleanno</option>
          </optgroup>
          <optgroup label="Famiglia & Neonati">
            <option value="Maternity + New Born + Family">Maternity + New Born + Family</option>
            <option value="Maternity + New Born">Maternity + New Born</option>
            <option value="Maternity + Family">Maternity + Family</option>
            <option value="New Born + Family">New Born + Family</option>
            <option value="Maternity">Maternity</option>
            <option value="New Born">New Born</option>
            <option value="Family">Family</option>
          </optgroup>
          <optgroup label="Cerimonie">
            <option value="Matrimonio">Matrimonio</option>
            <option value="Battesimo">Battesimo</option>
            <option value="Comunione">Comunione</option>
            <option value="Cresima">Cresima</option>
          </optgroup>
          <optgroup label="Feste & Celebrazioni">
            <option value="1° Compleanno">1° Compleanno</option>
            <option value="18° Compleanno">18° Compleanno</option>
            <option value="Compleanno">Compleanno</option>
            <option value="Anniversario">Anniversario</option>
          </optgroup>
          <optgroup label="Altro">
            <option value="Evento">Evento</option>
          </optgroup>
        </select>
      </div>
      <div class="form-row">
        <input type="date" id="editDate">
        <input type="text" id="editVideographer" placeholder="Videografo/Collega">
      </div>
      <div class="form-actions">
        <button class="btn-cancel" onclick="closeModal('editModal')">Annulla</button>
        <button class="btn-save" onclick="saveEdit()">Salva Modifiche</button>
      </div>
    </div>
  </div>
</div>
<script>
const TYPE_ORDER = [
  "Anteprima + Matrimonio", "Anteprima + Battesimo", "Anteprima + 18° Compleanno",
  "Maternity + New Born + Family", "Maternity + New Born", "Maternity + Family", "New Born + Family",
  "Maternity", "New Born", "Family",
  "Matrimonio", "Battesimo", "Comunione", "Cresima",
  "1° Compleanno", "18° Compleanno", "Compleanno", "Anniversario",
  "Evento"
];

const STEPS = [
  { id: "download",    label: "Download schede", short: "D" },
  { id: "backupAB",    label: "Archiviazione HD A/B", short: "A" },
  { id: "archiveVideo",label: "Archiviazione Video", short: "V", extra: true, extraType: "archivedBy" },
  { id: "backupAltro", label: "Archiviazione su altro", short: "O", extra: true, extraLabel: "Dove" },
  { id: "rawToJpg",    label: "RAW → JPEG", short: "R" },
  { id: "selection",   label: "Selezione + Copertina", short: "S", extra: true, extraType: "cover" },
  { id: "albumEdit",   label: "Lavorazione album", short: "L" },
  { id: "sendLab",     label: "Invio laboratorio", short: "I" },
  { id: "labToStudio", label: "Lab → Studio", short: "B" },
  { id: "albumClient", label: "Album al cliente", short: "C" },
  { id: "filesClient", label: "Consegna file cliente", short: "F" },
  { id: "videoClient", label: "Video Pronto cliente", short: "P" },
  { id: "confirmDel",  label: "Conferma cancellazione", short: "X" }
];

const STEPS_PREVIEW = [
  { id: "p_download",    label: "Download schede", short: "PD" },
  { id: "p_backupAB",    label: "Archiviazione HD A/B", short: "PA" },
  { id: "p_archiveVideo",label: "Archiviazione Video", short: "PV", extra: true, extraType: "archivedBy" },
  { id: "p_backupAltro", label: "Archiviazione su altro", short: "PO", extra: true, extraLabel: "Dove" },
  { id: "p_rawToJpg",    label: "RAW → JPEG", short: "PR" },
  { id: "p_deliverPreview", label: "Consegna Anteprima al cliente", short: "PC" }
];

const COMBO_TYPES = {
  "Maternity + New Born": ["Maternity", "New Born"],
  "Maternity + Family": ["Maternity", "Family"],
  "Maternity + New Born + Family": ["Maternity", "New Born", "Family"],

function migrateService(s) {
  if (!s) return null;
  if (!s.client) s.client = "Cliente sconosciuto";
  if (!s.type) s.type = "Evento";
  if (!s.steps) s.steps = {};
  if (!s.createdAt) s.createdAt = new Date().toISOString();
  if (s.videographer === undefined) s.videographer = "";
  STEPS.forEach(st => {
    if (!s.steps[st.id]) s.steps[st.id] = { done: false, date: "", extra: {} };
    if (!s.steps[st.id].extra) s.steps[st.id].extra = {};
    if (s.steps[st.id].done === undefined) s.steps[st.id].done = false;
    if (!s.steps[st.id].date) s.steps[st.id].date = "";
  });
  if (isPreviewType(s.type)) {
    if (!s.previewSteps) s.previewSteps = {};
    STEPS_PREVIEW.forEach(st => {
      if (!s.previewSteps[st.id]) s.previewSteps[st.id] = { done: false, date: "", extra: {} };
      if (!s.previewSteps[st.id].extra) s.previewSteps[st.id].extra = {};
      if (s.previewSteps[st.id].done === undefined) s.previewSteps[st.id].done = false;
      if (!s.previewSteps[st.id].date) s.previewSteps[st.id].date = "";
    });
  } else {
    delete s.previewSteps;
  }
  if (isComboType(s.type)) {
    if (!s.sections) s.sections = {};
    COMBO_TYPES[s.type].forEach(secName => {
      if (!s.sections[secName]) s.sections[secName] = {};
      STEPS.forEach(st => {
        if (!s.sections[secName][st.id]) s.sections[secName][st.id] = { done: false, date: "", extra: {} };
        if (!s.sections[secName][st.id].extra) s.sections[secName][st.id].extra = {};
        if (!s.sections[secName][st.id].done === undefined) s.sections[secName][st.id].done = false;
        if (!s.sections[secName][st.id].date) s.sections[secName][st.id].date = "";
      });
    });
  } else {
    delete s.sections;
  }
  return s;
}

function isPreviewType(type) { return type && type.startsWith("Anteprima +"); }
function isComboType(type) { return type && COMBO_TYPES[type]; }
function getComboSections(type) { return COMBO_TYPES[type] || []; }

function getLastMainStepInfo(s) {
  const completed = [];
  const mainSteps = s.steps || {};
  STEPS.forEach((st, idx) => {
    const d = mainSteps[st.id];
    if (d && d.done) completed.push({ label: st.label, date: d.date, order: idx, section: null });
  });
  if (isComboType(s.type) && s.sections) {
    Object.keys(s.sections).forEach(secName => {
      const secSteps = s.sections[secName];
      STEPS.forEach((st, idx) => {
        const d = secSteps[st.id];
        if (d && d.done) completed.push({ label: st.label, date: d.date, order: idx, section: secName });
      });
    });
  }
  if (completed.length === 0) return null;
  completed.sort((a, b) => {
    if (a.date && b.date) { const cmp = a.date.localeCompare(b.date); if (cmp !== 0) return cmp; }
    else if (a.date && !b.date) return -1;
    else if (!a.date && b.date) return 1;
    return a.order - b.order;
  });
  return completed[completed.length - 1];
}

function getLastPreviewStepInfo(s) {
  if (!isPreviewType(s.type) || !s.previewSteps) return null;
  const completed = [];
  STEPS_PREVIEW.forEach((st, idx) => {
    const d = s.previewSteps[st.id];
    if (d && d.done) completed.push({ label: st.label, date: d.date, order: idx });
  });
  if (completed.length === 0) return null;
  completed.sort((a, b) => {
    if (a.date && b.date) { const cmp = a.date.localeCompare(b.date); if (cmp !== 0) return cmp; }
    else if (a.date && !b.date) return -1;
    else if (!a.date && b.date) return 1;
    return a.order - b.order;
  });
  return completed[completed.length - 1];
}

function getVideoReadyDate(s) {
  const mainSteps = s.steps || {};
  const videoStep = mainSteps["videoClient"];
  if (videoStep && videoStep.done && videoStep.date) return videoStep.date;
  if (isComboType(s.type) && s.sections) {
    for (let secName of Object.keys(s.sections)) {
      const secSteps = s.sections[secName];
      const secVideoStep = secSteps["videoClient"];
      if (secVideoStep && secVideoStep.done && secVideoStep.date) return secVideoStep.date;
    }
  }
  return null;
}

function renderSteps(s) {
  let html = '';
  if (isPreviewType(s.type)) {
    html += `<div class="section-title preview">ANTEPRIMA</div>`;
    html += STEPS_PREVIEW.map(st => renderStepRow(s, st, 'preview')).join('');
  }
  if (isComboType(s.type)) {
    const sections = getComboSections(s.type);
    sections.forEach(secName => {
      html += `<div class="section-title ${secName.toLowerCase().replace(' ', '')}">${secName.toUpperCase()}</div>`;
      html += STEPS.map(st => renderComboStepRow(s, st, secName)).join('');
    });
    return html;
  }
  const serviceTitle = isPreviewType(s.type) ? `SERVIZIO (${s.type.replace("Anteprima + ", "")})` : 'WORKFLOW SERVIZIO';
  html += `<div class="section-title service">${serviceTitle}</div>`;
  html += STEPS.map(st => renderStepRow(s, st, 'service')).join('');
  return html;
}

function ensureStep(stepsObj, stepId) {
  if (!stepsObj[stepId]) stepsObj[stepId] = { done: false, date: "", extra: {} };
  if (!stepsObj[stepId].extra) stepsObj[stepId].extra = {};
  return stepsObj[stepId];
}

function handleArchiveByChange(serviceId, stepId, value, section) {

function handleComboArchiveByChange(serviceId, sectionName, stepId, value) {

      const secColor = SECTION_COLORS[secName]?.bg || '#111';
      html += `<div class="detail-row" style="background:${secColor};color:#fff;"><div class="detail-label">Avanzamento ${secName}</div><div class="detail-value">${done}/${STEPS.length} completati (${pct}%)</div></div>`;
    });
    sections.forEach(secName => {
      const secColor = SECTION_COLORS[secName]?.bg || '#111';
      html += `<h3 style="margin:20px 0 10px; padding:10px; background:${secColor}; color:white; border-radius:10px;">${secName.toUpperCase()}</h3>`;
      const secSteps = s.sections?.[secName] || {};
      STEPS.forEach(st => { const d = secSteps[st.id] || { done: false, date: "", extra: {} }; html += renderStepDetail(st, d); });
    });
  } else {
    const serviceDone = countDone(s.steps, STEPS);
    const servicePct = Math.round((serviceDone / STEPS.length) * 100);
    html += `<div class="detail-row"><div class="detail-label">Avanzamento SERVIZIO</div><div class="detail-value">${serviceDone}/${STEPS.length} completati (${servicePct}%)</div></div>`;
    html += `<h3 style="margin:20px 0 10px; padding:10px; background:#444; color:white; border-radius:10px;">SERVIZIO</h3>`;
    STEPS.forEach(st => { const d = (s.steps||{})[st.id] || { done: false, date: "", extra: {} }; html += renderStepDetail(st, d); });
  }
  document.getElementById("detailTitle").textContent = `${s.client} - ${s.type}`;
  document.getElementById("detailBody").innerHTML = html;
  document.getElementById("detailModal").classList.add("active");
}

function renderStepDetail(st, d) {
  const status = d.done ? 'Completato' : 'In attesa';
  const dateStr = d.date ? ` - ${d.date}` : '';
  const extraInfo = [];
  if (st.extraType === "archivedBy" && d.extra?.archivedBy) extraInfo.push(`Archiviato da: ${d.extra.archivedBy}`);
  if (st.extraType === "cover") {
    if (d.extra?.supplier) extraInfo.push(`Fornitore: ${d.extra.supplier}`);
    if (d.extra?.article) extraInfo.push(`Articolo: ${d.extra.article}`);
  }
  if (st.extraLabel && d.extra?.luogo) extraInfo.push(`Luogo: ${d.extra.luogo}`);
  return `<div class="step-detail ${d.done ? 'completed' : ''}"><div class="step-name">${status} - ${st.label}${dateStr}</div>${extraInfo.length ? `<div class="step-extra-info">${extraInfo.join(' | ')}</div>` : ''}</div>`;
}

async function generatePDF(id) {
  const s = services.find(x => x.id === id); if (!s) return;

  const doc = new jsPDF();

  doc.setFontSize(24); doc.text("AppCenterStudio Premium", 15, 20);
  doc.setFontSize(12); doc.text("Workflow Foto & Video", 15, 28);
  doc.setTextColor(0, 0, 0); doc.setFontSize(14);
  doc.text(`Cliente: ${s.client}`, 15, 55);
  doc.text(`Tipo: ${s.type}`, 15, 63);
  doc.text(`Data Evento: ${s.date || 'N/D'}`, 15, 71);
  doc.text(`Videografo: ${s.videographer || 'N/D'}`, 15, 79);

    y += 5;
    doc.setFillColor(68, 68, 68); doc.rect(15, y - 5, 180, 8, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(12); doc.text("SERVIZIO", 20, y);
    doc.setTextColor(0, 0, 0); y += 8;
    STEPS.forEach(st => { const d = (s.steps||{})[st.id] || { done: false, date: "", extra: {} }; y = renderPDFStep(doc, st, d, y); });
  } else if (isComboType(s.type)) {
    const sections = getComboSections(s.type);
    sections.forEach(secName => {
      const secColor = SECTION_COLORS[secName]?.hex || '#111';
      const rgb = hexToRgb(secColor);
      doc.setFillColor(rgb.r, rgb.g, rgb.b); doc.rect(15, y - 5, 180, 8, 'F');
      doc.setTextColor(255, 255, 255); doc.setFontSize(12); doc.text(secName.toUpperCase(), 20, y);
      doc.setTextColor(0, 0, 0); y += 8;
      const secSteps = s.sections?.[secName] || {};
      STEPS.forEach(st => { const d = secSteps[st.id] || { done: false, date: "", extra: {} }; y = renderPDFStep(doc, st, d, y); });
      y += 5;
    });
  } else {
    doc.setFillColor(68, 68, 68); doc.rect(15, y - 5, 180, 8, 'F');
    doc.setTextColor(255, 255, 255); doc.setFontSize(12); doc.text("SERVIZIO", 20, y);
    doc.setTextColor(0, 0, 0); y += 8;
    STEPS.forEach(st => { const d = (s.steps||{})[st.id] || { done: false, date: "", extra: {} }; y = renderPDFStep(doc, st, d, y); });
  }
  doc.setFontSize(10); doc.setTextColor(150, 150, 150);

  doc.save(`AppCenterStudio_${s.client.replace(/\s+/g, '_')}_${s.type.replace(/\s+/g, '_')}.pdf`);
}

function renderPDFStep(doc, st, d, y) {
  const status = d.done ? "[X]" : "[ ]";
  const dateStr = d.date ? ` - ${d.date}` : '';
  const cleanLabel = STEP_LABEL_CLEAN[st.label] || st.label;
  doc.text(`${status} ${cleanLabel}${dateStr}`, 20, y); y += 7;
  const extra = getExtraText(st, d);
  if (extra) { doc.setTextColor(100, 100, 100); doc.text(`    -> ${extra}`, 20, y); doc.setTextColor(0, 0, 0); y += 7; }
  if (y > 270) { doc.addPage(); y = 20; }
  return y;
}
function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? { r: parseInt(result[1], 16), g: parseInt(result[2], 16), b: parseInt(result[3], 16) } : { r: 17, g: 17, b: 17 };
}
function getExtraText(st, d) {
  const extra = [];
  if (st.extraType === "archivedBy" && d.extra?.archivedBy) extra.push(`Archiviato da: ${d.extra.archivedBy}`);
  if (st.extraType === "cover") { if (d.extra?.supplier) extra.push(`Fornitore: ${d.extra.supplier}`); if (d.extra?.article) extra.push(`Articolo: ${d.extra.article}`); }
  if (st.extraLabel && d.extra?.luogo) extra.push(`Luogo: ${d.extra.luogo}`);
  return extra.join(' | ');
}

function renderTable() {
  const search = (document.getElementById("tableSearch")?.value || "").toLowerCase();

  }

      totalSteps = STEPS.length;

    let lastStepHtml = '';
    if (lastStep) {

    tbody += '<tr>';

    tbody += `<td class="td-center">${s.date ? formatDate(s.date) : '-'}</td>`;

    tbody += `<td class="td-center" style="font-weight:600;color:#444;">${videoDisplay}</td>`;
    tbody += `<td>${lastStepHtml}</td>`;
    tbody += `<td class="td-center" style="font-weight:600;color:#444;">${dateDisplay}</td>`;
    tbody += `<td class="td-center"><span class="pct-badge ${pctClass}">${pct}%</span></td>`;
    tbody += `<td><div class="cell-actions">
      <button class="mini-view" onclick="viewService(${s.id})" title="Visualizza">V</button>
      <button class="mini-edit" onclick="editService(${s.id})" title="Modifica">M</button>
      <button class="mini-pdf" onclick="generatePDF(${s.id})" title="PDF">P</button>
      <button class="mini-del" onclick="deleteService(${s.id})" title="Elimina">X</button>
    </div></td>`;
    tbody += '</tr>';
  });
  tbody += '</tbody>';
  table.innerHTML = thead + tbody;
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const parts = dateStr.split('-');
  if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
  return dateStr;
}

    alternateRowStyles: { fillColor: [251, 251, 251] },
    didParseCell: function(data) {
      if (data.section === 'body' && data.column.index === 11) {
        if (data.cell.raw === '100%') {
          data.cell.styles.fillColor = [17, 17, 17];
          data.cell.styles.textColor = [255, 255, 255];
        }
      }
      if (data.section === 'body' && data.column.index === 5) {
        if (data.cell.raw === 'OK') {
          data.cell.styles.fillColor = [238, 238, 238];
        }
      }
    }
  });
  const pageCount = doc.internal.getNumberOfPages();
  for (let i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(100, 100, 100);
    doc.text(`Nota: L'ultimo step del servizio principale è sempre mostrato separatamente dall'anteprima`, 14, doc.internal.pageSize.height - 15);
    doc.text(`Pagina ${i} di ${pageCount}`, 14, doc.internal.pageSize.height - 8);
  }
  doc.save(`AppCenterStudio_Archivio_Clienti_${new Date().toISOString().slice(0,10)}.pdf`);
}

function doBackup() {
  const data = { version: 19, exportedAt: new Date().toISOString(), services };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "AppCenterStudio_Backup_" + new Date().toISOString().slice(0,10) + ".json";
  a.click();
}

function doRestore(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const rawText = ev.target.result;
      let data;
      try { data = JSON.parse(rawText); }
      catch (parseErr) { alert("ERRORE: Il file non è un JSON valido.\n\n" + parseErr.message); return; }
      let servicesToImport = null;
      if (data.services && Array.isArray(data.services)) servicesToImport = data.services;
      else if (Array.isArray(data)) servicesToImport = data;
      else if (data.data && Array.isArray(data.data)) servicesToImport = data.data;
      if (!servicesToImport || servicesToImport.length === 0) {
        alert("ERRORE: Nessun servizio trovato nel file di backup."); return;
      }
      const info = `File di backup trovato:\n\n` +
        `- Servizi: ${servicesToImport.length}\n` +
        `- Versione: ${data.version || 'sconosciuta'}\n` +
        `- Data export: ${data.exportedAt || 'sconosciuta'}\n\n` +
        `Vuoi ripristinare questi ${servicesToImport.length} servizi?\n\n` +
        `ATTENZIONE: i dati attuali verranno sostituiti.`;
      if (!confirm(info)) { e.target.value = ""; return; }
      const migrated = servicesToImport.map(migrateService).filter(s => s !== null);
      if (migrated.length === 0) { alert("ERRORE: Nessun servizio valido dopo la migrazione."); return; }
      services = migrated;
      save();
      renderServices();
      renderTable();
      alert(`RIPRISTINO COMPLETATO!\n\n${migrated.length} servizi recuperati con successo.`);
    } catch (err) {
      alert("ERRORE DURANTE IL RIPRISTINO:\n\n" + err.message);
      console.error(err);
    }
  };
  reader.onerror = () => { alert("ERRORE: Impossibile leggere il file."); };
  reader.readAsText(file);
  e.target.value = "";
}

function closeModal(id) { document.getElementById(id).classList.remove("active"); editingId = null; }

services = services.map(migrateService).filter(s => s !== null);
save();
renderServices();
</script>
