<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Collegamento Netlify</title>
</head>
<body>
<script>
const h=location.hash.replace(/^#/,'');
const p=new URLSearchParams(h);
const tok=p.get('access_token')||'';
const err=p.get('error_description')||p.get('error')||'';
try{
 if(tok){
  localStorage.setItem('netlify_token',tok);
  location.replace('./?netlify=ok');
 }else{
  location.replace('./?netlify=ko'+(err?'&m='+encodeURIComponent(err):''));
 }
}catch(e){
 document.body.textContent='Errore: '+e.message;
}
</script>
</body>
</html>
