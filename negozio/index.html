<!DOCTYPE html>
<html lang="it">
<head>

    <style>

            border: none;

        }
        
        .btn:hover {

        }
        
        .btn-secondary {

            color: #111;

        .btn-secondary:hover {

        }

            margin: 10px 0;

        .order-item h3 {

        input, select, textarea {

        label {

        /* Client View Styles */
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));

            border: 1px solid #e0e0e0;

        .photo-item img {

        .modal {
            display: none;

        .modal.active {

            display: flex;
            justify-content: space-between;

        .cart-item img {

    </style>
</head>
<body>

    <!-- ADMIN VIEW -->

            <h2>Ordini ricevuti</h2>

    <!-- Product Selection Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2>Seleziona prodotto</h2>
            <img id="modalPhotoPreview" style="width:100%;max-width:300px;margin:10px 0;">
            
            <label>Categoria</label>

                <option value="stampa">Stampa</option>
                <option value="tela">Tela</option>

            <div style="margin-top:20px;">
                <button class="btn" onclick="aggiungiAlCarrello()">Aggiungi al carrello</button>

    <script>
        // Global state
        let ordiniRicevuti = JSON.parse(localStorage.getItem('ordiniRicevuti')) || [];
        let negozioConfig = JSON.parse(localStorage.getItem('negozioConfig')) || {
            emailPayPal: 'appcenterstudiopremium@gmail.com',
            whatsapp: '393447507656',
            indirizzo: '',
            note: ''
        };
        let carrello = [];
        let fotoSelezionata = null;
        let currentAlbum = null;
        
        // Check if client view
        const urlParams = new URLSearchParams(window.location.search);
        const siteCode = urlParams.get('n');
        
        if (siteCode) {
            document.getElementById('adminView').classList.add('hidden');
            document.getElementById('clientView').classList.remove('hidden');
            caricaVistaCliente(siteCode);
        } else {
            caricaConfigurazione();
            caricaOrdini();
            generaLinkClienti();
        }
        
        // Admin functions
        function caricaConfigurazione() {
            document.getElementById('configEmailPayPal').value = negozioConfig.emailPayPal;
            document.getElementById('configWhatsApp').value = negozioConfig.whatsapp;
            document.getElementById('configIndirizzo').value = negozioConfig.indirizzo;
            document.getElementById('configNote').value = negozioConfig.note;
        }
        
        function salvaConfigurazione() {
            negozioConfig.emailPayPal = document.getElementById('configEmailPayPal').value;
            negozioConfig.whatsapp = document.getElementById('configWhatsApp').value;
            negozioConfig.indirizzo = document.getElementById('configIndirizzo').value;
            negozioConfig.note = document.getElementById('configNote').value;
            localStorage.setItem('negozioConfig', JSON.stringify(negozioConfig));
            alert('Configurazione salvata');
        }
        
        async function aggiornaOrdini() {
            const netlifyToken = localStorage.getItem('netlify_token');
            const netlifySite = localStorage.getItem('netlify_site');
            
            if (!netlifyToken || !netlifySite) {
                alert('Token o site ID Netlify mancanti');
                return;
            }
            
            try {
                const formsResponse = await fetch(`https://api.netlify.com/api/v1/forms?site_id=${netlifySite}`, {
                    headers: { 'Authorization': `Bearer ${netlifyToken}` }
                });
                const forms = await formsResponse.json();
                
                const ordiniForm = forms.find(f => f.name === 'selezioni');
                if (!ordiniForm) {
                    alert('Form ordini non trovato');
                    return;
                }
                
                const submissionsResponse = await fetch(`https://api.netlify.com/api/v1/forms/${ordiniForm.id}/submissions`, {
                    headers: { 'Authorization': `Bearer ${netlifyToken}` }
                });
                const submissions = await submissionsResponse.json();
                
                const ordini = submissions
                    .filter(s => s.data.tipo === 'ordine')
                    .map(s => ({
                        id: s.id,
                        data: s.created_at,
                        cliente: s.data.cliente,
                        codice: s.data.codice,
                        dati: s.data.dati ? JSON.parse(s.data.dati) : []
                    }));
                
                ordiniRicevuti = ordini;
                localStorage.setItem('ordiniRicevuti', JSON.stringify(ordiniRicevuti));
                caricaOrdini();
                alert(`Aggiornati ${ordini.length} ordini`);
            } catch (error) {
                alert('Errore aggiornamento ordini: ' + error.message);
            }
        }
        function caricaOrdini() {
            const lista = document.getElementById('ordiniLista');
            if (ordiniRicevuti.length === 0) {
                lista.innerHTML = '<p style="margin-top:20px;color:#666;">Nessun ordine ricevuto.</p>';
                return;
            }
            
            lista.innerHTML = ordiniRicevuti.map((ordine, idx) => `
                <div class="order-item">
                    <h3>Ordine #${ordine.id.substring(0,8)} - ${ordine.cliente || 'Cliente'}</h3>
                    <p><strong>Data:</strong> ${new Date(ordine.data).toLocaleString('it-IT')}</p>
                    <p><strong>Codice studio:</strong> ${ordine.codice || 'N/D'}</p>
                    <p><strong>Stato:</strong>
                        <select onchange="aggiornaStatoOrdine(${idx}, this.value)">
                            <option value="selezione effettuata" ${ordine.stato==='selezione effettuata'?'selected':''}>selezione effettuata</option>
                            <option value="text scaricato" ${ordine.stato==='text scaricato'?'selected':''}>text scaricato</option>
                            <option value="ordine pronto" ${ordine.stato==='ordine pronto'?'selected':''}>ordine pronto</option>
                        </select>
                    </p>
                    <p><strong>Articoli:</strong></p>
                    <ul style="margin-left:20px;font-size:13px;">
                        ${(ordine.dati || []).map(d => `<li>${d.foto} - ${d.categoria}${d.colore?' ('+d.colore+')':''} x${d.quantità||1}</li>`).join('')}
                    </ul>
                    <button class="btn btn-danger" onclick="eliminaOrdine(${idx})">Elimina</button>
                </div>
            `).join('');
        }
        
        function aggiornaStatoOrdine(idx, nuovoStato) {
            ordiniRicevuti[idx].stato = nuovoStato;
            localStorage.setItem('ordiniRicevuti', JSON.stringify(ordiniRicevuti));
        }
        
        function eliminaOrdine(idx) {
            if (!confirm('Eliminare questo ordine?')) return;
            ordiniRicevuti.splice(idx, 1);
            localStorage.setItem('ordiniRicevuti', JSON.stringify(ordiniRicevuti));
            caricaOrdini();
        }
        
        function scaricaTextGru() {
            if (ordiniRicevuti.length === 0) {
                alert('Nessun ordine disponibile');
                return;
            }
            
            // Raccogli nomi foto univoci
            const fotoSet = new Set();
            ordiniRicevuti.forEach(o => {
                (o.dati || []).forEach(d => {
                    if (d.foto) fotoSet.add(d.foto);
                });
            });
            
            const fotoUniche = Array.from(fotoSet).sort();
            if (fotoUniche.length === 0) {
                alert('Nessuna foto negli ordini');
                return;
            }
            
            let content = `# Text Gru - Ordini ${new Date().toLocaleDateString('it-IT')}\n\n`;
            content += `Totale file unici: ${fotoUniche.length}\n\n`;
            fotoUniche.forEach((f, i) => {
                content += `${String(i+1).padStart(4,'0')} ${f}\n`;
            });
            
            const blob = new Blob([content], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `ordini_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function generaPDFStampa() {
            if (ordiniRicevuti.length === 0) {
                alert('Nessun ordine disponibile');
                return;
            }
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.setFont('times', 'normal');
            doc.text('ORDINI RICEVUTI - NEGOZIO', 105, 20, {align: 'center'});
            doc.setFontSize(10);
            doc.text(`Generato: ${new Date().toLocaleString('it-IT')}`, 105, 28, {align: 'center'});
            
            let y = 40;
            ordiniRicevuti.forEach((ordine, idx) => {
                if (y > 260) {
                    doc.addPage();
                    y = 20;
                }
                
                doc.setFontSize(12);
                doc.setFont('times', 'bold');
                doc.text(`ORDINE #${idx+1}`, 20, y);
                y += 6;
                
                doc.setFont('times', 'normal');
                doc.setFontSize(10);
                doc.text(`ID: ${ordine.id}`, 20, y); y += 5;
                doc.text(`Cliente: ${ordine.cliente || 'N/D'}`, 20, y); y += 5;
                doc.text(`Data: ${new Date(ordine.data).toLocaleString('it-IT')}`, 20, y); y += 5;
                doc.text(`Stato: ${ordine.stato || 'selezione effettuata'}`, 20, y); y += 5;
                doc.text(`Codice: ${ordine.codice || 'N/D'}`, 20, y); y += 7;
                
                doc.setFont('times', 'bold');
                doc.text('Articoli:', 20, y); y += 5;
                doc.setFont('times', 'normal');
                
                (ordine.dati || []).forEach(d => {
                    if (y > 270) {
                        doc.addPage();
                        y = 20;
                    }
                    const linea = `- ${d.foto} | ${d.categoria}${d.colore?' ('+d.colore+')':''} | x${d.quantità||1}`;
                    doc.text(linea, 25, y);
                    y += 5;
                });
                
                y += 5;
                doc.setDrawColor(200);
                doc.line(20, y-2, 190, y-2);
                y += 5;
            });
            
            doc.save(`ordini_${Date.now()}.pdf`);
        }
        
        async function pubblicaNegozio() {
            const netlifyToken = localStorage.getItem('netlify_token');
            const netlifySite = localStorage.getItem('netlify_site');
            const netlifySiteUrl = localStorage.getItem('netlify_siteurl');
            const codiceStudio = sessionStorage.getItem('studio') || 'demo';
            
            if (!netlifyToken || !netlifySite) {
                alert('Token o site ID Netlify mancanti');
                return;
            }
            
            const statusDiv = document.getElementById('publishStatus');
            statusDiv.innerHTML = '<p>Pubblicazione in corso...</p>';
            
            try {
                // shop.json con configurazione
                const shopData = {
                    attivo: true,
                    emailPayPal: negozioConfig.emailPayPal,
                    whatsapp: negozioConfig.whatsapp,
                    indirizzo: negozioConfig.indirizzo,
                    note: negozioConfig.note,
                    categorie: ['stampa','tela','forex','gadget','plexiglass'],
                    pubblicato: new Date().toISOString()
                };
                
                // Carica anche studio.json se presente
                let studioData = null;
                try {
                    const studioResp = await fetch(`${netlifySiteUrl}/${codiceStudio}/studio.json`);
                    if (studioResp.ok) studioData = await studioResp.json();
                } catch(e) {}
                
                // Headers CORS
                const headersContent = `/*
  Access-Control-Allow-Origin: *
  Access-Control-Allow-Methods: GET, POST, OPTIONS
  Access-Control-Allow-Headers: Content-Type
*/
`;
                
                // Pubblica tramite Netlify API con deploy
                const files = {};
                files[`/${codiceStudio}/shop.json`] = JSON.stringify(shopData, null, 2);
                files[`/${codiceStudio}/_headers`] = headersContent;
                if (studioData) {
                    files[`/${codiceStudio}/studio.json`] = JSON.stringify(studioData, null, 2);
                }
                
                // Crea file digest per deploy
                const fileDigest = {};
                for (const [path, content] of Object.entries(files)) {
                    const hash = await sha256(content);
                    fileDigest[path] = hash;
                }
                
                // Deploy
                const deployResp = await fetch(`https://api.netlify.com/api/v1/sites/${netlifySite}/deploys`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${netlifyToken}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ files: fileDigest })
                });
                
                const deploy = await deployResp.json();
                
                if (deploy.error) {
                    statusDiv.innerHTML = `<p style="color:red;">Errore: ${deploy.error}</p>`;
                    return;
                }
                
                // Upload file
                for (const [path, content] of Object.entries(files)) {
                    const hash = fileDigest[path];
                    await fetch(`https://api.netlify.com/api/v1/deploys/${deploy.id}/files${path}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${netlifyToken}`,
                            'Content-Type': 'application/json'
                        },
                        body: content
                    });
                }
                
                statusDiv.innerHTML = `<p style="color:green;">Negozio pubblicato su ${netlifySiteUrl}/${codiceStudio}/shop.json</p>`;
            } catch (error) {
                statusDiv.innerHTML = `<p style="color:red;">Errore: ${error.message}</p>`;
            }
        }
        
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }
        
        function generaLinkClienti() {
            const clientiFotoData = JSON.parse(localStorage.getItem('clientiFotoData')) || {clients:[]};
            const netlifySiteUrl = localStorage.getItem('netlify_siteurl') || window.location.origin;
            const codiceStudio = sessionStorage.getItem('studio') || 'st-001';
            const container = document.getElementById('clientLinks');
            
            if (!clientiFotoData.clients || clientiFotoData.clients.length === 0) {
                container.innerHTML = '<p style="color:#666;">Nessun cliente in clientiFotoData. Aggiungi clienti tramite l\'app 05.</p>';
                return;
            }
            
            container.innerHTML = clientiFotoData.clients.map(c => {
                const link = `${netlifySiteUrl}/${codiceStudio}/index.html?n=${codiceStudio}/${encodeURIComponent(c.codice||c.nome)}`;
                return `
                    <div class="client-link">
                        <strong>${c.nome} ${c.cognome || ''}</strong>
                        <div style="font-size:13px;margin-top:5px;">${link}</div>
                        <button class="btn btn-secondary" style="margin-top:5px;padding:5px 10px;font-size:12px;" onclick="navigator.clipboard.writeText('${link}').then(()=>alert('Copiato'))">Copia link</button>
                    </div>
                `;
            }).join('');
        }
        
        function backupGlobale() {
            const dati = {
                ordiniRicevuti: ordiniRicevuti,
                negozioConfig: negozioConfig,
                clientiFotoData: JSON.parse(localStorage.getItem('clientiFotoData')) || {clients:[]},
                selezioniRicevute: JSON.parse(localStorage.getItem('selezioniRicevute')) || [],
                studioIdent: JSON.parse(localStorage.getItem('studioIdent')) || null,
                timestamp: new Date().toISOString()
            };
            
            const blob = new Blob([JSON.stringify(dati, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_negozio_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function ripristinoGlobale() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const dati = JSON.parse(ev.target.result);
                        if (dati.ordiniRicevuti) {
                            ordiniRicevuti = dati.ordiniRicevuti;
                            localStorage.setItem('ordiniRicevuti', JSON.stringify(ordiniRicevuti));
                        }
                        if (dati.negozioConfig) {
                            negozioConfig = dati.negozioConfig;
                            localStorage.setItem('negozioConfig', JSON.stringify(negozioConfig));
                        }
                        if (dati.clientiFotoData) localStorage.setItem('clientiFotoData', JSON.stringify(dati.clientiFotoData));
                        if (dati.selezioniRicevute) localStorage.setItem('selezioniRicevute', JSON.stringify(dati.selezioniRicevute));
                        if (dati.studioIdent) localStorage.setItem('studioIdent', JSON.stringify(dati.studioIdent));
                        
                        caricaConfigurazione();
                        caricaOrdini();
                        generaLinkClienti();
                        alert('Ripristino completato');
                    } catch (err) {
                        alert('File non valido: ' + err.message);
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }
        
        function goBack() {
            window.history.back();
        }
        
        function goHome() {
            window.location.href = '../index.html';
        }
        // Client View Logic
        async function caricaVistaCliente(param) {
            // param formato: CODICE_STUDIO/CODICE_CLIENTE
            const parts = param.split('/');
            const codiceStudio = parts[0];
            const codiceCliente = parts[1] || 'guest';
            
            // Base path per le risorse (manifest, shop, studio)
            const basePath = window.location.origin + '/' + codiceStudio;
            
            try {
                const [shopResp, studioResp, manifestResp] = await Promise.all([
                    fetch(`${basePath}/shop.json`),
                    fetch(`${basePath}/studio.json`),
                    fetch(`${basePath}/manifest.json`)
                ]);
                
                // Config negozio (fallback se non pubblicato)
                const shopConfig = shopResp.ok ? await shopResp.json() : {
                    emailPayPal: 'appcenterstudiopremium@gmail.com',
                    whatsapp: '393447507656',
                    indirizzo: '',
                    note: ''
                };
                
                // Dati studio
                const studioData = studioResp.ok ? await studioResp.json() : {
                    nome: 'Studio Fotografico', 
                    messaggio: 'Benvenuto nel nostro negozio online'
                };
                
                // Manifest (struttura album)
                const manifest = manifestResp.ok ? await manifestResp.json() : [];
                
                // Aggiorna UI
                document.getElementById('studioName').textContent = studioData.nome || 'Negozio Online';
                document.getElementById('studioMessage').textContent = studioData.messaggio || '';
                
                // Salva stato globale per checkout
                window.currentShopConfig = shopConfig;
                window.currentStudioCode = codiceStudio;
                window.currentClientCode = codiceCliente;
                
                // Parsing manifest: supporta array di stringhe, array di oggetti, o oggetto con chiave 'albums'
                let albums = [];
                if (Array.isArray(manifest)) {
                    if (manifest.length > 0 && typeof manifest[0] === 'string') {
                        // Lista semplice di file -> singolo album
                        albums = [{name: 'Tutte le foto', path: '', files: manifest}];
                    } else {
                        albums = manifest;
                    }
                } else if (manifest.albums) {
                    albums = manifest.albums;
                } else if (manifest.files) {
                    albums = [{name: 'Tutte le foto', path: '', files: manifest.files}];
                }
                
                renderAlbums(albums, basePath);
                
            } catch (err) {
                alert('Errore caricamento negozio: ' + err.message);
            }
        }
        
        function renderAlbums(albums, basePath) {
            const grid = document.getElementById('albumGrid');
            if (!albums || albums.length === 0) {
                grid.innerHTML = '<p>Nessun album disponibile.</p>';
                return;
            }
            
            grid.innerHTML = albums.map((album, idx) => `
                <div class="album-card" onclick="apriAlbum(${idx})">
                    <h3>${album.name || 'Album ' + (idx+1)}</h3>
                    <p>${(album.files || album.photos || []).length} foto</p>
                </div>
            `).join('');
            
            window.currentAlbums = albums;
            window.currentBasePath = basePath;
        }
        
        function apriAlbum(idx) {
            const album = window.currentAlbums[idx];
            const basePath = window.currentBasePath;
            const photos = album.files || album.photos || [];
            
            document.getElementById('photoSection').classList.remove('hidden');
            const grid = document.getElementById('photoGrid');
            
            grid.innerHTML = photos.map((photo) => {
                // Costruzione URL immagine
                let imgUrl = photo;
                if (!photo.startsWith('http') && !photo.startsWith('/')) {
                    if (album.path) {
                        imgUrl = `${basePath}/${album.path}/${photo}`;
                    } else {
                        imgUrl = `${basePath}/${photo}`;
                    }
                }
                
                return `
                    <div class="photo-item" onclick="openProductModal('${imgUrl}', '${photo}')">
                        <img src="${imgUrl}" alt="${photo}" loading="lazy">
                    </div>
                `;
            }).join('');
            
            document.getElementById('photoSection').scrollIntoView({behavior: 'smooth'});
        }
        
        function openProductModal(imgUrl, photoName) {
            fotoSelezionata = { url: imgUrl, name: photoName };
            document.getElementById('modalPhotoPreview').src = imgUrl;
            document.getElementById('productModal').classList.add('active');
        }
        
        function chiudiModal() {
            document.getElementById('productModal').classList.remove('active');
            fotoSelezionata = null;
        }
        
        function aggiungiAlCarrello() {
            if (!fotoSelezionata) return;
            
            const categoria = document.getElementById('productCategory').value;
            const colore = document.getElementById('productColor').value;
            const quantità = parseInt(document.getElementById('productQuantity').value) || 1;
            
            carrello.push({
                foto: fotoSelezionata.name,
                url: fotoSelezionata.url,
                categoria: categoria,
                colore: colore,
                quantità: quantità
            });
            
            chiudiModal();
            renderCarrello();
            document.getElementById('cartSection').classList.remove('hidden');
        }
        
        function renderCarrello() {
            const container = document.getElementById('cartItems');
            if (carrello.length === 0) {
                container.innerHTML = '<p>Il carrello è vuoto.</p>';
                return;
            }
            
            container.innerHTML = carrello.map((item, idx) => `
                <div class="cart-item">
                    <img src="${item.url}">
                    <div style="flex:1;margin:0 10px;">
                        <strong>${item.foto}</strong><br>
                        <small>${item.categoria} ${item.colore?'- '+item.colore:''} x${item.quantità}</small>
                    </div>
                    <button class="btn btn-danger" style="padding:5px 10px;" onclick="rimuoviDalCarrello(${idx})">X</button>
                </div>
            `).join('');
        }
        
        function rimuoviDalCarrello(idx) {
            carrello.splice(idx, 1);
            renderCarrello();
            if (carrello.length === 0) {
                document.getElementById('cartSection').classList.add('hidden');
            }
        }
        
        async function completaOrdine() {
            if (carrello.length === 0) return;
            
            const shopConfig = window.currentShopConfig;
            const codiceStudio = window.currentStudioCode;
            const codiceCliente = window.currentClientCode;
            
            // 1. POST al form Netlify (iframe nascosto)
            const iframe = document.createElement('iframe');
            iframe.name = 'hidden_iframe_' + Date.now();
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
            
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/';
            form.target = iframe.name;
            form.setAttribute('name', 'selezioni');
            
            const fields = {
                'form-name': 'selezioni',
                'tipo': 'ordine',
                'codice': codiceStudio,
                'cliente': codiceCliente,
                'dati': JSON.stringify(carrello)
            };
            
            for (const [key, value] of Object.entries(fields)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                form.appendChild(input);
            }
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
            
            // 2. Preparazione Link
            const waNumber = shopConfig.whatsapp || '393447507656';
            const waText = encodeURIComponent(`Nuovo ordine da ${codiceCliente} per studio ${codiceStudio}. Articoli: ${carrello.length}.`);
            const waLink = `https://wa.me/${waNumber}?text=${waText}`;
            
            const ppEmail = shopConfig.emailPayPal || 'appcenterstudiopremium@gmail.com';
            const ppLink = `https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=${encodeURIComponent(ppEmail)}&item_name=Ordine+Foto+${codiceCliente}&amount=0.00&currency_code=EUR`;
            
            // 3. Schermata Success
            const clientView = document.getElementById('clientView');
            clientView.innerHTML = `
                <div class="container" style="text-align:center;padding:50px;">
                    <h1>Ordine Inviato!</h1>
                    <p>Grazie per il tuo ordine. Lo studio è stato notificato.</p>
                    
                    <div class="card" style="text-align:left;max-width:500px;margin:20px auto;">
                        <h3>Promemoria WhatsApp</h3>
                        <p>Invia un messaggio allo studio per conferma:</p>
                        <a href="${waLink}" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;margin:10px 0;">Apri WhatsApp</a>
                    </div>
                    
                    <div class="card" style="text-align:left;max-width:500px;margin:20px auto;">
                        <h3>Pagamento PayPal</h3>
                        <p>Invia il pagamento a:</p>
                        <p style="font-weight:bold;font-size:18px;text-align:center;margin:10px 0;">${ppEmail}</p>
                        <a href="${ppLink}" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;margin:10px 0;">Paga con PayPal</a>
                        <p style="font-size:12px;color:#666;text-align:center;">Nota: L'importo verrà concordato con lo studio.</p>
                    </div>
                    
                    <div class="card" style="text-align:left;max-width:500px;margin:20px auto;">
                        <h3>Indirizzo di ritiro/spedizione</h3>
                        <p>${shopConfig.indirizzo || 'Da concordare'}</p>
                        <p style="font-style:italic;">${shopConfig.note || ''}</p>
                    </div>
                    
                    <button class="btn btn-secondary" onclick="window.close()">Chiudi</button>
                </div>
            `;
            
            // Cleanup iframe
            setTimeout(() => {
                if (document.body.contains(iframe)) {
                    document.body.removeChild(iframe);
                }
            }, 5000);
        }
    </script>
</body>
