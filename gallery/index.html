<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - AppCenterStudio Premium</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:linear-gradient(180deg,#faf9f7 0%,#ece7de 100%);background-attachment:fixed;min-height:100vh;color:#111}
.g-head{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border-bottom:1px solid #e2ddd3;padding:22px 16px;text-align:center}
.g-head img{height:52px;border-radius:50%;filter:grayscale(100%);margin-bottom:8px}
.g-head h1{font-family:Georgia,serif;font-size:20px}
.g-head p{font-size:13px;color:#8a8578;margin-top:4px}
.g-badge{display:inline-block;padding:6px 14px;background:#111;color:#fff;border-radius:999px;font-size:12px;font-weight:600;margin-top:10px}
.count-bar{position:sticky;top:0;z-index:6;background:rgba(255,255,255,0.92);backdrop-filter:blur(10px);border-bottom:1px solid #e2ddd3;text-align:center;padding:9px;font-size:13px;font-weight:700;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px;max-width:1100px;margin:0 auto}
.ph{border-radius:10px;overflow:hidden;border:1px solid #e2ddd3;background:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(40,30,10,.05)}
.ph img{width:100%;height:160px;object-fit:cover;display:block}
.ph .fname{font-size:10px;color:#8a8578;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border:1px solid #e2ddd3;border-radius:14px;padding:36px;max-width:430px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(40,30,10,.10)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:none;flex-direction:column}
.lb.open{display:flex}
.lb-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#fff}
.lb-count{font-family:monospace;font-size:14px}
.lb-btn{background:transparent;border:1px solid #fff;color:#fff;border-radius:999px;padding:6px 16px;cursor:pointer;font-size:14px}
.lb-btn:hover{background:#fff;color:#111}
.lb-imgwrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;padding:0 60px;min-height:0}
.lb-imgwrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#fff}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:1px solid #fff;background:rgba(0,0,0,.55);color:#fff;font-size:20px;cursor:pointer}
.lb-nav:hover{background:#fff;color:#111}
.lb-nav.prev{left:10px}.lb-nav.next{right:10px}
.lb-bottom{text-align:center;padding:10px;color:#bbb;font-size:12px;font-family:monospace}
@media(max-width:640px){.lb-imgwrap{padding:0 8px}.lb-nav{width:38px;height:38px;font-size:16px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const WORKER='https://acs-api.mairaluigi.workers.dev';
const R2_BASE='https://pub-c2b1d2cacc784ad3b4b10b82631b3b0a.r2.dev';
const param=n=>new URLSearchParams(location.search).get(n);
function todayStr(){return new Date().toISOString().slice(0,10);}
function fmtData(d){if(!d)return '';const p=String(d).split('-');if(p.length!==3)return d;return p[2]+'/'+p[1]+'/'+p[0].slice(2);}
function esc(t){return t?t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function errPage(msg){document.getElementById('root').innerHTML='<div class="lock-wrap"><div class="lock-card"><h2 style="font-family:Georgia,serif">Gallery</h2><p style="color:#8a8578">'+esc(msg)+'</p></div></div>'}

let PH=[],LB=0,MAN=null,G_STUDIO='',G_CLIENTE='';

window.addEventListener('DOMContentLoaded',()=>{
 const g=param('g')||param('s');
 if(!g)return errPage('Link non valido. Contatta lo studio.');
 const parts=decodeURIComponent(g).split('/');
 if(parts.length<2)return errPage('Link non valido. Contatta lo studio.');
 G_STUDIO=parts[0];G_CLIENTE=parts.slice(1).join('/');
 avvia();
});

async function avvia(){
 try{MAN=await(await fetch(WORKER+'/manifest?studio='+encodeURIComponent(G_STUDIO)+'&cliente='+encodeURIComponent(G_CLIENTE)+'&t='+Date.now(),{cache:'no-store'})).json();}catch(e){MAN=null;}
 if(!MAN||!MAN.gallery||!MAN.gallery.length)return errPage('La gallery non e\' ancora pronta. Contatta lo studio.');
 if(MAN.scadenza_gallery&&MAN.scadenza_gallery<todayStr())return errPage('Questa gallery e\' scaduta. Contatta lo studio per una proroga.');
 PH=MAN.gallery;
 document.title='Gallery'+(MAN.nome_studio?' - '+MAN.nome_studio:'');
 const logo=MAN.logo?R2_BASE+'/'+G_STUDIO+'/'+G_CLIENTE+'/'+MAN.logo:'';
 document.getElementById('root').innerHTML=`
 <div class="g-head">${logo?`<img src="${logo}" alt="logo" onerror="this.style.display='none'"><br>`:''}
  <h1>${esc(MAN.nome_studio||'Studio Fotografico')}</h1>
  <p>Le vostre foto pronte da sfogliare</p>
  ${MAN.scadenza_gallery?`<span class="g-badge">Disponibile fino al ${esc(fmtData(MAN.scadenza_gallery))}</span>`:''}
 </div>
 <div class="count-bar">${PH.length} foto nella vostra gallery</div>
 <div class="grid" id="grid"></div>
 <div class="lb" id="lb">
  <div class="lb-top">
   <span class="lb-count" id="lbCount"></span>
   <button class="lb-btn" onclick="closeLb()">Chiudi &#x2715;</button>
  </div>
  <div class="lb-imgwrap" id="lbWrap">
   <button class="lb-nav prev" onclick="lbPrev(event)">&#x2190;</button>
   <img id="lbImg" src="" alt="">
   <button class="lb-nav next" onclick="lbNext(event)">&#x2192;</button>
  </div>
  <div class="lb-bottom" id="lbName"></div>
 </div>`;
 draw();setupLb();
}
function photoUrl(i){return R2_BASE+'/'+G_STUDIO+'/'+G_CLIENTE+'/gallery/'+encodeURIComponent(PH[i])}
function draw(){
 document.getElementById('grid').innerHTML=PH.map((p,i)=>`
  <div class="ph" onclick="openLb(${i})">
   <img src="${photoUrl(i)}" loading="lazy" alt="">
   <div class="fname">${esc(p)}</div>
  </div>`).join('');
}
function openLb(i){LB=i;renderLb();document.getElementById('lb').classList.add('open');document.body.style.overflow='hidden';}
function closeLb(){document.getElementById('lb').classList.remove('open');document.body.style.overflow='';}
function renderLb(){
 document.getElementById('lbImg').src=photoUrl(LB);
 document.getElementById('lbName').textContent=PH[LB];
 document.getElementById('lbCount').textContent=(LB+1)+' / '+PH.length;
}
function lbPrev(e){if(e)e.stopPropagation();LB=(LB-1+PH.length)%PH.length;renderLb();}
function lbNext(e){if(e)e.stopPropagation();LB=(LB+1)%PH.length;renderLb();}
function setupLb(){
 const w=document.getElementById('lbWrap');if(!w)return;
 let tx=0,ty=0;
 w.addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
 w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){dx<0?lbNext():lbPrev();}},{passive:true});
 document.addEventListener('keydown',e=>{
  if(!document.getElementById('lb').classList.contains('open'))return;
  if(e.key==='ArrowLeft'){e.preventDefault();lbPrev();}
  if(e.key==='ArrowRight'){e.preventDefault();lbNext();}
  if(e.key==='Escape')closeLb();
 });
}
</script>
</body>
</html>
