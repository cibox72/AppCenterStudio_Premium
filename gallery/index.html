<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AppCenterStudio Premium - Gallery</title>
<style>
:root{--sfondo:#f6f4f0;--carta:#fff;--testo:#2e2e38;--soft:#8a8a96;--accento:#6f7f8f;--bordo:#e6e2da;--ok:#7d9b8a;--ko:#b98a8a}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--sfondo);min-height:100vh;color:var(--testo)}
.lock-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:#fff;border:1px solid var(--bordo);border-radius:14px;padding:36px;max-width:430px;width:100%;text-align:center}
.card{background:var(--carta);border:1px solid var(--bordo);border-radius:14px;padding:22px;margin-bottom:22px}
.card h2{color:var(--accento);margin-bottom:14px;font-family:Georgia,serif;font-size:18px}
.info-box{background:#eef4f0;border-left:4px solid var(--ok);padding:14px 16px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.7}
.btn-primary{padding:12px 24px;background:var(--accento);color:#fff;border:none;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn-wa{padding:14px 28px;background:#25d366;color:#fff;border:none;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin-top:12px}
/* ===== VISTA CLIENTE ===== */
.g-head{background:#fff;border-bottom:1px solid var(--bordo);padding:14px 16px;text-align:center}
.g-head img{height:52px;border-radius:50%;object-fit:cover;margin-bottom:6px}
.g-head h1{font-family:Georgia,serif;font-size:19px;color:var(--accento)}
.g-head p{font-size:13px;color:var(--soft);margin-top:4px}
.viewer{position:fixed;inset:0;background:#14141a;display:flex;flex-direction:column}
.v-top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;color:#eee;background:rgba(0,0,0,.55)}
.v-top .studio{font-family:Georgia,serif;font-size:15px}
.v-top .count{font-family:monospace;font-size:13px;background:rgba(255,255,255,.15);padding:4px 12px;border-radius:999px}
.v-stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:pan-y}
.v-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;transition:opacity .25s}
.v-hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);color:#fff;background:rgba(0,0,0,.5);padding:8px 18px;border-radius:999px;font-size:13px;pointer-events:none}
.v-bar{display:flex;justify-content:center;gap:14px;padding:12px;background:rgba(0,0,0,.55)}
.v-btn{width:52px;height:52px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;font-size:22px;cursor:pointer}
.v-btn:active{background:rgba(255,255,255,.3)}
.v-btn.dl{background:var(--ok);font-size:20px}
.thanks{position:fixed;inset:0;background:var(--sfondo);display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.thanks .box{background:#fff;border:1px solid var(--bordo);border-radius:16px;padding:36px 26px;max-width:460px;width:100%}
.thanks img{height:64px;border-radius:50%;object-fit:cover;margin-bottom:10px}
.thanks h1{font-family:Georgia,serif;font-size:26px;color:var(--accento);margin-bottom:10px}
.thanks p{color:var(--soft);font-size:15px;line-height:1.6}
</style>
</head>
<body>
<div id="root"></div>
<script>
const $=id=>document.getElementById(id);
const param=n=>new URLSearchParams(location.search).get(n);
window.addEventListener('DOMContentLoaded',()=>{
 const g=param('g');
 if(g)return clientMode(g);
 adminGate();
});
/* ===== ADMIN (solo indirizzo) ===== */
function blocca(msg){document.getElementById('root').innerHTML=`<div class="lock-wrap"><div class="lock-card"><div style="font-size:34px">🔒</div><h2 style="margin:10px 0 6px;font-family:Georgia,serif">Licenza non attiva</h2><p style="color:var(--soft)">${msg}</p></div></div>`}
async function adminGate(){
 const codice=param('studio')||sessionStorage.getItem('studio');
 if(!codice)return blocca('Accedi da AppCenterStudio‑Premium per aprire le applicazioni.');
 sessionStorage.setItem('studio',codice);
 try{
  const l=await(await fetch('../licenses.json?t='+Date.now(),{cache:'no-store'})).json();
  const s=(l.studi||[]).find(x=>x.codice===codice);
  const oggi=new Date().toISOString().slice(0,10);
  if(!s)return blocca('Codice studio non riconosciuto.');
  if(!s.attivo)return blocca('Accesso sospeso. Contatta il fornitore.');
  if(s.scadenza<oggi)return blocca('Prova scaduta. Contatta il fornitore.');
 }catch(e){return blocca('Verifica licenza non riuscita.');}
 document.getElementById('root').innerHTML=`<div class="lock-wrap"><div style="max-width:640px;width:100%">
 <div class="card"><h2>📁 Gallery — consegna automatica su Netlify</h2>
 <div class="info-box">Le gallery ora vivono sul tuo sito Netlify, insieme alle foto dei clienti.<br><br>Per creare una gallery:<br>1. apri <b>Clienti &amp; Foto</b>;<br>2. carica le foto del cliente;<br>3. premi <b>📁 Link Gallery</b> e mandalo al cliente.<br><br>Il cliente aprirà le foto con swipe, download, logo e messaggio del tuo studio — da telefono, tablet o PC.</div>
 <a class="btn-primary" href="../clienti-foto/?studio=${codice}">👥 Apri Clienti &amp; Foto</a>
 </div></div></div>`;
}
/* ===== VISTA CLIENTE ===== */
function errPage(msg){document.getElementById('root').innerHTML=`<div class="lock-wrap"><div class="lock-card"><div style="font-size:34px">❌</div><h2 style="margin:10px 0 6px;font-family:Georgia,serif">Galleria non disponibile</h2><p style="color:var(--soft)">${msg}</p></div></div>`}
async function clientMode(g){
 const parts=decodeURIComponent(g).split('/');
 if(parts.length<2)return errPage('Link non valido. Contatta lo studio.');
 const site=parts[0],code=parts.slice(1).join('/');
 const base='https://'+site+'.netlify.app/'+code;
 let manifest=null,studio=null;
 try{manifest=await(await fetch(base+'/manifest.json?t='+Date.now(),{cache:'no-store'})).json();}catch(e){}
 if(!manifest||!manifest.photos||!manifest.photos.length)return errPage('Nessuna foto pubblicata. Contatta lo studio.');
 try{studio=await(await fetch('https://'+site+'.netlify.app/studio.json?t='+Date.now(),{cache:'no-store'})).json();}catch(e){}
 document.title=(studio&&studio.nome?studio.nome:'Gallery')+' — '+(manifest.nome||'')+' '+(manifest.cognome||'');
 renderViewer(base,manifest,studio);
}
let PH=[],BASE='',IDX=0,STUDIO=null,touchX=null;
function photoUrl(i){return BASE+'/'+PH[i].split('/').map(encodeURIComponent).join('/')}
function renderViewer(base,manifest,studio){
 BASE=base;PH=manifest.photos;STUDIO=studio||{};IDX=0;
 const logo=STUDIO.logo?'https://'+base.split('/')[2]+'/'+STUDIO.logo:'';
 document.getElementById('root').innerHTML=`
 <div class="viewer">
  <div class="v-top"><span class="studio">${esc(STUDIO.nome||'Gallery')}</span><span class="count" id="cnt"></span></div>
  <div class="v-stage" id="stage"><img id="ph" alt="Foto"><div class="v-hint" id="hint">👈 scorri per sfogliare 👉</div></div>
  <div class="v-bar">
   <button class="v-btn" onclick="prev()">‹</button>
   <button class="v-btn dl" onclick="scarica()" title="Scarica foto">⬇️</button>
   <button class="v-btn" onclick="next()">›</button>
  </div>
 </div>`;
 const st=$('stage');
 st.addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
 st.addEventListener('touchend',e=>{
  if(touchX===null)return;
  const dx=e.changedTouches[0].clientX-touchX;touchX=null;
  if(dx<-40)next();else if(dx>40)prev();
 },{passive:true});
 document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
 show(0);
}
function show(i){
 if(i>=PH.length)return thanks();
 IDX=i;
 const img=$('ph');
 img.style.opacity=.3;
 img.onload=()=>{img.style.opacity=1;};
 img.src=photoUrl(i);
 $('cnt').textContent=(i+1)+' / '+PH.length;
 if(i===0&&PH.length>1)$('hint').style.display='block';else if($('hint'))$('hint').style.display='none';
 if(i+1<PH.length){const p=new Image();p.src=photoUrl(i+1);}
}
function next(){show(IDX+1)}
function prev(){if(IDX>0)show(IDX-1)}
async function scarica(){
 const url=photoUrl(IDX);
 const name=PH[IDX].split('/').pop();
 try{
  const r=await fetch(url);
  const b=await r.blob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
 }catch(e){window.open(url,'_blank');}
}
function thanks(){
 const logo=STUDIO.logo?'https://'+BASE.split('/')[2]+'/'+STUDIO.logo:'';
 const wa=STUDIO.whatsapp?`https://wa.me/${STUDIO.whatsapp}?text=`+encodeURIComponent('Ciao! Ho visto le mie foto, grazie! 😍'):'';
 document.getElementById('root').innerHTML=`
 <div class="thanks"><div class="box">
  ${logo?`<img src="${logo}" alt="logo">`:''}
  <h1>Grazie per averci scelto! 💛</h1>
  <p>${esc(STUDIO.messaggio||'Le vostre foto, con amore.')}</p>
  <p style="margin-top:14px;font-size:13px">— ${esc(STUDIO.nome||'Lo Studio')}</p>
  ${wa?`<a class="btn-wa" href="${wa}" target="_blank">💬 Scrivici su WhatsApp</a>`:''}
  <br><button class="btn-primary" style="margin-top:14px" onclick="show(0)">🔄 Rivedi le foto</button>
 </div></div>`;
}
function esc(t){return t?t.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
</script>
</body>
</html>
