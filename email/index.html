<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>09 Email - AppCenterStudio Premium</title>
<script src="../tema.js"></script>
<style>
:root{--nero:#111;--grigio:#444;--bordo:#d9d9d9;--chiaro:#f7f7f7;--bg:#fbfbfb}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Segoe UI',Tahoma,sans-serif;background:radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(240,242,247,0.6) 35%, rgba(220,225,235,0.3) 100%),repeating-linear-gradient(45deg, rgba(255,255,255,0.4) 0px, rgba(255,255,255,0.4) 2px, transparent 2px, transparent 22px),repeating-linear-gradient(-45deg, rgba(255,255,255,0.25) 0px, rgba(255,255,255,0.25) 1px, transparent 1px, transparent 32px),linear-gradient(180deg,#fafafb 0%,#e4e7ee 100%);background-attachment:fixed;color:var(--nero);min-height:100vh}
.topbar{display:flex;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--bordo);flex-wrap:wrap;align-items:center}
.topbar .pill{background:rgba(255,255,255,0.8);color:#111;border:1px solid #bbb;padding:7px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.topbar .pill:hover{background:#111;color:#fff}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 22px;background:linear-gradient(90deg,#000,#333);color:#fff}
.brand{display:flex;align-items:center;gap:10px}
.brand img{height:34px;background:#fff;border-radius:8px;padding:2px 6px}
.brandName{font-weight:800;font-size:19px;letter-spacing:.5px;font-family:Georgia,serif}
#studioNameHead{font-size:13px;opacity:.85}
button{font-family:inherit}
.btn{background:#111;color:#fff;border:none;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer;font-size:13px}
.btn:hover{opacity:.88}
.btn.secondary{background:rgba(255,255,255,0.9);color:#111;border:1px solid #bbb}
.btn.secondary:hover{background:#111;color:#fff}
.mini{border:1px solid #ccc;background:rgba(255,255,255,0.9);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:12px}
.mini:hover{background:#eee}
main{max-width:1080px;margin:18px auto;padding:0 16px 60px}
.card{background:rgba(255,255,255,0.92);backdrop-filter:blur(8px);border:1px solid var(--bordo);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(15,20,40,.07)}
h2{margin:0 0 12px;font-size:17px;border-left:4px solid #000;padding-left:10px;font-family:Georgia,serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:11px;color:#666;display:block;margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bordo);border-radius:8px;background:#fff;font-size:13px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:2px solid #000}
textarea{min-height:140px}
.hint{font-size:12px;color:#777}
.badge{background:#111;color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid #e3e3e3;font-size:12px;text-align:left;vertical-align:top}
th{background:#111;color:#fff}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:20px}
.modal.active{display:flex}
.modal-content{background:rgba(255,255,255,0.98);backdrop-filter:blur(10px);border-radius:14px;max-width:640px;width:100%;max-height:85vh;overflow-y:auto;padding:24px;border:1px solid var(--bordo);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.riga{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px;border-bottom:1px dashed #e0e0e0}
.testo{white-space:pre-wrap;background:rgba(250,250,250,0.85);backdrop-filter:blur(4px);border:1px solid #e0e0e0;border-radius:8px;padding:12px;font-size:13px;margin-top:10px;box-shadow:0 2px 6px rgba(15,20,40,.04)}
.sync-status{font-size:11px;color:#2e7d32;margin-left:10px}
.sync-status.ko{color:#b00020}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="topbar">
  <button class="pill" onclick="history.back()">← Indietro</button>
  <button class="pill" onclick="goHome()">Home</button>
  <button class="pill" onclick="backupGlobale()">Backup globale</button>
  <label class="pill" style="cursor:pointer">Ripristino globale<input type="file" hidden accept=".json" onchange="ripristinoGlobale(event)"></label>
  <span class="sync-status" id="syncStatus">Sync cloud: --</span>
</div>

<header>
  <div class="brand">
    <img id="studioLogoHead" src="logo.jpg" alt="" onerror="this.remove()">
    <span class="brandName">AppCenterStudio Premium</span>
  </div>
  <div id="studioNameHead"></div>
</header>

<main>
  <div class="card">
    <h2>Mittente (indirizzo dello studio)</h2>
    <p class="hint">Il messaggio parte dal tuo programma di posta o dalla tua webmail quando usi "Invia con app email" o "Invia con PEC".</p>
    <div class="grid">
      <div><label>Email dello studio</label><input id="cfgEmail" placeholder="studio@esempio.it"></div>
      <div><label>PEC dello studio (facoltativa)</label><input id="cfgPec" placeholder="studio@pec.it"></div>
    </div>
    <button class="btn secondary" onclick="salvaConfig()">Salva mittente</button>
  </div>

  <div class="card">
    <h2>Nuova email</h2>
    <label>Modello rapido</label>
    <select id="template" onchange="applicaTemplate()">
      <option value="">-- Testo libero --</option>
      <option value="appuntamento">Promemoria appuntamento</option>
      <option value="pronto">Ordine / album pronto per consegna</option>
      <option value="saldo">Sollecito saldo</option>
      <option value="grazie">Ringraziamento post servizio</option>
      <option value="ricevuta">Conferma ricevuta acconto</option>
    </select>
    <div class="grid">
      <div><label>A: email o PEC destinatario *</label><input id="e_a" placeholder="cliente@esempio.it"></div>
      <div><label>Oggetto *</label><input id="e_oggetto" placeholder="Es. Conferma appuntamento"></div>
    </div>
    <label>Messaggio</label>
    <textarea id="e_testo" placeholder="Scrivi qui il messaggio..."></textarea>
    <p style="margin-top:12px">
      <button class="btn" onclick="inviaMail(false)">Invia con app email</button>
      <button class="btn" onclick="inviaMail(true)">Invia con PEC</button>
      <button class="btn secondary" onclick="copiaTutto()">Copia oggetto + testo</button>
      <button class="btn secondary" onclick="salvaInArchivio()">Salva in archivio</button>
    </p>
  </div>

  <div class="card">
    <h2>Archivio email</h2>
    <div id="listaBox"></div>
  </div>
</main>

<div id="viewModal" class="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 style="margin:0;border:none;padding:0">Dettaglio email</h2>
      <button class="mini" onclick="chiudiModal()">Chiudi</button>
    </div>
    <div id="viewBody"></div>
  </div>
</div>

<script>
const KEY='appcenter_email';
const CFG='emailStudioCfg';
const WORKER='https://acs-api.mairaluigi.workers.dev';
const $=s=>document.querySelector(s);
const fmtData=d=>{if(!d)return '';const p=String(d).split('-');if(p.length!==3)return d;return p[2]+'/'+p[1]+'/'+p[0].slice(2);};
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let studioCode=new URLSearchParams(location.search).get('studio')||sessionStorage.getItem('studio')||'';
if(studioCode)sessionStorage.setItem('studio',studioCode);

let store=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.list)return d;}catch(e){}return{list:[]};})();
let cfg=JSON.parse(localStorage.getItem(CFG)||'{}');
let ident=JSON.parse(localStorage.getItem('studioIdent')||'{}');
let editingId=null;
function save(){localStorage.setItem(KEY,JSON.stringify(store));syncCloud();}
function goHome(){location.href='../benvenuto.html'+(studioCode?'?studio='+studioCode:'');}

async function syncCloud(){
 if(!studioCode)return;
 const box=$('#syncStatus');
 try{
  const fd=new FormData();
  fd.append('studio',studioCode);fd.append('cliente','__db__');
  fd.append('chiave','email');fd.append('data',JSON.stringify(store));
  const r=await fetch(WORKER+'/db-save',{method:'POST',body:fd});
  const j=await r.json();
  if(j.ok){box.textContent='Sync cloud: ✓';box.classList.remove('ko');}
  else{box.textContent='Sync cloud: errore';box.classList.add('ko');}
 }catch(e){box.textContent='Sync cloud: offline';box.classList.add('ko');}
}

async function loadCloud(){
 if(!studioCode)return;
 const box=$('#syncStatus');
 box.textContent='Sync cloud: carico...';
 try{
  const r=await fetch(WORKER+'/db-load?studio='+encodeURIComponent(studioCode)+'&chiave=email&t='+Date.now(),{cache:'no-store'});
  const cloud=await r.json();
  if(cloud&&cloud.list&&cloud.list.length){
   const map={};store.list.forEach(x=>{map[x.id]=x;});
   let add=0;
   cloud.list.forEach(x=>{if(!x.id)x.id=uid();if(!map[x.id]){map[x.id]=x;add++;}});
   store.list=Object.values(map);
   save();
   box.textContent='Sync: '+add+' aggiunte';
  }
 }catch(e){box.textContent='Sync cloud: offline';box.classList.add('ko');}
}

function refreshHead(){
 $('#studioNameHead').textContent=ident.nome||'Email';
 if(ident.logoData)$('#studioLogoHead').src=ident.logoData;
}

function salvaConfig(){
 cfg.email=$('#cfgEmail').value.trim();
 cfg.pec=$('#cfgPec').value.trim();
 localStorage.setItem(CFG,JSON.stringify(cfg));
 alert('Mittente salvato.');
}

const TEMPLATES={
 appuntamento:a=>'Gentile '+a+',\n\nle ricordiamo l\'appuntamento concordato con '+(ident.nome||'il nostro studio')+'.\n\nCordiali saluti,\n'+(ident.nome||'Studio'),
 pronto:a=>'Gentile '+a+',\n\nil suo ordine / album e\' pronto per la consegna.\nLa aspettiamo negli orari di apertura.\n\nCordiali saluti,\n'+(ident.nome||'Studio'),
 saldo:a=>'Gentile '+a+',\n\nle ricordiamo il saldo residuo relativo al servizio effettuato.\n\nCordiali saluti,\n'+(ident.nome||'Studio'),
 grazie:a=>'Gentile '+a+',\n\ngrazie per aver scelto '+(ident.nome||'il nostro studio')+'.\nE\' stato un piacere raccontare il suo giorno speciale.\n\nCordiali saluti,\n'+(ident.nome||'Studio'),
 ricevuta:a=>'Gentile '+a+',\n\nconfermiamo la ricezione dell\'acconto versato.\n\nCordiali saluti,\n'+(ident.nome||'Studio')
};
function applicaTemplate(){
 const t=$('#template').value;
 if(!t)return;
 const nome=$('#e_a').value.trim()||'Cliente';
 const testi={appuntamento:'Promemoria appuntamento',pronto:'Ordine pronto per consegna',saldo:'Sollecito saldo',grazie:'Grazie per averci scelto',ricevuta:'Conferma ricevuta acconto'};
 $('#e_oggetto').value=testi[t];
 $('#e_testo').value=TEMPLATES[t](nome);
}

function mittente(pec){return pec?(cfg.pec||cfg.email||''):(cfg.email||'');}

function inviaMail(pec){
 const a=$('#e_a').value.trim();
 const oggetto=$('#e_oggetto').value.trim();
 const testo=$('#e_testo').value;
 if(!a||!oggetto)return alert('Inserisci destinatario e oggetto.');
 const da=mittente(pec);
 let url='mailto:'+encodeURIComponent(a)+'?subject='+encodeURIComponent(oggetto)+'&body='+encodeURIComponent(testo);
 if(da)url+='&from='+encodeURIComponent(da);
 salvaInArchivio(true);
 window.location.href=url;
}

function copiaTutto(){
 const oggetto=$('#e_oggetto').value.trim();
 const testo=$('#e_testo').value;
 if(!oggetto&&!testo)return alert('Niente da copiare.');
 const txt='Oggetto: '+oggetto+'\n\n'+testo;
 navigator.clipboard.writeText(txt).then(()=>alert('Oggetto e testo copiati.'));
}

function salvaInArchivio(silenzioso){
 const a=$('#e_a').value.trim();
 const oggetto=$('#e_oggetto').value.trim();
 const testo=$('#e_testo').value;
 if(!a||!oggetto)return silenzioso?null:alert('Inserisci destinatario e oggetto.');
 const dati={a,oggetto,testo,data:fmtData(today()),da:mittente(false)};
 if(editingId){
  const m=store.list.find(x=>x.id===editingId);
  if(m)Object.assign(m,dati);
  editingId=null;
 }else{
  dati.id=uid();
  store.list.unshift(dati);
 }
 save();renderLista();pulisciForm();
 if(!silenzioso)alert('Email salvata in archivio.');
 return dati;
}

function pulisciForm(){
 editingId=null;
 $('#e_a').value='';$('#e_oggetto').value='';$('#e_testo').value='';$('#template').value='';
}

function renderLista(){
 const box=$('#listaBox');
 if(!store.list.length){box.innerHTML='<p class="hint">Nessuna email in archivio.</p>';return;}
 box.innerHTML='<table><tr><th>Data</th><th>A</th><th>Oggetto</th><th>Azioni</th></tr>'+
 store.list.map(m=>'<tr><td>'+m.data+'</td><td>'+esc(m.a)+'</td><td>'+esc(m.oggetto)+'</td><td>'+
 '<button class="mini" onclick="visualizza(\''+m.id+'\')">Visualizza</button> '+
 '<button class="mini" onclick="modifica(\''+m.id+'\')">Modifica</button> '+
 '<button class="mini" onclick="elimina(\''+m.id+'\')">Elimina</button></td></tr>').join('')+'</table>';
}
function trova(id){return store.list.find(x=>x.id===id);}
function visualizza(id){
 const m=trova(id);if(!m)return;
 $('#viewBody').innerHTML=
 '<div class="riga"><span>Data</span><b>'+m.data+'</b></div>'+
 '<div class="riga"><span>Da</span><b>'+esc(m.da||'')+'</b></div>'+
 '<div class="riga"><span>A</span><b>'+esc(m.a)+'</b></div>'+
 '<div class="riga"><span>Oggetto</span><b>'+esc(m.oggetto)+'</b></div>'+
 '<div class="testo">'+esc(m.testo)+'</div>'+
 '<p style="margin-top:16px"><button class="btn" onclick="reinvia(\''+m.id+'\',false)">Invia con app email</button> <button class="btn" onclick="reinvia(\''+m.id+'\',true)">Invia con PEC</button></p>';
 $('#viewModal').classList.add('active');
}
function chiudiModal(){$('#viewModal').classList.remove('active');}
function reinvia(id,pec){
 const m=trova(id);if(!m)return;
 let url='mailto:'+encodeURIComponent(m.a)+'?subject='+encodeURIComponent(m.oggetto)+'&body='+encodeURIComponent(m.testo);
 if(mittente(pec))url+='&from='+encodeURIComponent(mittente(pec));
 window.location.href=url;
}
function modifica(id){
 const m=trova(id);if(!m)return;
 editingId=id;
 $('#e_a').value=m.a;$('#e_oggetto').value=m.oggetto;$('#e_testo').value=m.testo;
 window.scrollTo(0,0);
}
function elimina(id){
 if(!confirm('Eliminare questa email?'))return;
 store.list=store.list.filter(x=>x.id!==id);
 save();renderLista();
}

function backupGlobale(){
 const d={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);d[k]=localStorage.getItem(k);}
 const blob=new Blob([JSON.stringify({app:'AppCenterStudioPremium',exportedAt:new Date().toISOString(),data:d},null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='AppCenterStudio_BACKUP_'+today()+'.json';a.click();
 alert('Backup globale scaricato.');
}
function ripristinoGlobale(e){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=ev=>{try{
  const obj=JSON.parse(ev.target.result);const d=obj.data||obj;
  if(typeof d!=='object')throw new Error('File non valido.');
  if(!confirm('Ripristinare? I dati attuali verranno sostituiti.'))return;
  Object.keys(d).forEach(k=>localStorage.setItem(k,d[k]));
  alert('Ripristinato. Ricarico.');location.reload();
 }catch(err){alert('Errore: '+err.message);}};
 r.readAsText(f);e.target.value='';
}

refreshHead();
$('#cfgEmail').value=cfg.email||ident.email||'';
$('#cfgPec').value=cfg.pec||'';
renderLista();
loadCloud().then(renderLista);
</script>
</body>
</html>
